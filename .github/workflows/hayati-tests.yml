name: Hayati tests

on:
  push:
    paths: ['hayati-app/**', '.github/workflows/hayati-tests.yml']
  pull_request:
    paths: ['hayati-app/**', '.github/workflows/hayati-tests.yml']

concurrency:
  group: hayati-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04 now and Playwright 1.56 does not support it
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hayati-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hayati-app/package-lock.json
      - run: npm ci
      # WebKit = محرك Safari، نفس محرك الآيفون
      - run: npx playwright install --with-deps chromium webkit
      - name: Unit tests (bank message reader)
        run: npm run test:unit
      - name: Browser tests (iPhone-size Chromium)
        run: npx playwright test
        env:
          CI: 'true'
          HAYATI_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: hayati-app/playwright-report
          retention-days: 7
