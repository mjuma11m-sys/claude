name: Idarati TestFlight

# «إداراتي» (DW-044): يبني نسخة المتجر للآيفون ويرفعها لـ App Store Connect ← تطلع بـ TestFlight خلال دقايق.
# يشتغل بس لما تضغط «Run workflow» (ما يرفع مع كل push). يحتاج 4 أسرار بـ GitHub (الشرح: docs/company/store/APPLE-UPLOAD.md):
#   APPLE_TEAM_ID · ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_P8 (محتوى ملف ‎.p8 كامل)
# التوقيع تلقائي: Xcode يسوي الشهادة وملف التوزيع بمفتاح الـ API (لازم صلاحية Admin). رقم البناء = رقم التشغيل (يزيد كل مرة).
on:
  workflow_dispatch:
  # زر «Run workflow» يطلع بس لما الملف يكون بالفرع الرئيسي. لين ذاك: تعديل هالملف ودفعه = طلب رفع
  push:
    paths: ['my-rent/ios/ci/upload-request.txt']

concurrency:
  group: idarati-testflight
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.c.outputs.ready }}
    steps:
      - name: Secrets present?
        id: c
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""
          [ -n "$TEAM" ] || miss="$miss APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || miss="$miss ASC_KEY_ID"
          [ -n "$ISSUER" ] || miss="$miss ASC_ISSUER_ID"
          [ -n "$P8" ] || miss="$miss ASC_KEY_P8"
          if [ -n "$miss" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ما انرفع شي — ناقص أسرار GitHub:$miss (الشرح: docs/company/store/APPLE-UPLOAD.md)"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"; echo "✅ الأسرار الأربعة موجودة"
          fi

  upload:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: my-rent
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-rent/package-lock.json
      - run: npm ci
      - name: Tests before upload
        run: npm run test:track && node tests/compat.mjs
      - run: npm run cap:sync -- ios
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" || { echo "❌ ASC_KEY_P8 لازم يكون محتوى ملف .p8 كامل (يبدأ بـ BEGIN PRIVATE KEY)"; exit 1; }
          sed "s/__TEAM_ID__/$TEAM/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
      - name: Archive (Release, build ${{ github.run_number }})
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
          echo "✅ الأرشيف جاهز"
      - name: Export + upload to App Store Connect
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -60 "$RUNNER_TEMP/export.log"; exit 1; }
          echo "✅ انرفع البناء ${{ github.run_number }} — يطلع بـ App Store Connect ← TestFlight بعد المعالجة (5–30 دقيقة)"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: idarati-testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          retention-days: 7
