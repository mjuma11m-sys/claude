name: Idarati Android

# «إداراتي» (DW-038): يبني تطبيق أندرويد (APK للتجربة) من نفس الكود. الملف ينحفظ مع كل تشغيل (Artifacts):
# نزّله وثبّته على جوال أندرويد (السماح بالتثبيت من مصادر غير معروفة). نسخة المتجر (AAB موقّع) تحتاج مفتاح المالك.
# DW-040: بعدها يشغّله على محاكي أندرويد 15 (edge-to-edge إجباري): يفتح، يصوّر، يفحص الهيدر وزر الرجوع.
on:
  push:
    paths: ['my-rent/src/**', 'my-rent/android/**', 'my-rent/scripts/android-*', 'my-rent/capacitor.config.json', 'my-rent/package.json', '.github/workflows/idarati-android.yml']
  workflow_dispatch:

concurrency:
  group: idarati-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: my-rent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-rent/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run cap:sync -- android
      - name: Build debug APK
        working-directory: my-rent/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: idarati-android-apk
          path: my-rent/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Enable KVM (emulator speed)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android 15 emulator, check screen, insets, back button
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: my-rent
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idarati-android-screenshot
          path: |
            my-rent/android-smoke/launch.png
            my-rent/android-smoke/resume.png
            my-rent/android-smoke/ui.xml
          retention-days: 14
