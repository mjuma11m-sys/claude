<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(../IBMPlexSansArabic-Regular.ttf);font-weight:400}
@font-face{font-family:Plex;src:url(../IBMPlexSansArabic-Bold.ttf);font-weight:700}
@page{size:A4;margin:0}
html,body{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Plex,sans-serif;color:#F5F2EB}
.page{width:210mm;height:297mm;background:#14213A;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pattern{position:absolute;inset:0;opacity:.07}
.top{padding:22mm 20mm 0;display:flex;justify-content:space-between;align-items:center;position:relative;font-size:10pt;color:#C9963A;letter-spacing:.5pt}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 20mm;position:relative}
.hero svg{width:44mm;height:44mm;margin-bottom:10mm}
.kicker{font-size:13pt;color:#C9963A;margin:0 0 2mm}
h1{font-size:54pt;line-height:1.1;margin:0;font-weight:700}
.en{font-size:16pt;color:#C9963A;letter-spacing:2pt;direction:ltr;margin:2mm 0 6mm}
.sub{font-size:14pt;margin:0;opacity:.85;max-width:140mm;line-height:1.7}
.rule{width:30mm;height:1.2mm;background:#C9963A;margin:10mm 0 0}
.foot{position:relative;margin:0 20mm 20mm;border-top:.4mm solid rgba(201,150,58,.5);padding-top:6mm;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm;font-size:10pt}
.foot b{display:block;color:#C9963A;font-weight:400;font-size:9pt;margin-bottom:1mm}
.tag{border:.3mm solid #C9963A;color:#C9963A;border-radius:10mm;padding:1mm 4mm;font-size:9.5pt}
</style></head>
<body><div class="page">
<svg class="pattern" viewBox="0 0 210 297" preserveAspectRatio="xMidYMid slice"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M14 3 L17.3 10.7 L25 14 L17.3 17.3 L14 25 L10.7 17.3 L3 14 L10.7 10.7Z" fill="none" stroke="#C9963A" stroke-width=".5"/></pattern></defs><rect width="210" height="297" fill="url(#p)"/></svg>
<div class="top"><span>طلب مراجعة قانونية</span><span class="tag">قيد التطوير · نسخة تجريبية</span></div>
<div class="hero">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="72 72 368 368">
<g transform="translate(256 256) scale(1.1) translate(-256 -265)"><rect x="178" y="112" width="156" height="30" rx="6" fill="#C9963A"/><rect x="194" y="142" width="124" height="256" fill="#C9963A"/><rect x="212" y="164" width="18" height="96" rx="5" fill="#14213A"/><rect x="247" y="164" width="18" height="96" rx="5" fill="#14213A"/><rect x="282" y="164" width="18" height="96" rx="5" fill="#14213A"/><path d="M234 398 V344 Q234 316 256 308 Q278 316 278 344 V398 Z" fill="#14213A"/><rect x="146" y="394" width="220" height="24" rx="10" fill="#C9963A"/></g>
</svg>

  <p class="kicker">حماية البيانات · سياسة الخصوصية · شروط الاستخدام</p>
  <h1>إداراتي</h1>
  <div class="en">IDARATI <span style="opacity:.7;font-size:10pt;letter-spacing:1.5pt">· BY WADQA</span></div>
  <p class="sub">تطبيق لإدارة الإيجارات والعقارات العائلية في مملكة البحرين</p>
  <div class="rule"></div>
</div>
<div class="foot">
  <div><b>مقدّم من</b>محمد جمعة<br>مطوّر التطبيق ومالكه</div>

</div>
</div></body></html>
