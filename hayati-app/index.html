<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>حياتي</title>
<script>document.documentElement.lang = "ar"; document.documentElement.dir = "rtl";</script>
  <meta name="description" content="مصاريفي وجدولي ومهامي في مكان واحد">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A1A1E" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حياتي">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preload" href="vendor/fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/plex-arabic-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    html { direction: rtl; }
    header.top { top: env(safe-area-inset-top, 0px) !important; padding-top: 14px !important; }
    :root {
      /* هوية «حياتي» — لؤلؤ وبحر */
      --sea: #0E3B43;
      --pearl: #E8DCC4;
      --coral: #FF6B4A;
      --bg: #F7F4EE;
      --surface: #ffffff;
      --surface-2: #EFEAE0;
      --border: #E4DDD0;
      --text: #0B2328;
      --text-2: #33494D;
      --muted: #5E6C6E;
      --brand: #13636B;
      --brand-2: #1A8A8F;
      --brand-soft: #E1EEEC;
      --on-brand: #ffffff;
      --expense: #C23434;
      --income: #23765B;
      --warn: #B45309;
      --warn-soft: #FDF1DC;
      --danger-soft: #FBE4E1;
      --hero: linear-gradient(140deg, #0E3B43 0%, #13535B 58%, #1B6B70 100%);
      --hero-dark: linear-gradient(140deg, #0A1A1E 0%, #12333A 100%);
      --shadow-sm: 0 1px 2px rgba(11, 35, 40, .05), 0 1px 1px rgba(11, 35, 40, .03);
      --shadow: 0 1px 2px rgba(11, 35, 40, .05), 0 6px 20px -8px rgba(11, 35, 40, .12);
      --shadow-lg: 0 18px 40px -16px rgba(14, 59, 67, .45);
      --radius: 20px;
      --radius-sm: 14px;
      --tabbar-h: 68px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0A1A1E; --surface: #10262B; --surface-2: #163238; --border: #1F3D43;
        --text: #EFE8DA; --text-2: #C9C2B4; --muted: #9EAEAF;
        --brand: #6EC5C0; --brand-2: #8FD6D1; --brand-soft: #133A3E; --on-brand: #0A1A1E;
        --expense: #FF7A6B; --income: #4FC79E; --warn: #F2B84B; --warn-soft: #3A2C10; --danger-soft: #3B1A18;
        --hero: linear-gradient(140deg, #0F4A52 0%, #0E3B43 58%, #0B2E34 100%);
        --hero-dark: linear-gradient(140deg, #0C2227 0%, #133A40 100%);
        --shadow-sm: none; --shadow: none; --shadow-lg: 0 18px 40px -18px rgba(0, 0, 0, .7);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0A1A1E; --surface: #10262B; --surface-2: #163238; --border: #1F3D43;
      --text: #EFE8DA; --text-2: #C9C2B4; --muted: #9EAEAF;
      --brand: #6EC5C0; --brand-2: #8FD6D1; --brand-soft: #133A3E; --on-brand: #0A1A1E;
      --expense: #FF7A6B; --income: #4FC79E; --warn: #F2B84B; --warn-soft: #3A2C10; --danger-soft: #3B1A18;
      --hero: linear-gradient(140deg, #0F4A52 0%, #0E3B43 58%, #0B2E34 100%);
      --hero-dark: linear-gradient(140deg, #0C2227 0%, #133A40 100%);
      --shadow-sm: none; --shadow: none; --shadow-lg: 0 18px 40px -18px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    svg.i { width: 20px; height: 20px; flex: none; }
    .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; letter-spacing: -.01em; }
    .cur { font-size: .62em; font-weight: 600; opacity: .7; margin-inline-start: 3px; letter-spacing: 0; }

    /* ---------- الرأس ---------- */
    header.top {
      position: sticky; top: 0; z-index: 10;
      padding: calc(env(safe-area-inset-top) + 14px) 20px 12px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: saturate(1.8) blur(18px); -webkit-backdrop-filter: saturate(1.8) blur(18px);
    }
    .top-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .top-text { flex: 1; min-width: 0; }
    .top-text small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
    .top-text h1 { font-size: 28px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -.01em; }
    .icon-btn {
      position: relative; width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--border);
      display: grid; place-items: center; background: var(--surface); color: var(--text-2); box-shadow: var(--shadow-sm);
    }
    .icon-btn:active { transform: scale(.96); }
    .sync-dot {
      position: absolute; top: -3px; left: -3px; width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--bg); background: var(--muted);
    }
    .sync-dot.ok { background: var(--income); }
    .sync-dot.busy { background: var(--warn); }
    .sync-dot.err { background: var(--expense); }

    main { max-width: 720px; margin: 0 auto; padding: 4px 16px 16px; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ---------- البطاقات ---------- */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
    }
    .card.flush { padding: 4px 16px; }
    .sec-head { display: flex; align-items: center; gap: 8px; margin: 22px 4px 10px; }
    .sec-head h2 { font-size: 16px; margin: 0; font-weight: 700; flex: 1; }
    .sec-head .link { color: var(--brand); font-size: 13px; font-weight: 600; background: none; border: 0; padding: 4px; }
    .sec-head .count { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 9px; font-weight: 600; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    /* البطاقة الرئيسية */
    .hero {
      position: relative; overflow: hidden; border-radius: 24px; padding: 20px; margin-bottom: 14px;
      background: var(--hero); color: #fff; box-shadow: var(--shadow-lg);
    }
    .hero.dark { background: var(--hero-dark); }
    .hero::before, .hero::after {
      content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .08); pointer-events: none;
    }
    .hero::before { width: 220px; height: 220px; top: -90px; left: -60px; }
    .hero::after { width: 140px; height: 140px; bottom: -70px; right: -30px; background: rgba(255, 255, 255, .06); }
    .hero > * { position: relative; }
    .hero .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; background: rgba(255, 255, 255, .16); padding: 4px 10px; border-radius: 99px; }
    .hero .big { font-size: 26px; font-weight: 700; line-height: 1.25; margin: 10px 0 4px; }
    .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; opacity: .88; }
    .hero .meta span { display: inline-flex; align-items: center; gap: 5px; }
    .hero .meta svg.i { width: 15px; height: 15px; }
    .hero .track { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .22); margin-top: 16px; overflow: hidden; }
    .hero .track > span { display: block; height: 100%; border-radius: 99px; background: #fff; }
    .hero .amount-big { font-size: 34px; font-weight: 700; line-height: 1.1; margin: 8px 0 2px; }
    .hero .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .hero .split > div { background: rgba(255, 255, 255, .12); border-radius: 14px; padding: 10px 12px; }
    .hero .split small { display: block; font-size: 12px; opacity: .8; }
    .hero .split b { font-size: 16px; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: #E8DCC4; box-shadow: 0 0 0 0 rgba(232, 220, 196, .7); animation: pulse 1.8s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(232, 220, 196, 0); } 100% { box-shadow: 0 0 0 0 rgba(232, 220, 196, 0); } }

    /* بلاطات سريعة */
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
    .tile {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 12px; box-shadow: var(--shadow-sm);
      min-width: 0; text-align: start; display: block; width: 100%;
    }
    .tile .ti { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 10px; }
    .tile .ti svg.i { width: 17px; height: 17px; }
    .tile .lbl { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .val { font-size: clamp(13px, 3.9vw, 17px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .val .cur { margin-inline-start: 2px; }
    /* DW-025 أسوأ بيانات: المبالغ الكبيرة تصغر لين تركب (fit.js)، والأسماء الطويلة سطرين */
    .hero .split > div { min-width: 0; }
    .hero .amount-big, .hero .split b:has(.cur), .fit { display: block; white-space: nowrap; overflow: hidden; }
    .hero .split b:not(:has(.cur)), .goal-top b:not(.fit) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

    /* حلقة الميزانية */
    .ring { position: relative; width: 68px; height: 68px; flex: none; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; }

    /* ---------- القوائم ---------- */
    .list { list-style: none; margin: 0; padding: 0; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .row:last-child { border-bottom: 0; }
    .row:active { opacity: .7; }
    .row .main { flex: 1; min-width: 0; }
    .row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .row .title > .t { overflow: hidden; text-overflow: ellipsis; }
    .row .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .row .amount { font-weight: 700; white-space: nowrap; font-size: 15px; }
    .amount.expense { color: var(--text); }
    .amount.income { color: var(--income); }
    .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; }
    .ico svg.i { width: 20px; height: 20px; }
    .tag {
      display: inline-flex; align-items: center; gap: 4px; flex: none; font-size: 11px; padding: 1px 8px; border-radius: 99px;
      background: var(--surface-2); color: var(--muted); font-weight: 600; line-height: 1.6;
    }
    .tag.warn { background: var(--warn-soft); color: var(--warn); }
    .tag.danger { background: var(--danger-soft); color: var(--expense); }
    .tag.brand { background: var(--brand-soft); color: var(--brand); }
    .tag svg.i { width: 11px; height: 11px; }

    .day-head { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 6px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }

    /* الفئات */
    .cat { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
    .cat .ico { width: 36px; height: 36px; border-radius: 11px; }
    .cat .ico svg.i { width: 17px; height: 17px; }
    .cat .body { flex: 1; min-width: 0; }
    .cat .line { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 6px; }
    .cat .line span { font-weight: 600; }
    .cat .line b { font-weight: 700; white-space: nowrap; flex: none; }
    .cat .line span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .meter > span { display: block; height: 100%; border-radius: 99px; }

    /* رسم آخر ٧ أيام */
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 132px; padding-top: 8px; }
    .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .chart .bar { width: 100%; max-width: 34px; border-radius: 9px 9px 4px 4px; background: color-mix(in srgb, var(--brand) 22%, transparent); min-height: 4px; }
    .chart .col.today .bar { background: var(--hero); }
    .chart .lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
    .chart .col.today .lbl { color: var(--brand); }
    .chart .v { font-size: 10.5px; color: var(--muted); font-weight: 600; min-height: 15px; }

    /* ---------- الجدول ---------- */
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
    .wd {
      border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 8px 0 7px;
      display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: var(--shadow-sm);
    }
    .wd small { font-size: 11px; color: var(--muted); font-weight: 600; }
    .wd b { font-size: 17px; font-weight: 700; }
    .wd i { width: 5px; height: 5px; border-radius: 50%; background: transparent; margin-top: 2px; }
    .wd.has i { background: var(--brand); }
    .wd.on { background: var(--hero); border-color: transparent; color: #fff; box-shadow: var(--shadow-lg); }
    .wd.on small { color: rgba(255, 255, 255, .8); }
    .wd.on i { background: #fff; }
    .wd.is-today:not(.on) b { color: var(--brand); }

    .timeline { position: relative; }
    .slot { display: flex; gap: 12px; align-items: stretch; margin-bottom: 10px; cursor: pointer; }
    .slot .when { width: 64px; flex: none; text-align: center; padding-top: 12px; white-space: nowrap; }
    .slot .when b { display: block; font-size: 14px; font-weight: 700; }
    .slot .when small { font-size: 11px; color: var(--muted); }
    .slot.past .when small { color: var(--text-2); }   /* ♿ مع شفافية «فات» يظل فوق 4.5:1 */
    .slot .box {
      flex: 1; min-width: 0; border-radius: 16px; padding: 12px 14px; border: 1px solid var(--border);
      background: var(--surface); box-shadow: var(--shadow-sm); border-inline-start: 4px solid var(--c);
    }
    .slot .box .name { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
    .slot .box .where { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .slot .box .where svg.i { width: 13px; height: 13px; }
    .slot.now .box { background: color-mix(in srgb, var(--c) 10%, var(--surface)); border-color: color-mix(in srgb, var(--c) 35%, transparent); }
    .slot.past { opacity: .8; }   /* ♿ .55 كانت تنزل التباين تحت 4.5:1 (WCAG AA) */
    .slot .prog { height: 4px; background: color-mix(in srgb, var(--c) 18%, transparent); border-radius: 99px; margin-top: 10px; overflow: hidden; }
    .slot .prog > span { display: block; height: 100%; background: var(--c); border-radius: 99px; }

    .cta {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius);
      background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 20%, transparent); margin: 6px 0 14px; cursor: pointer; width: 100%; text-align: start;
    }
    .cta .ico { background: var(--brand); color: var(--on-brand); }
    .cta b { display: block; font-size: 15px; color: var(--text); }
    .cta small { color: var(--muted); font-size: 12.5px; }
    .cta > svg.i { color: var(--brand); }

    /* ---------- المهام ---------- */
    .seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; margin-bottom: 14px; gap: 2px; }
    .seg button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 11px; font-weight: 600; color: var(--muted); font-size: 14px; white-space: nowrap; }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
    .seg button.on.expense { color: var(--expense); }
    .seg button.on.income { color: var(--income); }
    .summary { display: flex; gap: 8px; margin-bottom: 4px; overflow-x: auto; scrollbar-width: none; }
    .summary::-webkit-scrollbar { display: none; }
    .pill { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); }
    .pill svg.i { width: 15px; height: 15px; }
    .check {
      width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--border); flex: none;
      display: grid; place-items: center; background: transparent; padding: 0; color: transparent; transition: all .15s;
    }
    .check svg.i { width: 15px; height: 15px; }
    .check.on { background: var(--income); border-color: var(--income); color: #fff; }
    .done .title .t { text-decoration: line-through; color: var(--muted); }
    .late { color: var(--expense) !important; }

    /* ---------- الأزرار ---------- */
    .btn {
      border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; font-weight: 600;
      background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm);
    }
    .btn:active { transform: scale(.98); }
    .btn svg.i { width: 18px; height: 18px; }
    .btn.primary { background: var(--brand); border-color: transparent; color: var(--on-brand); }
    /* أزرار الدخول السريع (إرشادات Apple وGoogle: أسود/أبيض بالشعار) */
    .btn.sso { gap: 10px; margin-bottom: 10px; font-weight: 600; }
    .btn.sso.apple { background: #000; border-color: #000; color: #fff; }
    .btn.sso.google { background: #fff; border-color: #dadce0; color: #1f1f1f; }
    .or-line { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; color: var(--muted); font-size: 13px; }
    .or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .btn.danger { background: var(--danger-soft); color: var(--expense); border-color: transparent; box-shadow: none; }
    .btn.ghost { background: var(--surface-2); border-color: transparent; box-shadow: none; }
    .btn.block { width: 100%; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .action {
      display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; border: 1px solid var(--border);
      background: var(--surface); box-shadow: var(--shadow-sm); font-weight: 600; font-size: 14px; text-align: start;
    }
    .action .ico { width: 34px; height: 34px; border-radius: 10px; }
    .action .ico svg.i { width: 17px; height: 17px; }

    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .month-nav b { font-size: 16px; font-weight: 700; }
    .month-nav .icon-btn { width: 38px; height: 38px; border-radius: 12px; }
    .month-nav .icon-btn[disabled] { opacity: .35; }

    .empty { text-align: center; padding: 26px 12px; color: var(--muted); }
    .empty .ico { margin: 0 auto 10px; width: 52px; height: 52px; border-radius: 16px; background: var(--surface-2); color: var(--muted); }
    .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 2px; }
    .empty p { margin: 0; font-size: 13px; }
    .empty a, .empty button.link { color: var(--brand); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; }

    /* ---------- شريط التبويبات ---------- */
    nav.tabbar {
      position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 10px);

    /* DW-026 إمكانية الوصول: مساحة لمس 44px على الأقل بدون ما يتغير الشكل (WCAG 2.5.5 / Apple HIG) */
    :where(.check, .icon-x, .link, .icon-btn, .chip, .seg button, .stepper button, #sheetCancel, #sheetSave, .undo-bar button) { position: relative; }

    .body-top b { font-size: 20px; }
    .mini-chart { margin-bottom: 12px; }
    .mini-chart > b { font-size: 13px; }
    .mini-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 74px; margin-top: 6px; }
    .mini-bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; }
    .mini-bars i { width: 100%; max-width: 26px; min-height: 3px; border-radius: 6px 6px 3px 3px; }
    .mini-bars small { font-size: 10px; color: var(--muted); }
    .receipt { display: grid; gap: 8px; }
    .receipt img { width: 100%; max-height: 320px; object-fit: contain; border-radius: 14px; background: var(--surface-2); }
    .prayer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
    .prayer-grid div { background: var(--surface-2); border-radius: 12px; padding: 8px 2px; }
    .prayer-grid small { display: block; font-size: 11px; color: var(--muted); }
    .prayer-grid b { font-size: 12.5px; }
    .need-card .stepper b { font-size: 16px; }
    /* ---------- إضافات 2 ---------- */
    .ch-empty, .ch-head { display: flex; align-items: center; gap: 12px; }
    .ch-head { margin-bottom: 6px; }
    .ch-head span { font-size: 22px; }
    .ch-head b { flex: 1; }
    .wk-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; margin: 10px 0; }
    .wk-grid i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
    .wk-grid i.on { background: #10b981; }
    .wk-grid i.now { background: #f59e0b; }
    .day-dots { display: flex; gap: 6px; margin: 8px 0; }
    .day-dots i { flex: 1; height: 34px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; color: var(--muted); }
    .day-dots i.on { background: #10b981; color: #fff; }
    .day-dots i.bad { background: var(--danger-soft); color: var(--expense); }
    .as-head, .as-row { display: grid; grid-template-columns: 1fr 64px 64px 30px; gap: 6px; align-items: center; }
    .as-head { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
    .as-row { margin-bottom: 6px; }
    .as-row input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px; font-size: 14px; }
    .as-row input[inputmode] { direction: ltr; text-align: center; }
    .as-row button { border: 0; background: none; color: var(--expense); font-size: 15px; }
    .as-target { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-weight: 600; }
    .flash { min-height: 220px; border-radius: 22px; padding: 26px 20px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
      display: flex; flex-direction: column; justify-content: center; text-align: center; cursor: pointer; }
    .flash .fq { font-size: 20px; font-weight: 700; unicode-bidi: plaintext; }
    .flash .fa { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--border); font-size: 17px; color: var(--brand); unicode-bidi: plaintext; white-space: pre-wrap; }
    .focus-ov { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at 50% 30%, #13535B, #0A1A1E 70%); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
    .focus-x { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 18px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; }
    .focus-course { font-size: 18px; opacity: .8; font-weight: 600; }
    .focus-time { font-size: clamp(72px, 24vw, 140px); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
    .focus-phase { font-size: 15px; opacity: .7; }
    .focus-sounds { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 28px; }
    .focus-sounds button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; border-radius: 99px; padding: 9px 16px; font-weight: 600; }
    .focus-sounds button.on { background: #fff; color: #0E3B43; }
    .focus-tip { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font-size: 13px; opacity: .55; margin: 0; }
    .alt-btn { border: 0; background: var(--surface-2); color: var(--text-2); border-radius: 99px; padding: 5px 12px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; }
    .alt-btn svg.i { width: 13px; height: 13px; }
    .alt-list { display: grid; gap: 6px; margin-top: 8px; }
    .alt-list a { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); text-decoration: none; font-weight: 600; font-size: 13.5px; direction: ltr; justify-content: flex-end; }
    .alt-list a svg.i { width: 13px; height: 13px; }
    .shop-add, .chat-form { display: flex; gap: 8px; margin-bottom: 14px; }
    .shop-add input, .chat-form input { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 13px 14px; font-size: 16px; outline: none; }
    .shop-add input:focus, .chat-form input:focus { border-color: var(--brand); }
    .exams-card .ex-line { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .exams-card .ex-line:last-of-type { border-bottom: 0; }
    .ex-n { width: 50px; height: 50px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex: none; line-height: 1; }
    .ex-n small { font-size: 10px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .ex-n.soon { background: var(--danger-soft); color: var(--expense); }
    .moods { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 10px; }
    .mood { flex: 1; font-size: 30px; padding: 8px 0; border-radius: 14px; border: 2px solid transparent; background: var(--surface-2); filter: grayscale(.6); }
    .mood.on { border-color: var(--brand); background: var(--brand-soft); filter: none; transform: scale(1.05); }
    .jr-text { width: 100%; min-height: 70px; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 12px; font-size: 15px; resize: vertical; }
    .mood-strip { display: flex; gap: 4px; overflow-x: auto; }
    .mood-strip div { display: flex; flex-direction: column; align-items: center; min-width: 30px; }
    .mood-strip span { font-size: 22px; }
    .mood-strip small { font-size: 10px; color: var(--muted); }
    .chat { max-height: 46vh; min-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
    .msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.6; white-space: normal; }
    .msg.user { align-self: flex-start; background: var(--brand); color: var(--on-brand); border-bottom-right-radius: 6px; }
    .msg.assistant { align-self: flex-end; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
    .msg.typing { color: var(--muted); }
    .chips.quick .chip { font-size: 13px; }
    .hidden { display: none !important; }
    /* حبة التبويب المختار */
    nav.tabbar .tab-pill { position: absolute; top: 9px; left: 0; height: 50px; border-radius: 16px; background: var(--brand-soft); pointer-events: none; z-index: 0; }
    nav.tabbar button.tab, nav.tabbar .add { position: relative; z-index: 1; }
    /* ---------- الحركة ---------- */
    .toast { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
    @media (prefers-reduced-motion: no-preference) {
      .btn, .icon-btn, .check, .habit, .cup, .chip, .tile, .action, .mood, .cat-pick, .wd, .seg button, nav.tabbar button.tab, nav.tabbar .add, .rest-btn, .alt-btn, .hero-btn, .stepper button, .grade-grid button {
        transition: transform 160ms var(--ease-out);
      }
      .check:active, .cup:active, .stepper button:active { transform: scale(.88); }
      .habit:active, .chip:active, .mood:active, .cat-pick:active, .wd:active, .rest-btn:active, .alt-btn:active, .hero-btn:active, .grade-grid button:active { transform: scale(.95); }
      .tile:active, .action:active { transform: scale(.97); }
      nav.tabbar button.tab:active { transform: scale(.92); }
    }
    @media (prefers-reduced-motion: reduce) {
      .toast, .toast.show { transform: translate(-50%, 0); }
    }
  </style>
