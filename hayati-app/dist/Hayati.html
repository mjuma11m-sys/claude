      open_tasks: st.tasks.filter((t) => !t.done).map((t) => ({ title: t.title, kind: t.kind, due: t.due_at ? t.due_at.slice(0, 16) : null })).slice(0, 30),
      goals: st.goals.map((g) => ({ name: g.name, target: g.target, saved: g.saved, deadline: g.deadline || null })),
      debts_open: st.debts.filter((d) => !d.settled).map((d) => ({ person: d.person, amount: d.amount, direction: d.direction === 'lent' ? 'owes me' : 'I owe' })),
      subscriptions: st.subscriptions.filter((s) => s.active !== false).map((s) => ({ name: s.name, amount: s.amount, cycle: s.cycle })),
      gpa: { cumulative: cum.gpa != null ? +cum.gpa.toFixed(2) : null, credits: cum.credits },
      study_minutes_last_7_days: st.study_sessions.filter((x) => Date.now() - new Date(x.started_at) < 7 * 86400000).reduce((s, x) => s + Number(x.minutes), 0),
      body_weight: st.body.slice(-4).map((b) => ({ date: b.date, kg: b.weight })),
    };
  }
  const RULES = () => 'أنت مساعد داخل تطبيق «حياتي» الشخصي لطالب جامعي بالبحرين. جاوب بالعربي بلهجة خليجية بسيطة، باختصار (3–6 أسطر أو نقاط قليلة)، ' +
    'وبالأرقام من البيانات تحت فقط. لا تخترع أرقام أو مواعيد مو موجودة؛ لو المعلومة ناقصة قل كذا. المبالغ بالدينار البحريني بثلاث خانات عشرية. ' +
    'لو طلب خطة (مذاكرة/توفير) اعطه خطة عملية بأيام وأوقات تناسب جدوله.\n\nبيانات المستخدم (JSON):\n' + JSON.stringify(dataSnapshot());
  function assistantSheet() {
    const QUICK = ['كم صرفت على القهوة والأكل هالشهر؟', 'رتّب لي مذاكرة هالأسبوع حسب جدولي واختباراتي', 'كيف أوفّر أسرع لهدف الزواج؟', 'وش أكثر شي يضيّع فلوسي؟'];
    const drawMsgs = () => chatTurns.map((t) => '<div class="msg ' + t.role + '">' + h(t.content).replace(/\n/g, '<br>') + '</div>').join('');
    A.openSheet({
      title: 'المساعد الذكي', cancelLabel: 'تم',
      body: '<div class="chat" id="chat">' + (chatTurns.length ? drawMsgs() : '<div class="empty"><div class="ico">' + I('sparkle') + '</div><b>اسألني عن يومك</b><p>أجاوبك من بياناتك: صرفك، جدولك، مهامك، وأهدافك</p></div>') + '</div>' +
        '<div class="chips quick" style="margin:10px 0">' + QUICK.map((q) => '<button type="button" class="chip" data-q="' + h(q) + '">' + h(q) + '</button>').join('') + '</div>' +
        '<form class="chat-form" id="chatForm"><input name="q" placeholder="اكتب سؤالك…" autocomplete="off"><button class="btn primary" type="submit" aria-label="إرسال">' + I('arrowUp') + '</button></form>' +
        '<p class="small muted" style="margin:8px 4px 0">يستخدم حسابك في Claude. أول مرة بيطلب إذنك.</p>',
      mount(root) {
        const chat = root.querySelector('#chat');
        const ask = async (q) => {
          if (!q || !sampleFn) return;
          if (chatCtl) chatCtl.abort();
          chatTurns.push({ role: 'user', content: q });
          chat.innerHTML = drawMsgs() + '<div class="msg assistant typing">يفكّر…</div>';
          chat.scrollTop = chat.scrollHeight;
          const bubble = chat.lastElementChild;
          chatCtl = new AbortController();
          try {
            const turns = chatTurns.slice(-8);
            const { text } = await sampleFn([{ role: 'user', content: RULES() }].concat(turns[0].role === 'assistant' ? turns.slice(1) : turns), {
              cache: false, signal: chatCtl.signal, onText: ({ text: t }) => { bubble.classList.remove('typing'); bubble.innerHTML = h(t).replace(/\n/g, '<br>'); chat.scrollTop = chat.scrollHeight; },
            });
            chatTurns.push({ role: 'assistant', content: text });
          } catch (e) {
            const msg = { not_granted: 'ما انسمح للمساعد يستخدم Claude.', rate_limited: 'وصلت الحد المسموح حالياً، جرّب بعد شوي.', cancelled: '' }[e && e.code];
            if (e && e.text) chatTurns.push({ role: 'assistant', content: e.text });
            bubble.classList.remove('typing');
            bubble.textContent = e && e.text ? e.text : msg != null ? msg : 'صار خلل، جرّب مرة ثانية.';
            if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) document.getElementById('assistBtn').classList.add('hidden');
          }
        };
        root.querySelector('#chatForm').onsubmit = (e) => { e.preventDefault(); const q = e.target.q.value.trim(); e.target.q.value = ''; ask(q); };
        root.querySelector('.quick').onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) ask(b.dataset.q); };
        chat.scrollTop = chat.scrollHeight;
      },
    });
  }

  // ================= الربط =================
  wrap('todayTop', (prev) => prev() + eventsCard());
  wrap('todayMid', (prev) => prev() + journalCard());
  wrap('viewHealth', (prev) => prev() + moodSection());
  E.goalsTop = goalsTop;
  E.moneyActions = () => '<button class="btn ghost block" style="margin:10px 0 4px" data-action="year">' + I('chart') + 'ملخص السنة</button>';
  E.courseExtra = courseExtra;
  E.courseClick = courseClick;
  E.focusExtra = () => '<button class="btn primary block" style="margin:14px 0 4px" data-action="focus-mode">🎧 وضع التركيز (شاشة كاملة + أصوات هادية)</button>' + cardsSection();
  E.chooserItems = (item) => item('event', 'calendar', '#ec4899', 'مناسبة / تجديد', 'عيد ميلاد، الليسن، السيبيآر…') + item('shop', 'cart', '#16a34a', 'غرض للمشتريات', 'قائمة البقالة') + item('card', 'book', '#8b5cf6', 'بطاقة مراجعة', 'سؤال وجواب لمادة');
  E.pick = (k) => { if (k === 'event') eventForm(); else if (k === 'card') cardForm(); else if (k === 'shop') { A.closeSheet(); A.ui.tasksSeg = 'shop'; A.go('tasks'); } };
  E.tasksTop = () => {
    const cur = A.ui.tasksSeg || 'tasks';
    const bar = seg([['tasks', 'المهام'], ['shop', 'المشتريات'], ['events', 'المناسبات']], cur, 'tasks-seg');
    if (cur === 'shop') return { full: true, html: bar + shoppingView() };
    if (cur === 'events') return { full: true, html: bar + eventsView() };
    return bar + examsCard();
  };
  E.tasksFab = () => { const cur = A.ui.tasksSeg || 'tasks'; if (cur === 'events') { eventForm(); return true; } if (cur === 'shop') { const i = document.querySelector('#shopForm input'); if (i) i.focus(); return true; } return false; };
  wrap('action', (prev, name, el, e) => {
    const id = el.dataset.id;
    switch (name) {
      case 'tasks-seg': A.ui.tasksSeg = el.dataset.k; A.render(); return;
      case 'ch-add': chAddSheet(); return;
      case 'ch-del': A.ask('توقف التحدي؟', 'إيقاف').then((ok) => { if (ok) saveCh(challenges().filter((c) => c.id !== id)); }); return;
      case 'ch-week': saveCh(challenges().map((c) => (c.id === id ? Object.assign({}, c, { done: (c.done || []).concat(Number(el.dataset.w)) }) : c))); A.toast('عاش 💪'); return;
      case 'ch-restart': saveCh(challenges().map((c) => (c.id === id ? Object.assign({}, c, { start: dateKey(), done: [] }) : c))); return;
      case 'year': yearSheet(); return;
      case 'card-add': cardForm(); return;
      case 'card-review': reviewSheet(id || null); return;
      case 'focus-mode': focusMode(); return;
      case 'ev-edit': eventForm(st.events.find((x) => x.id === id)); return;
      case 'shop-toggle': { const x = st.shopping.find((y) => y.id === id); if (x) S.upsert('shopping', Object.assign({}, x, { done: !x.done })); return; }
      case 'shop-del': e && e.stopPropagation(); S.remove('shopping', id); return;
      case 'shop-finish': shopFinish(); return;
      case 'plan-all': planAll(); return;
      case 'mood': saveJournal({ mood: Number(el.dataset.m) }); return;
      case 'jr-save': { const t = document.getElementById('jrText'); saveJournal({ text: t ? t.value.trim() : '' }); A.toast('انحفظ ✓'); return; }
      default: prev(name, el, e);
    }
  });

  A.render();
})();

</script>
  <script>/* extras3.js */
// تقرير الأسبوع + وضع الحارس ⚽🧤
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E) return;
  const { S, st, I, h, fmt, money, tint } = A;
  const wrap = (name, fn) => { const prev = E[name]; E[name] = (...a) => fn(prev ? prev : () => '', ...a); };
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* تجاهل */ } }
  const r1 = (n) => Math.round(n * 10) / 10;

  // ================= تقرير الأسبوع =================
  // آخر 7 أيام (اليوم منها) مقابل الـ7 اللي قبلها
  function range(offsetWeeks) {
    const end = new Date(); end.setHours(23, 59, 59, 999); end.setDate(end.getDate() - 7 * offsetWeeks);
    const start = new Date(end); start.setDate(start.getDate() - 6); start.setHours(0, 0, 0, 0);
    const keys = []; for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) keys.push(dateKey(d));
    return { start, end, keys, has: (t) => { const x = new Date(t); return x >= start && x <= end; } };
  }

  function stats(w) {
    const tx = st.transactions.filter((t) => t.occurred_at && w.has(t.occurred_at));
    const exp = tx.filter((t) => t.kind === 'expense');
    const spend = exp.reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const income = tx.filter((t) => t.kind === 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const byCat = {};
    for (const t of exp) byCat[t.category || 'أخرى'] = (byCat[t.category || 'أخرى'] || 0) + (Number(t.amount) || 0);
    const topCat = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0] || null;
    const biggest = exp.slice().sort((a, b) => b.amount - a.amount)[0] || null;
    const study = st.study_sessions.filter((s) => s.started_at && w.has(s.started_at)).reduce((s, x) => s + (Number(x.minutes) || 0), 0);
    const gymDays = new Set(st.lifts.filter((l) => w.keys.includes(l.date)).map((l) => l.date)).size;
    const daily = st.daily.filter((d) => w.keys.includes(d.date));
    const sleeps = daily.map((d) => d.sleep).filter((x) => x != null);
    const waters = daily.map((d) => d.water).filter((x) => x != null);
    const habits = st.habits.filter((x) => x.active !== false);
    const habitDone = daily.reduce((s, d) => s + habits.filter((x) => d.habits && d.habits[x.id]).length, 0);
    const habitPct = habits.length ? Math.round((habitDone / (habits.length * 7)) * 100) : null;
    const moods = st.journal.filter((j) => w.keys.includes(j.date) && j.mood).map((j) => j.mood);
    const matches = (st.matches || []).filter((m) => w.keys.includes(m.date));
    return {
      spend, income, topCat, biggest, study, gymDays, habitPct, matches,
      sleep: sleeps.length ? r1(sleeps.reduce((a, b) => a + b, 0) / sleeps.length) : null,
      water: waters.length ? r1(waters.reduce((a, b) => a + b, 0) / waters.length) : null,
      mood: moods.length ? r1(moods.reduce((a, b) => a + b, 0) / moods.length) : null,
    };
  }

  const MOOD_FACE = ['', '😞', '😕', '😐', '🙂', '😄'];
  function delta(now, before, lowerIsBetter) {
    if (!before) return '';
    const p = Math.round(((now - before) / before) * 100);
    if (!p) return '<span class="tag">مثل الأسبوع اللي طاف</span>';
    const good = lowerIsBetter ? p < 0 : p > 0;
    return '<span class="tag ' + (good ? 'brand' : 'danger') + '">' + (p > 0 ? '▲ ' : '▼ ') + Math.abs(p) + '%</span>';
  }

  function insights(a, b) {
    const set = st.settings || {};
    const out = [];
    if (b.spend && a.spend > b.spend * 1.2) out.push('💸 صرفك زاد ' + Math.round(((a.spend - b.spend) / b.spend) * 100) + '% — أكثر شي على «' + h(a.topCat ? a.topCat[0] : '') + '».');
    else if (b.spend && a.spend < b.spend * 0.85) out.push('👏 صرفت أقل من الأسبوع اللي طاف بـ ' + fmt(b.spend - a.spend) + ' د.ب.');
    if (set.budget) {
      const perWeek = (Number(set.budget) * 12) / 52;
      if (a.spend > perWeek) out.push('⚠️ تعدّيت حصة الأسبوع من ميزانيتك (' + fmt(perWeek) + ' د.ب).');
    }
    const sleepGoal = Number(set.sleep_goal) || 8;
    if (a.sleep != null && a.sleep < sleepGoal - 1) out.push('😴 متوسط نومك ' + a.sleep + ' ساعات — أقل من هدفك بساعة وأكثر.' + (!A.has || A.has('keeper') ? ' النوم أهم شي لردة فعل الحارس.' : ''));
    if (!a.study) out.push('📚 ما سجّلت ولا جلسة مذاكرة هالأسبوع — جرّب 25 دقيقة بس من «المذاكرة».');
    if (a.gymDays >= 3) out.push('💪 ' + a.gymDays + ' أيام تمرين — التزام ممتاز.');
    else if (a.gymDays === 0) out.push('🏋️ ولا تمرين هالأسبوع — رجّع الجدول على الأحد.');
    if (a.matches.length) {
      const cs = a.matches.filter((m) => Number(m.against) === 0).length;
      out.push('🧤 ' + a.matches.length + ' ' + (a.matches.length === 1 ? 'مباراة' : 'مباريات') + (cs ? '، منها ' + cs + ' كلين شيت' : '') + '.');
    }
    return out.length ? out : ['✅ أسبوع متوازن — كمّل على نفس الريتم.'];
  }

  function row(icon, color, label, value, extra) {
    return '<div class="cb-row"><div class="ico" style="' + tint(color) + '">' + icon + '</div><span>' + label + '</span><b dir="rtl" style="font-variant-numeric:tabular-nums">' + value + '</b>' + (extra || '') + '</div>';
  }
  // 85 → «ساعة و25 د» · 120 → «ساعتين»
  function hrs(min) {
    const H = Math.floor(min / 60), M = min % 60;
    const hs = H === 0 ? '' : H === 1 ? 'ساعة' : H === 2 ? 'ساعتين' : H + ' ساعات';
    return hs ? hs + (M ? ' و' + M + ' د' : '') : M + ' دقيقة';
  }

  function weeklySheet() {
    const a = stats(range(0)), b = stats(range(1));
    const w = range(0);
    const fmtD = (d) => d.getDate() + '/' + (d.getMonth() + 1);
    let body = '<p class="small muted" style="margin:0 0 12px;text-align:center">' + fmtD(w.start) + ' — ' + fmtD(w.end) + ' · مقارنة بالأسبوع اللي قبله</p>';
    body += '<div class="hero" style="margin-bottom:14px"><span class="eyebrow">' + I('wallet') + 'صرفت هالأسبوع</span>' +
      '<div class="amount-big">' + money(a.spend) + '</div><div class="meta"><span>' + delta(a.spend, b.spend, true) + '</span>' +
      (a.topCat ? '<span>أكثر شي: ' + h(a.topCat[0]) + ' · ' + fmt(a.topCat[1]) + '</span>' : '') + '</div>' +
      (a.biggest ? '<div class="split"><div><small>أكبر مصروف</small><b>' + h(a.biggest.merchant || a.biggest.category || '') + '</b></div><div><small>المبلغ</small><b class="num">' + fmt(a.biggest.amount) + '</b></div></div>' : '') + '</div>';
    body += '<div class="card">' +
      row('📚', '#0ea5e9', 'مذاكرة', a.study ? hrs(a.study) : '—', delta(a.study, b.study)) +
      row('💪', '#10b981', 'أيام تمرين', a.gymDays + ' من 7', delta(a.gymDays, b.gymDays)) +
      row('😴', '#8b5cf6', 'متوسط النوم', a.sleep != null ? a.sleep + ' س' : '—', a.sleep != null && b.sleep != null ? delta(a.sleep, b.sleep) : '') +
      row('💧', '#0ea5e9', 'متوسط الماي', a.water != null ? a.water + ' أكواب' : '—', '') +
      row('✅', '#f59e0b', 'العادات', a.habitPct != null ? a.habitPct + '%' : '—', '') +
      row(a.mood ? MOOD_FACE[Math.round(a.mood)] : '🙂', '#ec4899', 'مزاجك', a.mood != null ? a.mood + ' من 5' : '—', '') +
      (a.matches.length ? row('🧤', '#13636B', 'مباريات', String(a.matches.length), '') : '') +
      '</div>';
    body += A.secHead('الخلاصة') + '<div class="card">' + insights(a, b).map((x) => '<p style="margin:6px 0">' + x + '</p>').join('') + '</div>';
    lsSet('hayati-weekly-seen', thursdayKey());
    A.openSheet({ title: 'تقرير أسبوعك', cancelLabel: 'تم', body });
  }

  // مفتاح الأسبوع = آخر خميس
  function thursdayKey() { const t = new Date(); t.setDate(t.getDate() - ((t.getDay() - 4 + 7) % 7)); return dateKey(t); }

  // يطلع من الخميس 6 المسا لين السبت، ومرة وحدة بالأسبوع
  function weeklyCard() {
    const n = new Date(), d = n.getDay();
    const inWindow = (d === 4 && n.getHours() >= 18) || d === 5 || d === 6;
    if (!inWindow || lsGet('hayati-weekly-seen', '') === thursdayKey()) return '';
    const a = stats(range(0));
    return '<button class="cta" data-action="weekly">' +
      '<div class="ico">' + I('chart') + '</div><div style="flex:1;min-width:0"><b>تقرير أسبوعك جاهز 📊</b><small>صرفت ' + fmt(a.spend) + ' د.ب · ' + a.gymDays + ' أيام تمرين · ' +
      (a.study ? hrs(a.study) + ' مذاكرة' : 'شوف وين وصلت') + '</small></div>' + I('chevL') + '</button>';
  }

  // ================= وضع الحارس =================
  const COMPS = [['league', 'دوري'], ['cup', 'كأس'], ['friendly', 'ودية'], ['training', 'تقسيمة']];
  const DRILLS = [
    ['ردة الفعل', 'Reaction ball ضد الجدار — 3 × 45 ثانية، راحة 30 ثانية'],
    ['الارتماء', 'Collapse dive يمين/يسار 2 × 8 لكل جهة، ثم Extension dive 2 × 6 لكل جهة'],
    ['التحرك الجانبي', 'Shuffle + set position على سلّم الرشاقة — 4 × 20 ثانية'],
    ['الكرات العالية', 'استلام عرضيات تحت ضغط (أو رمي عالي من زميل) — 3 × 8'],
    ['واحد ضد واحد', 'Spread / K-barrier — 3 × 5 مواجهات، تطلع وتسكّر الزاوية'],
    ['التوزيع', 'رمية بيد واحدة + ركلة من اليد لهدف على بعد 30م — 2 × 10'],
  ];

  function season() {
    const list = (st.matches || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const n = list.length;
    const sum = (k) => list.reduce((s, m) => s + (Number(m[k]) || 0), 0);
    const cs = list.filter((m) => Number(m.against) === 0).length;
    const shots = sum('saves') + sum('against');
    const rated = list.filter((m) => m.rating);
    return {
      list, n, cs, saves: sum('saves'), against: sum('against'), pens: sum('pens_saved'),
      savePct: shots ? Math.round((sum('saves') / shots) * 100) : null,
      rating: rated.length ? r1(rated.reduce((s, m) => s + Number(m.rating), 0) / rated.length) : null,
    };
  }

  const resultOf = (m) => (Number(m.for) > Number(m.against) ? ['ف', '#2F9E7A'] : Number(m.for) < Number(m.against) ? ['خ', '#D63A3A'] : ['ت', '#8A9A9B']);

  function keeperSection() {
    if (A.has && !A.has('keeper')) return '';
    const s = season();
    let out = A.secHead('🧤 الحارس', '<button class="link" data-action="gk-drills">تمارين الحراسة</button>');
    if (!s.n) {
      return out + '<div class="card"><div class="empty"><div class="ico">⚽</div><b>سجّل أول مباراة</b><p>التصديات، الأهداف عليك، الكلين شيت، وتقييمك — وتشوف فورمتك على طول الموسم.</p></div>' +
        '<button class="btn primary block" data-action="gk-add">' + I('plus') + 'سجّل مباراة</button></div>';
    }
    const tile = (lbl, val, color) => '<div class="tile"><div class="lbl">' + lbl + '</div><div class="val num" style="color:' + color + '">' + val + '</div></div>';
    out += '<div class="tiles">' + tile('مباريات', s.n, 'var(--text)') + tile('كلين شيت', s.cs, 'var(--income)') + tile('نسبة التصدي', s.savePct != null ? s.savePct + '%' : '—', 'var(--brand)') + '</div>';
    out += '<div class="card" style="margin-top:10px">';
    // الفورمة: آخر 5
    out += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b style="flex:1">آخر المباريات</b>' +
      s.list.slice(0, 5).map((m) => { const [l, c] = resultOf(m); return '<span style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:' + c + '">' + l + '</span>'; }).join('') + '</div>';
    // التقييم عبر الوقت
    const last = s.list.slice(0, 10).reverse().filter((m) => m.rating);
    if (last.length >= 2) {
      out += '<div class="mini-chart"><b>تقييمك (آخر ' + last.length + ')</b><div class="mini-bars" style="grid-template-columns:repeat(' + last.length + ',1fr)">' +
        last.map((m) => '<div><small class="num">' + m.rating + '</small><i style="height:' + (Number(m.rating) * 10) + '%;background:' + (Number(m.rating) >= 7 ? 'var(--income)' : Number(m.rating) >= 5 ? '#f59e0b' : 'var(--expense)') + '"></i></div>').join('') + '</div></div>';
    }
    out += '<div class="small muted" style="display:flex;flex-wrap:wrap;gap:4px 14px">' +
      '<span>تصديات: <b class="num">' + s.saves + '</b></span><span>أهداف عليك: <b class="num">' + s.against + '</b></span>' +
      (s.pens ? '<span>بلنتيات صدّيتها: <b class="num">' + s.pens + '</b></span>' : '') +
      (s.rating != null ? '<span>متوسط تقييمك: <b class="num">' + s.rating + '</b></span>' : '') + '</div>';
    out += '<ul class="list" style="margin-top:8px">' + s.list.slice(0, 5).map((m) => {
      const [l, c] = resultOf(m);
      return '<li class="row" data-action="gk-edit" data-id="' + m.id + '"><div class="ico" style="' + tint(c) + ';font-weight:700">' + l + '</div><div class="main"><div class="title"><span class="t">' +
        h(m.opponent || 'مباراة') + '</span><span class="tag">' + h((COMPS.find((x) => x[0] === m.comp) || COMPS[0])[1]) + '</span></div><div class="sub">' + h(m.date) + ' · ' +
        (Number(m.saves) || 0) + ' تصديات' + (Number(m.against) === 0 ? ' · 🧤 كلين شيت' : '') + '</div></div><div class="amount num">' + (Number(m.for) || 0) + ' - ' + (Number(m.against) || 0) + '</div></li>';
    }).join('') + '</ul>';
    out += '<button class="btn primary block" style="margin-top:10px" data-action="gk-add">' + I('plus') + 'سجّل مباراة</button></div>';
    return out;
  }

  function matchForm(m) {
    const isNew = !m;
    m = m || { date: dateKey(), comp: 'league', for: 0, against: 0, saves: 0, pens_saved: 0, minutes: 90, rating: '' };
    const num = (name, label, v, step) => '<div class="field"><label>' + label + '</label><input name="' + name + '" class="ltr" type="number" inputmode="' + (step ? 'decimal' : 'numeric') + '" min="0" ' + (step ? 'step="' + step + '" max="10"' : '') + ' value="' + h(v == null ? '' : v) + '"></div>';
    A.openSheet({
      title: isNew ? 'مباراة جديدة' : 'تعديل المباراة',
      body:
        '<div class="field"><label>الخصم</label><input name="opponent" value="' + h(m.opponent || '') + '" placeholder="مثلاً: نادي المحرق"></div>' +
        '<div class="two"><div class="field"><label>التاريخ</label><input name="date" type="date" class="ltr" value="' + h(m.date) + '"></div>' +
        '<div class="field"><label>البطولة</label><select name="comp">' + COMPS.map(([k, l]) => '<option value="' + k + '"' + (m.comp === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div></div>' +
        '<div class="two">' + num('for', 'أهدافنا', m.for) + num('against', 'أهداف علينا', m.against) + '</div>' +
        '<div class="two">' + num('saves', 'تصدياتك', m.saves) + num('pens_saved', 'بلنتيات صدّيتها', m.pens_saved) + '</div>' +
        '<div class="two">' + num('minutes', 'الدقايق', m.minutes) + num('rating', 'تقييمك لنفسك (1-10)', m.rating, '0.5') + '</div>' +
        '<div class="field"><label>ملاحظات (شنو زين؟ شنو تحسّنه؟)</label><textarea name="notes">' + h(m.notes || '') + '</textarea></div>' +
        (isNew ? '' : '<button class="btn danger block" data-gk-del type="button">' + I('trash') + 'حذف المباراة</button>'),
      mount(root) {
        const del = root.querySelector('[data-gk-del]');
        if (del) del.onclick = async () => { if (await A.ask('تحذف المباراة؟')) { S.remove('matches', m.id); A.closeSheet(); A.toast('انحذفت'); } };
      },
      onSave(root) {
        const v = (n) => A.val(root, n);
        const int = (n) => Math.max(0, Math.round(Number(v(n)) || 0));
        const rating = v('rating') === '' ? null : Math.min(10, Math.max(1, Number(v('rating'))));
        if (!v('date')) { A.toast('اختار التاريخ'); return false; }
        const rec = Object.assign({}, m, {
          opponent: v('opponent'), date: v('date'), comp: v('comp'), for: int('for'), against: int('against'),
          saves: int('saves'), pens_saved: int('pens_saved'), minutes: int('minutes'), rating, notes: v('notes'),
        });
        S.upsert('matches', rec);
        A.toast(rec.against === 0 ? 'كلين شيت 🧤🔥' : 'انسجلت ✓');
      },
    });
  }

  function drillsSheet() {
    A.openSheet({
      title: 'تمارين الحراسة',
      cancelLabel: 'تم',
      body: '<p class="small muted" style="margin:0 0 10px">جلسة 35–40 دقيقة. سخّن 10 دقايق قبلها (حركة + كرات خفيفة باليد)، وخلّها يومين بالأسبوع بعيد عن يوم المباراة.</p>' +
        '<div class="card">' + DRILLS.map(([t, d], i) => '<div class="cb-row" style="align-items:flex-start"><div class="rank">' + (i + 1) + '</div><div style="flex:1"><b>' + t + '</b><div class="small muted">' + d + '</div></div></div>').join('') + '</div>' +
        '<p class="small muted" style="margin:10px 4px 0">قبل المباراة بيوم: لا ارتماءات كثيرة — ردة فعل خفيفة وتوزيع بس.</p>',
    });
  }

  // ================= الربط =================
  wrap('todayTop', (prev) => weeklyCard() + prev());
  wrap('viewHealth', (prev) => prev() + keeperSection() +
    '<button class="btn ghost block" style="margin:14px 0 4px" data-action="weekly">' + I('chart') + 'تقرير الأسبوع</button>');
  wrap('action', (prev, name, el, e) => {
    switch (name) {
      case 'weekly': weeklySheet(); return;
      case 'gk-add': matchForm(); return;
      case 'gk-edit': matchForm((st.matches || []).find((m) => m.id === el.dataset.id)); return;
      case 'gk-drills': drillsSheet(); return;
      default: return prev(name, el, e);
    }
  });
  A.render();
})();

</script>
  <script>/* study.js */
// الدراسة: سؤال الحضور بعد كل محاضرة · هدف مذاكرة أسبوعي لكل مادة · جاهزية الاختبارات (مواضيع)
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E) return;
  const { S, st, I, h, tint } = A;
  const wrap = (name, fn) => { const prev = E[name]; E[name] = (...a) => fn(prev ? prev : () => '', ...a); };
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const isLecture = (c) => !c.type || c.type === 'lecture';
  const lecEnd = (c) => (c.end_time ? A.minutesOf(c.end_time) : A.minutesOf(c.start_time) + 50);
  const course = (id) => st.courses.find((c) => c.id === id);
  function hrs(min) {
    min = Math.round(min);
    const H = Math.floor(min / 60), M = min % 60;
    const hs = H === 0 ? '' : H === 1 ? 'ساعة' : H === 2 ? 'ساعتين' : H + ' س';
    return hs ? hs + (M ? ' و' + M + 'د' : '') : M + ' د';
  }

  // ================= الحضور =================
  // بعد ما تخلص المحاضرة اليوم: «حضرت؟» — جواب واحد يسجّل الحضور أو الغياب
  function pendingLecture() {
    const today = dateKey(), now = A.nowMinutes();
    return A.lecturesOn(new Date().getDay()).filter(isLecture)
      .filter((c) => lecEnd(c) <= now)
      .filter((c) => !(c.attended || []).includes(today) && !(c.absences || []).includes(today) && !(c.skipped || []).includes(today))
      .pop() || null;
  }

  function attendanceCard() {
    if (A.has && !A.has('student')) return '';
    const c = pendingLecture();
    if (!c) return '';
    return '<div class="card" style="border-color:color-mix(in srgb,' + h(c.color || '#1A8A8F') + ' 40%,var(--border))">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="ico" style="' + tint(c.color || '#1A8A8F') + '">' + I('graduation') + '</div>' +
      '<div style="flex:1;min-width:0"><b>حضرت <bdi>' + h(c.name) + '</bdi>؟</b><div class="small muted">خلصت ' + h(c.end_time || '') + (c.room ? ' · ' + h(c.room) : '') + '</div></div></div>' +
      '<div class="btn-row"><button class="btn primary" data-action="att-yes" data-id="' + c.id + '">' + I('check') + 'حضرت</button>' +
      '<button class="btn" data-action="att-no" data-id="' + c.id + '">غبت</button>' +
      '<button class="btn ghost" style="flex:0 0 auto" data-action="att-skip" data-id="' + c.id + '" aria-label="تخطّي">' + I('minus') + '</button></div></div>';
  }

  function mark(id, field) {
    const c = course(id);
    if (!c) return;
    const k = dateKey();
    const list = Array.isArray(c[field]) ? c[field].filter((d) => d !== k) : [];
    list.push(k);
    S.upsert('courses', Object.assign({}, c, { [field]: list }));
    if (field === 'absences') {
      const lim = Number(c.absence_limit) || 0;
      if (lim) {
        const left = lim - list.length;
        A.toast(left <= 0 ? '⚠️ وصلت حد الغياب في ' + c.name : left <= 2 ? '⚠️ باقي لك ' + left + ' غيابات بس' : 'انسجل الغياب · باقي ' + left);
      } else A.toast('انسجل الغياب');
    } else if (field === 'attended') A.toast('انسجل الحضور ✓');
  }

  // ================= هدف المذاكرة الأسبوعي =================
  // الأسبوع يبدأ الأحد
  function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return d; }
  function minutesThisWeek(courseId) {
    const s = weekStart();
    return st.study_sessions.filter((x) => (x.course_id || null) === courseId && x.started_at && new Date(x.started_at) >= s)
      .reduce((t, x) => t + (Number(x.minutes) || 0), 0);
  }

  function goalsCard() {
    const lec = A.lectures();
    if (!lec.length) return '';
    const withGoal = lec.filter((c) => Number(c.study_goal) > 0);
    let out = A.secHead('هدف المذاكرة هالأسبوع', '<button class="link" data-action="goals-set">' + (withGoal.length ? 'تعديل' : 'حدد') + '</button>');
    if (!withGoal.length) {
      return out + '<button class="cta" data-action="goals-set"><div class="ico">' + I('target') + '</div><div style="flex:1"><b>حدد كم ساعة تذاكر لكل مادة</b><small>وتشوف وين مقصّر قبل الاختبار، مو بعده</small></div>' + I('chevL') + '</button>';
    }
    const dayIdx = new Date().getDay(); // 0 = الأحد
    out += '<div class="card">' + withGoal.map((c) => {
      const goal = Number(c.study_goal), done = minutesThisWeek(c.id);
      const pct = Math.min(100, Math.round((done / goal) * 100));
      const expected = Math.round(((dayIdx + 1) / 7) * 100);
      const color = pct >= 100 ? 'var(--income)' : pct + 15 < expected ? 'var(--expense)' : 'var(--brand)';
      const lim = Number(c.absence_limit) || 0, ab = (c.absences || []).length;
      return '<div class="cat" data-action="focus-course" data-id="' + c.id + '" style="cursor:pointer"><div class="ico" style="' + tint(c.color || '#1A8A8F') + '">' + I('book') + '</div><div class="body">' +
        '<div class="line"><span>' + h(c.name) + '</span><b dir="rtl">' + hrs(done) + ' من ' + hrs(goal) + '</b></div>' +
        '<div class="meter"><span style="width:' + pct + '%;background:' + color + '"></span></div>' +
        (lim ? '<div class="small" style="margin-top:4px;color:' + (ab >= lim ? 'var(--expense)' : lim - ab <= 2 ? 'var(--warn)' : 'var(--muted)') + '">الغياب ' + ab + ' من ' + lim + '</div>' : '') + '</div></div>';
    }).join('') + '<p class="small muted" style="margin:8px 0 0">اضغط على المادة عشان تبدأ المؤقت لها.</p></div>';
    return out;
  }

  function goalsSheet() {
    const lec = A.lectures();
    A.openSheet({
      title: 'هدف المذاكرة الأسبوعي',
      body: '<p class="small muted" style="margin:0 0 12px">قاعدة عملية: ساعتين مذاكرة لكل ساعة محاضرة بالأسبوع. حطها صفر لو ما تبي هدف للمادة.</p><div class="card">' +
        lec.map((c) => {
          const weekly = ((c.days || []).length * (lecEnd(c) - A.minutesOf(c.start_time))) / 60;
          const suggest = Math.round(weekly * 2 * 2) / 2;
          return '<div class="cb-row"><div class="ico" style="' + tint(c.color || '#1A8A8F') + '">' + I('book') + '</div><span>' + h(c.name) +
            '<small class="muted" style="display:block;font-weight:500">مقترح: ' + suggest + ' س</small></span>' +
            '<input name="g_' + c.id + '" inputmode="decimal" placeholder="' + suggest + '" value="' + (Number(c.study_goal) ? Number(c.study_goal) / 60 : '') + '" aria-label="ساعات"></div>';
        }).join('') + '</div><p class="small muted" style="margin:8px 4px 0">بالساعات بالأسبوع.</p>',
      onSave(root) {
        for (const c of lec) {
          const raw = A.val(root, 'g_' + c.id).replace(',', '.');
          const v = raw === '' ? 0 : Math.max(0, Math.min(60, Number(raw) || 0));
          if (Math.round(v * 60) !== (Number(c.study_goal) || 0)) S.upsert('courses', Object.assign({}, c, { study_goal: Math.round(v * 60) }));
        }
        A.toast('تم ✓');
      },
    });
  }

  // ================= جاهزية الاختبارات =================
  const upcomingExams = () => st.tasks.filter((t) => t.kind === 'exam' && !t.done && t.due_at && new Date(t.due_at) >= new Date())
    .sort((a, b) => new Date(a.due_at) - new Date(b.due_at));
  const readiness = (t) => { const tp = t.topics || []; return tp.length ? Math.round((tp.filter((x) => x.done).length / tp.length) * 100) : null; };

  function readinessCard() {
    const ex = upcomingExams().slice(0, 4);
    if (!ex.length) return '';
    return A.secHead('جاهزيتك للاختبارات') + '<div class="card">' + ex.map((t) => {
      const r = readiness(t), n = A.daysBetween(new Date(), new Date(t.due_at));
      const color = r == null ? 'var(--muted)' : r >= 80 ? 'var(--income)' : r >= 50 ? '#f59e0b' : 'var(--expense)';
      return '<div class="cat" data-action="exam-topics" data-id="' + t.id + '" style="cursor:pointer"><div class="ex-n num' + (n <= 3 ? ' soon' : '') + '" style="width:44px;height:44px;font-size:16px">' + n + '<small>' + (n === 1 ? 'يوم' : 'أيام') + '</small></div><div class="body">' +
        '<div class="line"><span>' + h(t.title) + '</span><b class="num" style="color:' + color + '">' + (r == null ? 'حط المواضيع' : r + '%') + '</b></div>' +
        '<div class="meter"><span style="width:' + (r || 0) + '%;background:' + color + '"></span></div></div></div>';
    }).join('') + '</div>';
  }

  function topicsSheet(id) {
    const t0 = st.tasks.find((x) => x.id === id);
    if (!t0) return;
    let topics = (t0.topics || []).map((x) => Object.assign({}, x));
    const draw = () => {
      const r = topics.length ? Math.round((topics.filter((x) => x.done).length / topics.length) * 100) : 0;
      return '<div class="hero" style="padding:16px 18px;margin-bottom:12px"><span class="eyebrow">' + I('target') + 'جاهزيتك</span><div class="amount-big num">' + r + '%</div>' +
        '<div class="track"><span style="width:' + r + '%"></span></div></div>' +
        '<form class="shop-add" id="topicForm"><input name="n" placeholder="موضوع / فصل (مثلاً: Chapter 3 — Ratios)" autocomplete="off"><button class="btn primary" type="submit">' + I('plus') + '</button></form>' +
        (topics.length ? '<div class="card flush"><ul class="list">' + topics.map((x, i) =>
          '<li class="row' + (x.done ? ' done' : '') + '" style="cursor:default"><button class="check' + (x.done ? ' on' : '') + '" data-t="toggle" data-i="' + i + '" type="button" aria-label="خلّصته">' + I('check') + '</button>' +
          '<div class="main"><div class="title"><span class="t">' + h(x.n) + '</span></div></div><button class="icon-x" data-t="del" data-i="' + i + '" type="button" aria-label="حذف">✕</button></li>').join('') + '</ul></div>'
          : '<div class="empty"><b>قسّم المادة لمواضيع</b><p>فصول الكتاب أو سلايدات الدكتور — وعلّم اللي خلّصته.</p></div>');
    };
    A.openSheet({
      title: t0.title,
      body: '<div id="topicsRoot">' + draw() + '</div>',
      mount(root) {
        const box = root.querySelector('#topicsRoot');
        const refresh = () => { box.innerHTML = draw(); bind(); };
        const bind = () => {
          box.querySelector('#topicForm').onsubmit = (e) => {
            e.preventDefault();
            const n = e.target.n.value.trim();
            if (!n) return;
            topics.push({ id: S.uuid(), n: n.slice(0, 120), done: false });
            refresh();
            box.querySelector('#topicForm input').focus();
          };
        };
        box.onclick = (e) => {
          const b = e.target.closest('[data-t]');
          if (!b) return;
          const i = Number(b.dataset.i);
          if (b.dataset.t === 'toggle') topics[i].done = !topics[i].done;
          else topics.splice(i, 1);
          refresh();
        };
        bind();
      },
      onSave() {
        const t = st.tasks.find((x) => x.id === id) || t0;
        S.upsert('tasks', Object.assign({}, t, { topics }));
        const r = topics.length ? Math.round((topics.filter((x) => x.done).length / topics.length) * 100) : 0;
        A.toast(r >= 100 ? 'جاهز 💪 بالتوفيق' : 'انحفظ · جاهزيتك ' + r + '%');
      },
    });
  }

  // ================= الربط =================
  wrap('todayTop', (prev) => attendanceCard() + prev());
  wrap('focusExtra', (prev) => goalsCard() + readinessCard() + prev());
  wrap('action', (prev, name, el, e) => {
    const id = el.dataset.id;
    switch (name) {
      case 'att-yes': mark(id, 'attended'); return;
      case 'att-no': mark(id, 'absences'); return;
      case 'att-skip': mark(id, 'skipped'); return;
      case 'goals-set': goalsSheet(); return;
      case 'exam-topics': topicsSheet(id); return;
      default: return prev(name, el, e);
    }
  });
  A.render();
})();

</script>
  <script>/* watch.js */
// ⌚ Apple Watch: اختصار بالآيفون يقرا النوم من تطبيق الصحة كل صبح ويفتح التطبيق برابط فيه الأرقام
//   …/#health?sleep=7.25&deep=1.1&rem=1.6&rhr=54&hrv=48&steps=8200   (date اختياري = اليوم)
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E) return;
  const { S, st, I, h, tint } = A;
  const wrap = (name, fn) => { const prev = E[name]; E[name] = (...a) => fn(prev ? prev : () => '', ...a); };
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // الحقول المقبولة وحدودها — أي شي برّاها ينرفض
  const FIELDS = {
    sleep: ['sleep', 0, 16, 0.1], deep: ['sleep_deep', 0, 8, 0.1], rem: ['sleep_rem', 0, 8, 0.1], core: ['sleep_core', 0, 12, 0.1],
    awake: ['sleep_awake', 0, 8, 0.1], rhr: ['rhr', 25, 160, 1], hrv: ['hrv', 3, 300, 1], steps: ['steps', 0, 150000, 1],
  };

  function parse(text) {
    const q = String(text || '').trim().replace(/^.*?#?health\??/, '').replace(/^\?/, '');
    const p = new URLSearchParams(q.replace(/;/g, '&'));
    const out = {};
    for (const [k, [field, lo, hi, step]] of Object.entries(FIELDS)) {
      const raw = p.get(k);
      if (raw == null || raw === '') continue;
      // الاختصارات أحياناً ترسل «7٫25» أو «7,25» أو «7.25 ساعة»
      const n = parseFloat(String(raw).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/, '.'));
      if (!isFinite(n) || n < lo || n > hi) continue;
      out[field] = step === 1 ? Math.round(n) : Math.round(n * 10) / 10;
    }
    const d = p.get('date');
    out.date = d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : dateKey();
    return Object.keys(out).length > 1 ? out : null;
  }

  function apply(data) {
    const cur = st.daily.find((x) => x.date === data.date) || { id: S.stableId('daily:' + data.date), date: data.date, water: 0, sleep: null, habits: {} };
    const patch = Object.assign({}, data, { watch: true, watch_at: new Date().toISOString() });
    S.upsert('daily', Object.assign({}, cur, patch));
    const parts = [];
    if (data.sleep != null) parts.push('نومك ' + fmtH(data.sleep));
    if (data.steps != null) parts.push(data.steps.toLocaleString('en') + ' خطوة');
    A.toast('⌚ ' + (parts.join(' · ') || 'انسجلت بيانات الساعة'));
  }

  function fromHash() {
    if (!/^#health/.test(location.hash)) return;
    const d = parse(location.hash);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* تجاهل */ }
    if (d) apply(d); else A.toast('رابط الساعة ناقص — شيّك الاختصار');
  }

  // 7.25 → «7 س و15 د»
  function fmtH(x) {
    const H = Math.floor(x), M = Math.round((x - H) * 60);
    return H + ' س' + (M ? ' و' + M + ' د' : '');
  }

  // ---------- كرت الساعة في «صحتي» ----------
  let ringDrawn = false;
  function watchCard() {
    const goal = Number((st.settings || {}).sleep_goal) || 8;
    const nights = st.daily.filter((d) => d.watch && d.sleep != null).sort((a, b) => (a.date < b.date ? 1 : -1));
    let out = A.secHead('⌚ Apple Watch', '<button class="link" data-action="watch-setup">' + (nights.length ? 'الإعداد' : 'اربط') + '</button>');
    if (!nights.length) {
      return out + '<button class="cta" data-action="watch-setup"><div class="ico">⌚</div><div style="flex:1"><b>اربط ساعتك للنوم</b><small>كل صبح تنسجل ساعات نومك ومراحله ونبضك تلقائياً</small></div>' + I('chevL') + '</button>';
    }
    const n = nights[0];
    const pct = Math.min(1, n.sleep / goal), R = 52, C = 2 * Math.PI * R;
    const color = n.sleep >= goal ? 'var(--income)' : n.sleep >= goal - 1 ? '#f59e0b' : 'var(--expense)';
    const stage = (lbl, v, c) => v != null ? '<div class="tile" style="padding:10px"><div class="lbl">' + lbl + '</div><div class="val" dir="rtl" style="color:' + c + '">' + fmtH(v) + '</div></div>' : '';
    out += '<div class="card"><div style="display:flex;align-items:center;gap:18px">' +
      '<div class="sleep-ring" style="position:relative;width:128px;height:128px;flex:none">' +
      '<svg viewBox="0 0 128 128" style="width:100%;height:100%;transform:rotate(-90deg)"><circle cx="64" cy="64" r="' + R + '" fill="none" stroke="var(--surface-2)" stroke-width="12"/>' +
      '<circle class="sleep-arc" cx="64" cy="64" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (C * pct) + ' ' + C + '"/></svg>' +
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b class="num" style="font-size:26px">' + n.sleep + '</b><small class="muted">من ' + goal + ' س</small></div></div>' +
      '<div style="flex:1;min-width:0"><b>' + (n.date === dateKey() ? 'نومك البارحة' : 'آخر ليلة · ' + h(n.date)) + '</b>' +
      '<div class="small muted" style="margin:2px 0 8px">' + (n.sleep >= goal ? 'نوم كافي 👌 جاهز ليومك' : n.sleep >= goal - 1 ? 'قريب من هدفك' : 'أقل من هدفك — خفّف التمرين القوي اليوم') + '</div>' +
      (n.rhr != null ? '<div class="small">❤️ نبض الراحة <b class="num">' + n.rhr + '</b></div>' : '') +
      (n.hrv != null ? '<div class="small">📈 HRV <b class="num">' + n.hrv + '</b> ms</div>' : '') +
      (n.steps != null ? '<div class="small">👟 <b class="num">' + n.steps.toLocaleString('en') + '</b> خطوة</div>' : '') + '</div></div>';
    if (n.sleep_deep != null || n.sleep_rem != null || n.sleep_core != null) {
      out += '<div class="tiles" style="margin-top:12px">' + stage('عميق', n.sleep_deep, '#13636B') + stage('REM', n.sleep_rem, '#8b5cf6') + stage('خفيف', n.sleep_core, '#0ea5e9') + '</div>';
    }
    // آخر 7 ليالي
    const last = nights.slice(0, 7).reverse();
    if (last.length >= 2) {
      const max = Math.max(goal + 1, ...last.map((x) => x.sleep));
      const DAYS = ['ح', 'ن', 'ث', 'ر', 'خ', 'ج', 'س'];
      out += '<div class="mini-chart" style="margin:14px 0 0"><b>آخر ' + last.length + ' ليالي</b><div class="mini-bars" style="grid-template-columns:repeat(' + last.length + ',1fr);height:84px">' +
        last.map((x) => '<div><small class="num">' + x.sleep + '</small><i style="height:' + Math.round((x.sleep / max) * 100) + '%;background:' + (x.sleep >= goal ? 'var(--income)' : x.sleep >= goal - 1 ? '#f59e0b' : 'var(--expense)') + '"></i><small>' + DAYS[new Date(x.date + 'T12:00').getDay()] + '</small></div>').join('') + '</div></div>';
    }
    return out + '</div>';
  }

  // يرسم القوس أول مرة بالجلسة بس (مو كل ما ترجع للصفحة)
  function drawRing() {
    if (ringDrawn || reduced()) return;
    const arc = document.querySelector('.sleep-arc');
    if (!arc) return;
    ringDrawn = true;
    const C = 2 * Math.PI * 52, to = arc.getAttribute('stroke-dasharray');
    arc.animate({ strokeDasharray: ['0, ' + C, to.replace(' ', ', ')] }, { duration: 700, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', delay: 120, fill: 'backwards' });
  }

  // ---------- طريقة الربط ----------
  function setupSheet() {
    const base = location.origin && !/^about|blob|data/.test(location.protocol) ? location.origin + location.pathname : 'https://رابط-التطبيق';
    const url = base + '#health?sleep=';
    const isClaude = /claude\.ai|claudeusercontent|artifact/.test(location.href);
    const copy = (label, value) => '<div class="copy-box"><code style="word-break:keep-all;white-space:nowrap">' + h(label) + '</code><button type="button" data-copy="' + h(value) + '">' + I('copy') + 'نسخ</button></div>';
    A.openSheet({
      title: 'ربط Apple Watch',
      cancelLabel: 'تم',
      saveLabel: 'سجّل',
      body:
        (isClaude ? '<div class="card notice"><p class="small" style="margin:10px 0">⚠️ الربط التلقائي يشتغل على رابط Vercel أو الملف المحمّل. داخل رابط Claude استخدم «لصق» تحت.</p></div>' : '') +
        '<p class="small muted" style="margin:0 0 8px">مرة وحدة بتطبيق <b>الاختصارات</b> بالآيفون (الساعة تسجّل النوم بتطبيق الصحة، والاختصار يوصله هني):</p>' +
        '<ol class="steps">' +
        '<li><b>الأتمتة</b> ← <b>+</b> ← <b>المنبّه</b> ← <b>عند إيقافه</b> ← <b>تشغيل فوراً</b>.</li>' +
        '<li>إجراء <b>«البحث عن عينات الصحة»</b>: النوع <b>تحليل النوم</b>، تاريخ البدء <b>آخر يوم واحد</b>، والقيمة <b>ليس «مستيقظ»</b> ولا «في السرير».</li>' +
        '<li><b>«حساب الإحصائيات»</b> ← <b>المجموع</b> لمدة العينات ← <b>«حساب»</b> ÷ 3600 = ساعات النوم.</li>' +
        '<li>(اختياري) كرّر للعميق <code style="word-break:keep-all;white-space:nowrap">deep</code> و REM <code style="word-break:keep-all;white-space:nowrap">rem</code>، و<b>نبض الراحة</b> <code style="word-break:keep-all;white-space:nowrap">rhr</code>، و<b>الخطوات</b> <code style="word-break:keep-all;white-space:nowrap">steps</code>.</li>' +
        '<li>إجراء <b>«نص»</b> فيه الرابط وبعده الرقم:</li></ol>' + copy(url.length > 40 ? '…' + url.slice(-30) + '7.5' : url + '7.5', url) +
        '<p class="small muted" style="margin:0 0 4px">والإضافي هكذا: <code style="word-break:keep-all;white-space:nowrap">&amp;deep=1.2&amp;rem=1.6&amp;rhr=54&amp;steps=8200</code></p>' +
        '<ol class="steps" start="6"><li>إجراء <b>«فتح عناوين URL»</b> على النص. خلاص — كل ما توقف المنبّه ينفتح التطبيق ونومك مسجّل.</li></ol>' +
        A.secHead('أو الصق يدوياً') +
        '<div class="field"><textarea name="paste" class="ltr" placeholder="sleep=7.5&amp;deep=1.2&amp;rem=1.6&amp;rhr=54"></textarea></div>',
      mount(root) {
        root.onclick = (e) => {
          const b = e.target.closest('[data-copy]');
          if (!b) return;
          try { navigator.clipboard.writeText(b.dataset.copy).then(() => A.toast('انسخ ✓'), () => A.toast('ما قدرت أنسخ — انسخه يدوياً')); } catch (err) { A.toast('ما قدرت أنسخ'); }
        };
      },
      onSave(root) {
        const d = parse(A.val(root, 'paste'));
        if (!d) { A.toast('ما لقيت أرقام — مثال: sleep=7.5'); return false; }
        apply(d);
      },
    });
  }

  // ================= الربط =================
  wrap('viewHealth', (prev) => watchCard() + prev());
  wrap('action', (prev, name, el, e) => {
    if (name === 'watch-setup') { setupSheet(); return; }
    return prev(name, el, e);
  });
  const prevExtra = E.settingsExtra;
  E.settingsExtra = function () {
    return (prevExtra ? prevExtra.apply(this, arguments) : '') + '<div class="group-title">⌚ Apple Watch</div><div class="menu">' +
      '<button data-set="watch-setup"><div class="ico" style="' + tint('#13636B') + '">⌚</div><div style="flex:1"><b>ربط الساعة (النوم والنبض)</b><small>اختصار واحد بالآيفون، مرة وحدة</small></div>' + I('chevL') + '</button></div>';
  };
  const prevSet = E.settingsAction;
  E.settingsAction = async function (act) {
    if (act === 'watch-setup') { A.closeSheet(); setTimeout(setupSheet, 280); return true; }
    return prevSet ? prevSet.apply(this, arguments) : false;
  };
  new MutationObserver(drawRing).observe(document.getElementById('view'), { childList: true });
  window.addEventListener('hashchange', fromHash);
  fromHash();
  A.render();
})();

</script>
  <script>/* import.js */
// ⚽ استيراد جدول تمارين كرة القدم: صورة · PDF · أو رسالة المدرب (نص)
// داخل Claude: Claude يقرا الملف. برّاه: قارئ محلي للنص (أيام + أوقات).
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E) return;
  const { S, st, I, h, tint } = A;
  const wrap = (name, fn) => { const prev = E[name]; E[name] = (...a) => fn(prev ? prev : () => '', ...a); };
  const pad = (n) => String(n).padStart(2, '0');
  const DAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const KINDS = { training: ['تمرين', '#16a34a', '⚽'], match: ['مباراة', '#13636B', '🏟️'], gym: ['جيم', '#10b981', '💪'], other: ['نشاط', '#64748b', '📌'] };
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

  let samplePromise = null;
  const getSample = () => (samplePromise = samplePromise || (window.claude && typeof window.claude.use === 'function' ? window.claude.use('sample').catch(() => null) : Promise.resolve(null)));

  // ---------- القارئ المحلي (نص) ----------
  const DAY_RE = [
    [0, /(الأحد|الاحد|احد|sunday|\bsun\b)/i], [1, /(الاثنين|الإثنين|اثنين|monday|\bmon\b)/i], [2, /(الثلاثاء|الثلاثا|ثلاثاء|tuesday|\btue\b)/i],
    [3, /(الأربعاء|الاربعاء|اربعاء|wednesday|\bwed\b)/i], [4, /(الخميس|خميس|thursday|\bthu\b)/i], [5, /(الجمعة|الجمعه|جمعة|friday|\bfri\b)/i], [6, /(السبت|سبت|saturday|\bsat\b)/i],
  ];
  const digits = (s) => String(s).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  function to24(hh, mm, mer, fallbackPm) {
    let H = Number(hh); const M = Number(mm || 0);
    if (H > 23 || M > 59) return null;
    const pm = mer ? /م|pm|مساء|عصر|ليل/i.test(mer) : fallbackPm;
    const am = mer ? /ص|am|صباح|فجر/i.test(mer) : false;
    if (pm && H < 12) H += 12;
    if (am && H === 12) H = 0;
    return pad(H) + ':' + pad(M);
  }
  function localParse(text) {
    const out = [];
    for (const raw of digits(text).split(/\n+/)) {
      const line = raw.trim();
      if (!line) continue;
      const days = DAY_RE.filter(([, re]) => re.test(line)).map(([d]) => d);
      const dm = line.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})|(\d{1,2})[/.](\d{1,2})(?:[/.](\d{2,4}))?/);
      // 6-8 · 6:30 - 8 م · 18:00–20:00 · الساعة 7 م
      const MER = '(ص|م|am|pm|صباحاً|صباحا|مساءً|مساء|العصر|الليل)';
      let t = null, m;
      if ((m = line.match(new RegExp('(\\d{1,2})(?:[:.](\\d{2}))?\\s*' + MER + '?\\s*(?:-|–|—|إلى|الى|to|لين|حتى)\\s*(\\d{1,2})(?:[:.](\\d{2}))?\\s*' + MER + '?', 'i')))) {
        t = { h1: m[1], m1: m[2], r1: m[3], h2: m[4], m2: m[5], r2: m[6] };
      } else if ((m = line.match(new RegExp('(?:الساعة|ساعة|@|at)\\s*(\\d{1,2})(?:[:.](\\d{2}))?\\s*' + MER + '?', 'i')) || line.match(new RegExp('(\\d{1,2})[:.](\\d{2})\\s*' + MER + '?', 'i')))) {
        t = { h1: m[1], m1: m[2], r1: m[3] };
      }
      if (!t || (!days.length && !dm)) continue;
      const start = to24(t.h1, t.m1, t.r1 || t.r2, Number(t.h1) >= 1 && Number(t.h1) <= 11); // تمارين الفريق غالباً عصر/ليل
      const end = t.h2 ? to24(t.h2, t.m2, t.r2 || t.r1, Number(t.h2) >= 1 && Number(t.h2) <= 11) : null;
      if (!start) continue;
      const kind = /مباراة|مباراه|ماتش|match|vs|ضد/i.test(line) ? 'match' : /جيم|gym|لياقة|صالة/i.test(line) ? 'gym' : 'training';
      const place = ((line.match(/(?:ملعب|استاد|ستاد|نادي|صالة|في)\s*[^\d،,\n-]{2,30}/) || [])[0] || '').replace(/^في\s+/, '');
      const vs = (line.match(/(?:ضد|vs\.?)\s*([^\d،,\n-]{2,25})/i) || [])[1];
      let date = null;
      if (dm) {
        const y = dm[1] ? Number(dm[1]) : dm[6] ? (Number(dm[6]) < 100 ? 2000 + Number(dm[6]) : Number(dm[6])) : new Date().getFullYear();
        const mo = dm[1] ? Number(dm[2]) : Number(dm[5]), d = dm[1] ? Number(dm[3]) : Number(dm[4]);
        if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) date = y + '-' + pad(mo) + '-' + pad(d);
      }
      const title = kind === 'training' ? 'تمرين الفريق' : kind === 'match' ? 'مباراة' + (vs ? ' ضد ' + vs.trim() : '') : KINDS[kind][0];
      const base = { kind, title, start, end, place: place.trim(), date: null, weekday: null, notes: '' };
      if (date) out.push(Object.assign({}, base, { date, weekday: new Date(date + 'T12:00').getDay() }));
      else days.forEach((d) => out.push(Object.assign({}, base, { weekday: d })));
    }
    return out;
  }

  // ---------- Claude يقرا الملف ----------
  const PROMPT = (text) => 'هذا جدول تمارين/مباريات كرة قدم لحارس مرمى في البحرين' + (text ? ' (نص تحت)' : ' (الصور مرفقة)') + '.\n' +
    'طلّع كل حصة كـ JSON بهالشكل بالضبط، بدون أي كلام ثاني:\n' +
    '{"sessions":[{"kind":"training|match|gym|other","title":"اسم قصير بالعربي","weekday":0-6 أو null (0=الأحد),"date":"YYYY-MM-DD" أو null,"start":"HH:MM" (24 ساعة),"end":"HH:MM" أو null,"place":"المكان أو فاضي","notes":"ملاحظة قصيرة أو فاضي"}]}\n' +
    'قواعد: لو الحصة تتكرر كل أسبوع حط weekday و date=null. لو بتاريخ معيّن حط date و weekday يومه. الأوقات بدون ص/م للتمارين غالباً مساءً. لا تخترع حصص مو موجودة. لو ما فيه جدول رجّع {"sessions":[]}.' +
    (text ? '\n\nالنص:\n' + text.slice(0, 6000) : '');

  function clean(list) {
    const ok = [];
    for (const s of Array.isArray(list) ? list : []) {
      const start = /^([01]?\d|2[0-3]):[0-5]\d$/.test(s.start || '') ? s.start.padStart(5, '0') : null;
      if (!start) continue;
      const end = /^([01]?\d|2[0-3]):[0-5]\d$/.test(s.end || '') ? s.end.padStart(5, '0') : null;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(s.date || '') ? s.date : null;
      const wd = Number.isInteger(s.weekday) && s.weekday >= 0 && s.weekday <= 6 ? s.weekday : date ? new Date(date + 'T12:00').getDay() : null;
      if (wd == null && !date) continue;
      ok.push({ kind: KINDS[s.kind] ? s.kind : 'training', title: String(s.title || '').slice(0, 60), weekday: wd, date, start, end, place: String(s.place || '').slice(0, 60), notes: String(s.notes || '').slice(0, 120), on: true });
    }
    return ok;
  }

  // PDF → صور (أول 3 صفحات) + نصه
  let pdfLib = null;
  function loadPdf() {
    if (pdfLib) return pdfLib;
    pdfLib = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = PDFJS + 'pdf.min.js';
      s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(window.pdfjsLib); };
      s.onerror = () => { pdfLib = null; rej(new Error('pdf')); };
      document.head.appendChild(s);
    });
    return pdfLib;
  }
  async function pdfToImagesAndText(file) {
    const lib = await loadPdf();
    const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    const images = [], texts = [];
    for (let i = 1; i <= Math.min(doc.numPages, 3); i++) {
      const page = await doc.getPage(i);
      const tc = await page.getTextContent();
      texts.push(tc.items.map((x) => x.str).join(' '));
      const vp = page.getViewport({ scale: 1.6 });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      images.push(await new Promise((r) => c.toBlob(r, 'image/png')));
    }
    return { images, text: texts.join('\n') };
  }

  // ---------- الواجهة ----------
  function importSheet() {
    let rows = [];
    const draw = () => rows.length ? '<div class="card flush"><ul class="list">' + rows.map((r, i) => {
      const k = KINDS[r.kind];
      const when = r.date ? r.date + ' (' + DAY_NAMES[r.weekday] + ')' : 'كل ' + DAY_NAMES[r.weekday];
      return '<li class="row" style="cursor:default"><button type="button" class="check' + (r.on ? ' on' : '') + '" data-i="' + i + '" aria-label="ضمّن">' + I('check') + '</button>' +
        '<div class="ico" style="' + tint(k[1]) + '">' + k[2] + '</div><div class="main"><div class="title"><span class="t">' + h(r.title || k[0]) + '</span></div>' +
        '<div class="sub">' + h(when) + ' · <bdi>' + h(r.start) + (r.end ? '–' + h(r.end) : '') + '</bdi>' + (r.place ? ' · ' + h(r.place) : '') + '</div></div></li>';
    }).join('') + '</ul></div><p class="small muted" style="margin:8px 4px 0">شيّك عليها قبل الحفظ — شيل علامة الصح عن أي حصة غلط.</p>' : '';
    A.openSheet({
      title: 'استيراد جدول التمارين',
      saveLabel: 'أضف للجدول',
      body:
        '<p class="small muted" style="margin:0 0 10px">ارفع <b>صورة</b> الجدول أو ملف <b>PDF</b>، أو الصق <b>رسالة المدرب</b> من الواتساب.</p>' +
        '<label class="btn block" style="margin-bottom:10px">' + I('upload') + 'اختار صورة أو PDF<input type="file" id="impFile" accept="image/*,application/pdf,.txt,.csv" hidden></label>' +
        '<div class="field"><textarea name="txt" placeholder="مثال:&#10;الأحد والثلاثاء 6-8 م ملعب نادي المحرق&#10;الخميس 5:30 م لياقة&#10;مباراة 24/10 الساعة 7 م ضد الرفاع"></textarea></div>' +
        '<button type="button" class="btn primary block" id="impRead">' + I('sparkle') + 'اقرأ الجدول</button>' +
        '<p class="small muted" id="impStatus" style="margin:10px 4px;min-height:18px"></p><div id="impRows"></div>',
      mount(root) {
        const status = (t) => { root.querySelector('#impStatus').textContent = t; };
        const show = () => { root.querySelector('#impRows').innerHTML = draw(); };
        let file = null;
        root.querySelector('#impFile').onchange = (e) => { file = e.target.files[0] || null; status(file ? '📎 ' + file.name : ''); };
        root.querySelector('#impRows').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) { rows[b.dataset.i].on = !rows[b.dataset.i].on; show(); } };
        root.querySelector('#impRead').onclick = async (ev) => {
          const btn = ev.currentTarget; btn.disabled = true;
          try {
            let text = A.val(root, 'txt'), images = [];
            if (file) {
              if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
                status('أقرا الـPDF…');
                try { const r = await pdfToImagesAndText(file); images = r.images; text = (text + '\n' + r.text).trim(); }
                catch (e) { status('ما قدرت أفتح الـPDF — صوّره والصق الصورة'); return; }
              } else if (/^image\//.test(file.type)) images = [file];
              else text = (text + '\n' + (await file.text())).trim();
            }
            if (!text && !images.length) { status('ارفع ملف أو الصق النص أول'); return; }
            const sample = await getSample();
            const caps = sample ? await sample.limits().catch(() => null) : null;
            const canImg = !!(caps && caps.images);
            if (sample && (text || canImg)) {
              status('✨ Claude يقرا الجدول…');
              const imgs = canImg ? images.slice(0, caps.images.maxCount || 3) : [];
              try {
                const res = await sample.json(PROMPT(imgs.length ? '' : text) + (imgs.length && text ? '\n\nنص إضافي:\n' + text.slice(0, 3000) : ''), { images: imgs.length ? imgs : undefined, modelTier: 'default' });
                rows = clean(res && res.sessions);
              } catch (e) {
                if (e && e.code === 'not_granted') status('ما سمحت لـClaude — جرّبت القارئ المحلي');
                rows = text ? clean(localParse(text)) : [];
              }
            } else if (images.length && !text) {
              status('قراءة الصور تحتاج Claude (داخل رابط Claude). هني: الصق الجدول كنص.'); return;
            } else rows = clean(localParse(text));
            status(rows.length ? 'لقيت ' + rows.length + (rows.length === 1 ? ' حصة' : ' حصص') : 'ما لقيت أوقات واضحة — جرّب تكتبها سطر لكل يوم');
            show();
          } finally { btn.disabled = false; }
        };
      },
      onSave() {
        const pick = rows.filter((r) => r.on);
        if (!pick.length) { A.toast('ما فيه حصص مختارة'); return false; }
        // الحصص الأسبوعية بنفس الوقت والمكان تصير بند واحد بعدة أيام
        const groups = {};
        let dated = 0, weekly = 0;
        for (const r of pick) {
          if (r.date) {
            const due = new Date(r.date + 'T' + r.start + ':00');
            const dur = r.end ? Math.max(15, (Number(r.end.slice(0, 2)) * 60 + Number(r.end.slice(3))) - (Number(r.start.slice(0, 2)) * 60 + Number(r.start.slice(3)))) : 90;
            S.upsert('tasks', { title: KINDS[r.kind][2] + ' ' + (r.title || KINDS[r.kind][0]), kind: 'appointment', due_at: due.toISOString(), duration: dur, place: r.place || null, notes: r.notes || null, done: false });
            dated++;
          } else {
            const key = [r.kind, r.title, r.start, r.end, r.place].join('|');
            (groups[key] = groups[key] || Object.assign({}, r, { days: [] })).days.push(r.weekday);
          }
        }
        for (const g of Object.values(groups)) {
          const k = KINDS[g.kind];
          S.upsert('courses', { name: k[2] + ' ' + (g.title || k[0]), type: g.kind === 'gym' ? 'gym' : 'activity', days: [...new Set(g.days)].sort(), start_time: g.start, end_time: g.end || null, room: g.place || '', color: k[1], source: 'football-import' });
          weekly++;
        }
        A.toast('⚽ انضاف: ' + (weekly ? weekly + ' أسبوعي' : '') + (weekly && dated ? ' · ' : '') + (dated ? dated + ' بتاريخ' : ''));
      },
    });
  }

  // ================= الربط =================
  wrap('chooserItems', (prev, item) => prev(item) + item('football', 'upload', '#16a34a', 'جدول تمارين الكورة', 'صورة، PDF، أو رسالة المدرب'));
  const prevPick = E.pick;
  E.pick = (k) => { if (k === 'football') { importSheet(); return; } if (prevPick) prevPick(k); };
  wrap('viewHealth', (prev) => prev() + '<button class="btn ghost block" style="margin:10px 0 4px" data-action="football-import">' + I('upload') + 'استيراد جدول تمارين الكورة</button>');
  wrap('action', (prev, name, el, e) => { if (name === 'football-import') { importSheet(); return; } return prev(name, el, e); });
  E.footballImport = importSheet;
  E._parseFootball = localParse; // للاختبار
})();

  <script>/* lock.js */
// قفل التطبيق برمز سري: يحمي بياناتك لو أحد مسك جوالك وهو مفتوح
// الرمز ما ينحفظ — بس بصمته (PBKDF2 + ملح) على هالجهاز. نسيت الرمز؟ امسح بيانات الموقع وسجّل دخول Claude من جديد.
(function (global) {
  'use strict';

  const A = global.App, E = global.Extras;
  if (!A || !E) return;
  const KEY = 'hayati-lock';
  const ITER = 150000;
  const TIMEOUTS = [[0, 'فوراً'], [60, 'بعد دقيقة'], [300, 'بعد 5 دقايق'], [900, 'بعد ربع ساعة']];

  function read() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function write(v) {
    try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); return true; } catch (e) { return false; }
  }
  const hex = (b) => Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, '0')).join('');
  const unhex = (s) => new Uint8Array(s.match(/../g).map((x) => parseInt(x, 16)));

  async function derive(pin, saltHex) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unhex(saltHex), iterations: ITER }, key, 256);
    return hex(bits);
  }
  function same(a, b) { // مقارنة بوقت ثابت
    if (a.length !== b.length) return false;
    let d = 0; for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return d === 0;
  }

  async function setPin(pin, timeout) {
    const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    return write({ v: 1, salt, hash: await derive(pin, salt), timeout, fails: 0, until: 0 });
  }

  // ---------- شاشة القفل ----------
  let shield = null;
  let hiddenAt = 0;
  let unlocked = false;

  const style = document.createElement('style');
  style.textContent = `
    .lock { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
      background: radial-gradient(120% 70% at 50% 35%, #13535B 0%, #0E3B43 45%, #0A1A1E 100%); color: #E8DCC4; font-family: inherit; }
    .lock svg.mark { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.6); }
    .lock h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .lock .msg { min-height: 22px; font-size: 14px; opacity: .8; text-align: center; }
    .lock .msg.err { color: #FF8A70; opacity: 1; }
    .lock .dots { display: flex; gap: 14px; direction: ltr; }
    .lock .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #E8DCC4; transition: background-color 120ms ease; }
    .lock .dots i.on { background: #E8DCC4; }
    .lock .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; direction: ltr; }
    .lock .pad button { height: 76px; border-radius: 50%; border: 0; background: rgba(232,220,196,.12); color: #E8DCC4; font-size: 28px; font-weight: 600;
      font-variant-numeric: tabular-nums; transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1), background-color 120ms ease; }
    .lock .pad button:active { transform: scale(.92); background: rgba(232,220,196,.24); }
    .lock .pad button.ghost { background: none; font-size: 15px; }
    .lock .forgot { border: 0; background: none; color: #E8DCC4; opacity: .6; font-size: 13px; text-decoration: underline; }
    .lock.shake .dots { animation: lockshake 320ms cubic-bezier(0.23, 1, 0.32, 1); }
    @keyframes lockshake { 20% { transform: translateX(-10px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(3px); } }
    @media (prefers-reduced-motion: reduce) { .lock.shake .dots { animation: none; } }
    body.locked > *:not(.lock) { visibility: hidden; }
  `;
  document.head.appendChild(style);

  const MARK = '<svg class="mark" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#0E3B43"/><path d="M 383.3 172.7 A 160 160 0 1 1 300 102.2" fill="none" stroke="#E8DCC4" stroke-opacity=".28" stroke-width="22" stroke-linecap="round"/><path d="M 304 166 L 196 166 L 264 222 C 204 222 168 254 168 292 C 168 336 206 360 256 360 C 292 360 318 348 338 332" fill="none" stroke="#E8DCC4" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><circle cx="352" cy="128" r="30" fill="#FF6B4A"/></svg>';

  function lockNow() {
    const cfg = read();
    if (!cfg || shield) return;
    unlocked = false;
    document.body.classList.add('locked');
    shield = document.createElement('div');
    shield.className = 'lock';
    shield.setAttribute('role', 'dialog');
    shield.setAttribute('aria-label', 'التطبيق مقفول');
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
    shield.innerHTML = MARK + '<h2>اكتب رمزك</h2><div class="dots">' + '<i></i>'.repeat(cfg.len || 4) + '</div><div class="msg"></div>' +
      '<div class="pad">' + keys.map((k) => k ? '<button type="button" data-k="' + k + '"' + (k === '⌫' ? ' class="ghost" aria-label="مسح"' : '') + '>' + k + '</button>' : '<span></span>').join('') + '</div>' +
      '<button class="forgot" type="button">نسيت الرمز؟</button>';
    document.body.appendChild(shield);
    // أي نافذة مفتوحة تتسكر عشان ما تبين فوق القفل
    document.querySelectorAll('dialog[open]').forEach((d) => { try { HTMLDialogElement.prototype.close.call(d); } catch (e) { /* تجاهل */ } });

    let entry = '';
    let busy = false;
    const dots = shield.querySelectorAll('.dots i');
    const msg = shield.querySelector('.msg');
    const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < entry.length));
    const say = (t, err) => { msg.textContent = t; msg.classList.toggle('err', !!err); };

    function waitLeft() { const c = read(); return c && c.until > Date.now() ? Math.ceil((c.until - Date.now()) / 1000) : 0; }
    const w = waitLeft(); if (w) say('محاولات كثيرة — انتظر ' + w + ' ثانية', true);

    async function check() {
      busy = true;
      const c = read();
      const ok = c && same(await derive(entry, c.salt), c.hash);
      if (ok) {
        c.fails = 0; c.until = 0; write(c);
        unlockDone();
        return;
      }
      c.fails = (c.fails || 0) + 1;
      // بعد 5 غلطات: انتظار يتضاعف (30ث، 60ث، 120ث …)
      if (c.fails >= 5) c.until = Date.now() + 30000 * Math.pow(2, c.fails - 5);
      write(c);
      entry = ''; paint();
      shield.classList.remove('shake'); void shield.offsetWidth; shield.classList.add('shake');
      const left = waitLeft();
      say(left ? 'محاولات كثيرة — انتظر ' + left + ' ثانية' : 'الرمز غلط', true);
      busy = false;
    }

    function press(k) {
      if (busy) return;
      const left = waitLeft();
      if (left) { say('محاولات كثيرة — انتظر ' + left + ' ثانية', true); return; }
      if (k === '⌫') entry = entry.slice(0, -1);
      else if (entry.length < (cfg.len || 4)) entry += k;
      paint();
      if (entry.length === (cfg.len || 4)) check();
    }

    shield.querySelector('.pad').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
    shield.addEventListener('keydown', (e) => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); });
    shield.tabIndex = -1; shield.focus();
    shield.querySelector('.forgot').onclick = () => say('امسح بيانات الموقع من إعدادات Safari، وسجّل دخول Claude من جديد — بياناتك محفوظة بحسابك.');
  }

  function unlockDone() {
    unlocked = true;
    if (shield) shield.remove();
    shield = null;
    document.body.classList.remove('locked');
    A.render();
  }

  // يقفل لما ترجع للتطبيق بعد المدة المختارة، ويغطّي الشاشة فوراً لما تطلع (عشان صورة مبدّل التطبيقات)
  document.addEventListener('visibilitychange', () => {
    const cfg = read();
    if (!cfg) return;
    if (document.hidden) { hiddenAt = Date.now(); if (!shield) document.body.classList.add('locked'); }
    else {
      if (shield) return;
      if (Date.now() - hiddenAt >= (cfg.timeout || 0) * 1000 || !unlocked) lockNow();
      else document.body.classList.remove('locked');
    }
  });
  global.addEventListener('pagehide', () => { if (read()) { hiddenAt = Date.now(); document.body.classList.add('locked'); } });

  // ---------- الإعدادات ----------
  const prevExtra = E.settingsExtra, prevAction = E.settingsAction;
  E.settingsExtra = function () {
    const cfg = read();
    const t = cfg ? (TIMEOUTS.find((x) => x[0] === cfg.timeout) || TIMEOUTS[0])[1] : '';
    return (prevExtra ? prevExtra.apply(this, arguments) : '') +
      '<div class="group-title">' + A.I('key') + 'الحماية</div><div class="menu">' +
      '<button data-set="lock-set"><div class="ico" style="' + A.tint('#13636B') + '">' + A.I('key') + '</div><div style="flex:1"><b>' + (cfg ? 'تغيير رمز القفل' : 'قفل التطبيق برمز') + '</b><small>' +
      (cfg ? 'مفعّل · يقفل ' + t : 'رمز من 4 أو 6 أرقام يطلب كل ما تفتح التطبيق') + '</small></div>' + A.I('chevL') + '</button>' +
      (cfg ? '<button data-set="lock-now"><div class="ico" style="' + A.tint('#13636B') + '">' + A.I('logout') + '</div><div style="flex:1"><b>اقفل الحين</b></div></button>' +
        '<button data-set="lock-off"><div class="ico" style="' + A.tint('#D63A3A') + '">' + A.I('trash') + '</div><div style="flex:1"><b>شيل القفل</b><small>يطلب الرمز الحالي</small></div></button>' : '') +
      '</div>';
  };

  async function verifyCurrent(pin) { const c = read(); return !c || same(await derive(pin, c.salt), c.hash); }

  function pinForm(mode) {
    const cfg = read();
    const needOld = !!cfg;
    A.openSheet({
      title: mode === 'off' ? 'شيل القفل' : cfg ? 'تغيير الرمز' : 'قفل التطبيق',
      saveLabel: mode === 'off' ? 'شيل' : 'حفظ',
      body:
        (needOld ? '<div class="field"><label>الرمز الحالي</label><input name="old" class="ltr" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></div>' : '') +
        (mode === 'off' ? '' :
          '<div class="field"><label>الرمز الجديد (4 أو 6 أرقام)</label><input name="pin" class="ltr" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></div>' +
          '<div class="field"><label>أعد كتابته</label><input name="pin2" class="ltr" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></div>' +
          '<div class="field"><label>يقفل لما تطلع من التطبيق</label><select name="timeout">' +
          TIMEOUTS.map((x) => '<option value="' + x[0] + '"' + ((cfg ? cfg.timeout : 60) === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></div>') +
        '<p class="small muted" style="margin:4px 4px 0">الرمز يحمي هالجهاز بس. ما ينحفظ الرمز نفسه — بس بصمة مشفّرة منه. نسيته؟ امسح بيانات الموقع وسجّل دخول Claude من جديد، وبياناتك ترجع من حسابك.</p>',
      async onSave(root) {
        const v = (n) => (root.querySelector('[name=' + n + ']') || {}).value || '';
        if (needOld && !(await verifyCurrent(v('old')))) { A.toast('الرمز الحالي غلط'); return false; }
        if (mode === 'off') { write(null); A.toast('انشال القفل'); return; }
        const pin = v('pin');
        if (!/^(\d{4}|\d{6})$/.test(pin)) { A.toast('الرمز لازم 4 أو 6 أرقام'); return false; }
        if (/^(\d)\1+$/.test(pin) || '0123456789'.includes(pin) || '9876543210'.includes(pin)) { A.toast('اختار رمز أصعب من ' + pin); return false; }
        if (pin !== v('pin2')) { A.toast('الرمزين مو نفس بعض'); return false; }
        const ok = await setPin(pin, Number(v('timeout')));
        if (!ok) { A.toast('المتصفح مانع الحفظ — جرّب من Safari مو من نافذة خاصة'); return false; }
        const c = read(); c.len = pin.length; write(c);
        unlocked = true;
        A.toast('تم — التطبيق صار مقفول برمز 🔒');
      },
    });
  }

  E.settingsAction = async function (act, root, b) {
    if (act === 'lock-set') { pinForm('set'); return true; }
    if (act === 'lock-off') { pinForm('off'); return true; }
    if (act === 'lock-now') { A.closeSheet(); setTimeout(lockNow, 280); return true; }
    return prevAction ? prevAction.apply(this, arguments) : false;
  };

  // أول ما ينفتح التطبيق
  if (read()) lockNow();
})(window);
