  <script>/* motion.js */
// الحركة: دخول الشاشات، فتح وسكر النوافذ، وتحريك الأرقام والأشرطة لما تتغيّر
(function (global) {
  'use strict';

  const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
  const EASE_DRAWER = 'cubic-bezier(0.32, 0.72, 0, 1)';
  const reduced = () => global.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wide = () => global.matchMedia('(min-width: 640px)').matches;
  const rtl = () => document.documentElement.dir === 'rtl';

  // منحنى cubic-bezier حقيقي للأرقام (نفس --ease-out)
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t;
    const sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      let t = x;
      for (let i = 0; i < 6; i++) {
        const d = dx(t);
        if (Math.abs(d) < 1e-6) break;
        t -= (sx(t) - x) / d;
      }
      return sy(Math.max(0, Math.min(1, t)));
    };
  }
  const easeOut = bezier(0.23, 1, 0.32, 1);

  const view = document.getElementById('view');
  const A = global.App;
  if (!view || !A) return;

  // ---------- دخول الشاشة (تبويب أو قسم جديد) ----------
  function viewKey() {
    const u = A.ui;
    const seg = u.tab === 'money' ? u.moneySeg : u.tab === 'schedule' ? u.studySeg : u.tab === 'tasks' ? u.tasksSeg : '';
    return u.tab + '|' + (seg || '');
  }

  let lastKey = null;
  let lastTab = null;
  let enterStart = 0;
  let enterKind = null;
  let snap = new Map();

  function enter(kind, elapsed) {
    const kids = Array.from(view.children);
    if (reduced()) {
      const a = view.animate({ opacity: [0, 1] }, { duration: 150, easing: 'ease' });
      if (elapsed) a.currentTime = elapsed;
      return;
    }
    if (kind === 'tab') {
      // تدرّج خفيف: ٣٥ms بين كل بطاقة، أقصاها ٨ عناصر
      kids.forEach((el, i) => {
        const a = el.animate(
          { opacity: [0, 1], transform: ['translateY(8px)', 'translateY(0)'] },
          { duration: 240, delay: Math.min(i, 7) * 35, easing: EASE_OUT, fill: 'backwards' }
        );
        if (elapsed) a.currentTime = elapsed;
      });
    } else {
      // تغيير القسم داخل نفس التبويب: شريط الأقسام ثابت والمحتوى بس يظهر
      kids.forEach((el) => {
        if (el.matches('.seg') || el.querySelector('.seg')) return;
        const a = el.animate(
          { opacity: [0, 1], transform: ['translateY(4px)', 'translateY(0)'] },
          { duration: 180, easing: EASE_OUT, fill: 'backwards' }
        );
        if (elapsed) a.currentTime = elapsed;
      });
    }
  }

  // ---------- لقطة القيم عشان نحرّك اللي تغيّر بس ----------
  const label = (el, sel) => {
    const c = el.closest(sel);
    return c ? (c.querySelector('.line span, .lbl, .eyebrow, b') || c).textContent.trim().slice(0, 40) : '';
  };

  function collect() {
    const out = new Map();
    const add = (sel, kind, ctx) => {
      view.querySelectorAll(sel).forEach((el, i) => {
        out.set(sel + '#' + i + '#' + (ctx ? label(el, ctx) : ''), { el, kind });
      });
    };
    add('.hero .amount-big .num, .hero .split .num', 'num', '.hero');
    add('.tile .val .num', 'num', '.tile');
    add('.ring b.num', 'num', '.hero');
    add('.ring circle:last-child', 'ring', '.hero');
    add('.hero .track > span', 'w', '.hero');
    add('.meter > span', 'w', '.cat, .goal, .card');
    add('.chart .bar', 'h');
    add('.mini-bars i', 'h');
    return out;
  }

  function readValue(el, kind) {
    if (kind === 'num') return el.textContent;
    if (kind === 'ring') return el.getAttribute('stroke-dasharray');
    if (kind === 'w') return el.style.width;
    return el.style.height;
  }

  function parseNum(text) {
    const m = /(−|-)?([\d,]+(?:\.(\d+))?)/.exec(text);
    if (!m) return null;
    return {
      value: (m[1] ? -1 : 1) * parseFloat(m[2].replace(/,/g, '')),
      dec: m[3] ? m[3].length : 0,
      pre: text.slice(0, m.index),
      post: text.slice(m.index + m[0].length),
      neg: m[1] || '−',
    };
  }

  function formatNum(v, p) {
    const [a, b] = Math.abs(v).toFixed(p.dec).split('.');
    return p.pre + (v < 0 ? p.neg : '') + a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b ? '.' + b : '') + p.post;
  }

  const tweens = new Set();
  function countUp(el, fromText, toText) {
    const a = parseNum(fromText), b = parseNum(toText);
    if (!a || !b || a.value === b.value) return;
    const t0 = performance.now(), dur = 300;
    const job = { el };
    tweens.add(job);
    const step = (now) => {
      if (!tweens.has(job) || !el.isConnected) return;
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = k >= 1 ? toText : formatNum(a.value + (b.value - a.value) * easeOut(k), b);
      if (k < 1) requestAnimationFrame(step); else tweens.delete(job);
    };
    el.textContent = fromText;
    requestAnimationFrame(step);
  }

  // الأشرطة تتحرك بـ transform بدل العرض/الطول
  function grow(el, from, to, axis) {
    const f = parseFloat(from), t = parseFloat(to);
    if (!(t > 0) || isNaN(f) || Math.abs(f - t) < 0.5) return;
    const r = Math.max(0, f / t);
    const origin = axis === 'x' ? (rtl() ? 'right center' : 'left center') : 'center bottom';
    el.style.transformOrigin = origin;
    el.animate(
      { transform: [(axis === 'x' ? 'scaleX(' : 'scaleY(') + r + ')', 'none'] },
      { duration: 300, easing: EASE_OUT }
    );
  }

  function animateChanges(prev, next) {
    if (reduced()) return;
    for (const [k, n] of next) {
      const p = prev.get(k);
      if (!p) continue;
      const to = readValue(n.el, n.kind);
      if (p.value === to) continue;
      if (n.kind === 'num') countUp(n.el, p.value, to);
      else if (n.kind === 'ring') n.el.animate({ strokeDasharray: [p.value.replace(' ', ', '), to.replace(' ', ', ')] }, { duration: 300, easing: EASE_OUT });
      else grow(n.el, p.value, to, n.kind === 'w' ? 'x' : 'y');
    }
  }

  // ---------- ردة فعل لما تضغط إنجاز / عادة / كوب ماء ----------
  let tap = null;
  view.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    tap = {
      action: el.dataset.action, id: el.dataset.id, n: el.dataset.n,
      wasOn: el.classList.contains('on'),
      cupsOn: el.classList.contains('cup') ? el.parentElement.querySelectorAll('.cup.on').length : 0,
      t: performance.now(),
    };
  }, true);

  function feedback() {
    const t = tap;
    tap = null;
    if (!t || performance.now() - t.t > 800 || reduced()) return;
    if (t.action === 'water') {
      const cups = view.querySelectorAll('.cup');
      let k = 0;
      cups.forEach((c, i) => {
        if (i >= t.cupsOn && c.classList.contains('on')) {
          c.animate({ transform: ['scale(0.85)', 'scale(1)'], opacity: [0.4, 1] }, { duration: 200, delay: k++ * 30, easing: EASE_OUT, fill: 'backwards' });
        }
      });
      return;
    }
    if (!t.id) return;
    const el = view.querySelector('[data-action="' + CSS.escape(t.action) + '"][data-id="' + CSS.escape(t.id) + '"]');
    if (!el || !el.classList.contains('on') || t.wasOn) return;
    el.animate({ transform: ['scale(0.88)', 'scale(1)'] }, { duration: 200, easing: EASE_OUT });
    // علامة الصح ترتسم
    const path = el.classList.contains('check') && el.querySelector('svg path');
    if (path) {
      path.setAttribute('pathLength', '1');
      path.style.strokeDasharray = '1';
      path.animate({ strokeDashoffset: [1, 0] }, { duration: 220, delay: 40, easing: EASE_OUT, fill: 'backwards' });
    }
  }

  // ---------- بعد كل رسم للشاشة ----------
  function afterRender() {
    const key = viewKey();
    const next = collect();
    const now = performance.now();
    if (key !== lastKey) {
      enterKind = lastTab === A.ui.tab ? 'seg' : 'tab';
      enterStart = now;
      for (const j of tweens) tweens.delete(j);
      enter(enterKind, 0);
    } else if (now - enterStart < 520) {
      // رسمة ثانية وسط الدخول (مثلاً وصلت البيانات من المزامنة): نكمل من نفس النقطة
      enter(enterKind, now - enterStart);
    } else {
      animateChanges(snap, next);
      feedback();
    }
    tap = null;
    lastKey = key;
    lastTab = A.ui.tab;
    snap = new Map();
    for (const [k, n] of next) snap.set(k, { value: readValue(n.el, n.kind) });
  }

  new MutationObserver(afterRender).observe(view, { childList: true });

  // أول رسمة صارت قبل ما ينحمّل هالملف: نبدأ دخولها من هني
  lastKey = viewKey();
  lastTab = A.ui.tab;
  enterKind = 'tab';
  enterStart = performance.now();
  enter('tab', 0);
  for (const [k, n] of collect()) snap.set(k, { value: readValue(n.el, n.kind) });

  // ---------- النوافذ: تطلع من تحت وتنزل لتحت ----------
  const nativeClose = HTMLDialogElement.prototype.close;

  function dialogMotion(dlg, isSheet) {
    const frames = (open) => {
      if (reduced()) return { opacity: open ? [0, 1] : [1, 0] };
      if (isSheet && !wide()) return { transform: open ? ['translateY(100%)', 'translateY(0)'] : ['translateY(0)', 'translateY(100%)'] };
      return { opacity: open ? [0, 1] : [1, 0], transform: open ? ['scale(0.96)', 'scale(1)'] : ['scale(1)', 'scale(0.96)'] };
    };
    const timing = (open) => {
      if (reduced()) return { duration: 150, easing: 'ease' };
      if (isSheet && !wide()) return { duration: open ? 380 : 260, easing: EASE_DRAWER };
      return { duration: open ? 220 : 160, easing: EASE_OUT };
    };
    const backdrop = (open, t) => {
      try { return dlg.animate({ opacity: open ? [0, 1] : [1, 0] }, Object.assign({ pseudoElement: '::backdrop' }, t)); } catch (e) { return null; }
    };

    let closing = null;

    new MutationObserver(() => {
      if (!dlg.open) return;
      const t = timing(true);
      dlg.animate(frames(true), t);
      backdrop(true, t);
    }).observe(dlg, { attributes: true, attributeFilter: ['open'] });

    dlg.close = function (rv) {
      if (!this.open || closing) return;
      const t = Object.assign({ fill: 'forwards' }, timing(false));
      const a = this.animate(frames(false), t);
      const b = backdrop(false, t);
      closing = { a, b };
      const mine = closing;
      a.finished.then(() => {
        if (closing !== mine) return;
        closing = null;
        nativeClose.call(this, rv);
        a.cancel();
        if (b) b.cancel();
      }).catch(() => {});
    };

    // لو انفتحت نافذة جديدة وهي تتسكر، نلغي السكرة
    dlg.cancelClose = () => {
      if (!closing) return;
      const c = closing;
      closing = null;
      c.a.cancel();
      if (c.b) c.b.cancel();
    };

    // زر Esc: نخليه يمر من نفس الحركة
    dlg.addEventListener('cancel', (e) => {
      if (e.defaultPrevented) return;
      e.preventDefault();
      dlg.close();
    });
  }

  const sheet = document.getElementById('sheet');
  const ask = document.getElementById('askDlg');
  if (sheet) {
    dialogMotion(sheet, true);
    new MutationObserver(() => sheet.cancelClose()).observe(document.getElementById('sheetBody'), { childList: true });
  }
  if (ask) dialogMotion(ask, false);

  // ---------- مؤشر التبويب: حبة تنزلق من التبويب القديم للجديد ----------
  // شريط التبويبات ينرسم من جديد كل مرة، فنحفظ مكان الحبة ونحرّكها من المكان القديم (FLIP)
  const tabbar = document.getElementById('tabbar');
  let lastPillX = null;
  function placePill() {
    const on = tabbar.querySelector('.tab.on');
    if (!on) return;
    let pill = tabbar.querySelector('.tab-pill');
    if (!pill) { pill = document.createElement('span'); pill.className = 'tab-pill'; pill.setAttribute('aria-hidden', 'true'); tabbar.prepend(pill); }
    const bar = tabbar.getBoundingClientRect(), r = on.getBoundingClientRect();
    const w = Math.min(r.width - 8, 72), x = r.left - bar.left + (r.width - w) / 2;
    pill.style.width = w + 'px';
    pill.style.transform = 'translateX(' + x + 'px)';
    if (lastPillX != null && Math.abs(lastPillX - x) > 1 && !reduced()) {
      pill.animate({ transform: ['translateX(' + lastPillX + 'px)', 'translateX(' + x + 'px)'] }, { duration: 260, easing: EASE_OUT });
    }
    lastPillX = x;
  }
  if (tabbar) {
    new MutationObserver((m) => { if (m.some((r) => [...r.addedNodes].some((n) => n.classList && n.classList.contains('tab')))) placePill(); })
      .observe(tabbar, { childList: true });
    window.addEventListener('resize', () => { lastPillX = null; placePill(); });
    placePill();
  }
})(window);

// 🔴 رقم على أيقونة التطبيق = مهام اليوم + المتأخرة اللي ما خلصت (iOS 16.4+ بعد ما تثبّته وتسمح بالتنبيهات)
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E) return;
  const { S, st } = A;
  const KEY = 'hayati-badge';
  const on = () => { try { return localStorage.getItem(KEY) !== 'off'; } catch (e) { return true; } };
  const supported = 'setAppBadge' in navigator;

  // المواعيد تطلع بجدول اليوم، فالرقم للمهام والواجبات والاختبارات بس
  function pending(now) {
    const end = new Date(now || Date.now()); end.setHours(23, 59, 59, 999);
    return st.tasks.filter((t) => !t.done && t.due_at && t.kind !== 'appointment' && new Date(t.due_at) <= end).length;
  }
  let last = -1;
  function update() {
    if (!supported) return;
    const allowed = on() && (!('Notification' in window) || Notification.permission === 'granted');
    const n = allowed ? pending() : 0;
    if (n === last) return;
    last = n;
    (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
  }

  const prevExtra = E.settingsExtra;
  E.settingsExtra = function () {
    if (!supported) return prevExtra ? prevExtra.apply(this, arguments) : '';
    return (prevExtra ? prevExtra.apply(this, arguments) : '') +
      '<div class="group-title">' + A.I('bell') + 'رقم على الأيقونة</div><div class="card">' +
      '<label class="switch"><input type="checkbox" data-set="badge"' + (on() ? ' checked' : '') + '> عدد مهام اليوم والمتأخرة على أيقونة التطبيق</label>' +
      '<p class="small muted" style="margin:8px 0 0">يطلع بس لما يكون التطبيق مثبّت والتنبيهات مسموحة. اليوم: <b class="num">' + pending() + '</b></p></div>';
  };
  document.addEventListener('change', (e) => {
    const b = e.target.closest('[data-set="badge"]');
    if (!b) return;
    try { localStorage.setItem(KEY, b.checked ? 'on' : 'off'); } catch (err) { /* تجاهل */ }
    last = -1; update();
  });

  S.subscribe(update);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') update(); });
  setInterval(update, 60000);
  update();
  window.HayatiPWA = { pending, update };
})();

// 🔎 بحث بكل التطبيق (مصاريف، مهام، جدول، مباريات) + ↩️ تراجع بعد أي حذف
(function () {
  'use strict';

  const A = window.App;
  if (!A) return;
  const { S, st, I, h, fmt, money } = A;

  // ================= البحث =================
  // «أ/إ/آ = ا»، «ة = ه»، «ى = ي»، بدون تشكيل، والأرقام العربية = إنقليزي
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
      .replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))
      .replace(/٫/g, '.').trim();
  }
  const hit = (q, ...fields) => q.every((w) => fields.some((f) => norm(f).includes(w)));
  const day = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.getDate() + ' ' + A.MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };

  // «كوستا» تلقى «Costa»: نضيف أسماء المحل المعروفة بالعربي والإنقليزي
  function brandWords(name) {
    const P = window.SmsParser;
    if (!P || !P.brand || !name) return '';
    const b = P.brand(name), hit = P.BRANDS.find((x) => x[0] === b.key);
    return hit ? b.label + ' ' + hit[2].source.replace(/\\[bs]\*?|[()|\\.]/g, ' ') : '';
  }

  function search(text) {
    const q = norm(text).split(/\s+/).filter(Boolean);
    if (!q.length) return null;
    const tx = st.transactions
      .filter((t) => hit(q, t.merchant, brandWords(t.merchant), t.note, t.category, Number(t.amount).toFixed(3), t.raw))
      .sort((a, b) => new Date(b.occurred_at) - new Date(a.occurred_at));
    const tasks = st.tasks.filter((t) => hit(q, t.title, t.notes, t.place));
    const courses = st.courses.filter((c) => hit(q, c.name, c.room, c.code));
    const matches = (st.matches || []).filter((m) => hit(q, m.opponent, m.notes, m.date));
    return { tx, tasks, courses, matches };
  }

  function results(r) {
    if (!r) return '<p class="small muted" style="margin:8px 4px">جرّب: اسم محل، مبلغ، مادة، مهمة، أو خصم.</p>';
    const n = r.tx.length + r.tasks.length + r.courses.length + r.matches.length;
    if (!n) return '<p class="small muted" style="margin:8px 4px">ما لقيت شي.</p>';
    let out = '';
    if (r.tx.length) {
      const exp = r.tx.filter((t) => t.kind !== 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      out += '<div class="group-title">' + I('wallet') + 'المصاريف <span class="muted">(' + r.tx.length + ')</span></div>' +
        (exp ? '<div class="card find-sum"><small class="muted">مجموع اللي صرفته عليها</small><b>' + money(exp) + '</b></div>' : '') +
        '<div class="menu">' + r.tx.slice(0, 30).map((t) =>
          '<button data-find="tx" data-id="' + h(t.id) + '">' + A.catIcon(t.category, t.kind) + '<div style="flex:1;min-width:0"><b>' + h(t.merchant || t.category || 'عملية') + '</b><small>' + day(t.occurred_at) + '</small></div>' +
          '<span class="num ' + (t.kind === 'income' ? 'pos' : '') + '">' + (t.kind === 'income' ? '+' : '') + fmt(t.amount) + '</span></button>').join('') + '</div>' +
        (r.tx.length > 30 ? '<p class="small muted" style="margin:6px 4px">وفيه ' + (r.tx.length - 30) + ' أقدم. زيد كلمة عشان تضيّق.</p>' : '');
    }
    if (r.tasks.length) out += '<div class="group-title">' + I('check') + 'المهام <span class="muted">(' + r.tasks.length + ')</span></div><div class="menu">' +
      r.tasks.slice(0, 20).map((t) => '<button data-find="task" data-id="' + h(t.id) + '"><div style="flex:1;min-width:0"><b>' + (t.done ? '✓ ' : '') + h(t.title) + '</b><small>' + (t.due_at ? day(t.due_at) : 'بدون موعد') + '</small></div></button>').join('') + '</div>';
    if (r.courses.length) out += '<div class="group-title">' + I('calendar') + 'الجدول <span class="muted">(' + r.courses.length + ')</span></div><div class="menu">' +
      r.courses.map((c) => '<button data-find="course" data-id="' + h(c.id) + '"><div style="flex:1;min-width:0"><b>' + h(c.name) + '</b><small>' + (c.days || []).map((d) => A.DAYS[d]).join('، ') + (c.start_time ? ' · ' + A.time12(c.start_time) : '') + '</small></div></button>').join('') + '</div>';
    if (r.matches.length) out += '<div class="group-title">🧤 المباريات <span class="muted">(' + r.matches.length + ')</span></div><div class="menu">' +
      r.matches.map((m) => '<button data-find="match" data-id="' + h(m.id) + '"><div style="flex:1;min-width:0"><b>' + h(m.opponent || 'مباراة') + '</b><small>' + h(m.date || '') + '</small></div><span class="num">' + (m.for != null ? m.for + '–' + m.against : '') + '</span></button>').join('') + '</div>';
    return out;
  }

  function open(prefill) {
    A.openSheet({
      title: 'بحث',
      cancelLabel: 'تم',
      body: '<div class="field" style="margin-bottom:6px"><input type="search" id="findQ" enterkeyhint="search" autocomplete="off" placeholder="Costa، 3.750، محاسبة، المحرق…" value="' + h(prefill || '') + '"></div><div id="findRes"></div>',
      mount(root) {
        const q = root.querySelector('#findQ'), res = root.querySelector('#findRes');
        let t;
        const draw = () => { res.innerHTML = results(search(q.value)); };
        q.oninput = () => { clearTimeout(t); t = setTimeout(draw, 120); };
        res.onclick = (e) => {
          const b = e.target.closest('[data-find]');
          if (!b) return;
          const id = b.dataset.id, kind = b.dataset.find;
          A.closeSheet();
          setTimeout(() => {
            if (kind === 'tx') document.dispatchEvent(new CustomEvent('hayati-open', { detail: { action: 'edit-tx', id } }));
            else if (kind === 'task') A.taskForm(st.tasks.find((x) => x.id === id));
            else if (kind === 'course') A.courseForm(st.courses.find((x) => x.id === id));
            else if (kind === 'match') { A.ui.studySeg = 'health'; A.go('schedule'); }
          }, 280);
        };
        draw();
        setTimeout(() => q.focus(), 60);
      },
    });
  }
  // زر البحث بالهيدر جنب الإعدادات
  const btn = document.createElement('button');
  btn.className = 'icon-btn'; btn.id = 'findBtn'; btn.type = 'button'; btn.setAttribute('aria-label', 'بحث');
  btn.innerHTML = I('search');
  btn.onclick = () => open();
  const set = document.getElementById('settingsBtn');
  if (set) set.parentNode.insertBefore(btn, set);
  // فتح عملية بالبحث: نفس زر «edit-tx» بالقائمة
  document.addEventListener('hayati-open', (e) => {
    const fake = document.createElement('button');
    fake.dataset.action = e.detail.action; fake.dataset.id = e.detail.id; fake.hidden = true;
    document.getElementById('view').appendChild(fake); fake.click(); fake.remove();
  });

  // ================= التراجع بعد الحذف =================
  const bar = document.createElement('div');
  bar.className = 'undo-bar'; bar.setAttribute('role', 'status');
  bar.innerHTML = '<span></span><button type="button">تراجع</button>';
  document.body.appendChild(bar);
  let batch = [], timer = null, flush = null;
  const origRemove = S.remove;
  S.remove = function (table, id) {
    const row = (st[table] || []).find((r) => r.id === id);
    origRemove.call(S, table, id);
    if (!row) return;
    batch.push([table, JSON.parse(JSON.stringify(row))]);
    // الحذف الجماعي (مثل «امسح المشتريات المخلّصة») = تراجع واحد
    clearTimeout(flush);
    flush = setTimeout(show, 0);
  };
  function show() {
    const items = batch; batch = [];
    const toast = document.getElementById('toast');
    if (toast) toast.classList.remove('show');
    bar.querySelector('span').textContent = items.length > 1 ? 'انحذف ' + items.length : 'انحذفت';
    bar.classList.add('show');
    bar.querySelector('button').onclick = () => {
      for (const [table, row] of items) S.upsert(table, row);
      hide(); A.toast('رجعت ✓'); A.render();
    };
    clearTimeout(timer);
    timer = setTimeout(hide, 6000);
  }
  function hide() { bar.classList.remove('show'); clearTimeout(timer); }

  window.HayatiFind = { search, norm, open };
})();

// 📈 توقع آخر الشهر + 🧤 جاهزية اليوم (نوم + HRV + نبض + حِمل أمس)
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E) return;
  const { st, h, fmt } = A;
  const wrap = (name, fn) => { const prev = E[name]; E[name] = (...a) => fn(prev ? prev : () => '', ...a); };
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const median = (xs) => { const s = xs.slice().sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

  // ================= توقع آخر الشهر =================
  // المعدل اليومي من المصاريف «العادية» بس: الاشتراكات ثابتة (انحسبت)، وأي عملية فوق ربع الميزانية مرة وحدة (رسوم، قطعة غالية) ما تتكرر
  function forecast(now) {
    now = now || new Date();
    const budget = Number(st.settings.budget) || 0;
    const day = now.getDate();
    const daysIn = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    if (day < 5) return null; // أول الشهر الأرقام تكذب
    const list = A.txInMonth(A.monthKey(now)).filter((t) => t.kind !== 'income');
    const spent = list.reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const oneOff = budget ? budget * 0.25 : Infinity;
    const regular = list.filter((t) => t.source !== 'subscription' && Number(t.amount) < oneOff).reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const pace = regular / day;
    const end = spent + pace * (daysIn - day);
    return { spent, pace, end, budget, over: budget ? end - budget : null, daysLeft: daysIn - day };
  }
  function forecastLine() {
    const f = forecast();
    if (!f || !f.budget) return '';
    const bad = f.over > 0;
    return '<div class="meta forecast" style="margin-top:4px;display:block"><span style="display:block">📈 توقع آخر الشهر: <b class="num">' + fmt(f.end) + '</b></span>' +
      '<span style="display:block;' + (bad ? 'color:#FFB4A6;font-weight:600' : '') + '">' + (bad ? 'فوق الميزانية بـ ' + fmt(f.over) : 'تحت الميزانية بـ ' + fmt(-f.over)) + '</span></div>';
  }
  wrap('allowance', (prev, exp, budget) => prev(exp, budget) + forecastLine());

  // ================= جاهزية اليوم =================
  function readiness(now) {
    now = now || new Date();
    const today = dateKey(now);
    const doc = st.daily.find((d) => d.date === today && d.watch);
    if (!doc || doc.sleep == null) return null;
    const goal = Number(st.settings.sleep_goal) || 8;
    // خط الأساس = آخر 14 ليلة قبل اليوم (يحتاج 3 على الأقل)
    const past = st.daily.filter((d) => d.watch && d.date < today).sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 14);
    const base = (k) => { const xs = past.map((d) => d[k]).filter((x) => x != null); return xs.length >= 3 ? median(xs) : null; };
    const parts = [];
    // النوم (40)
    parts.push({ w: 40, s: clamp((doc.sleep - (goal - 2.5)) / 2.5, 0, 1), chip: 'نوم ' + doc.sleep + ' من ' + goal, bad: doc.sleep < goal - 1 });
    // HRV مقارنة بنفسك (30): أقل من المعتاد بـ 25% = صفر
    const bh = base('hrv');
    if (doc.hrv != null && bh) {
      const r = doc.hrv / bh;
      parts.push({ w: 30, s: clamp((r - 0.75) / 0.25, 0, 1), chip: 'HRV ' + (r >= 1 ? '+' : '−') + Math.abs(Math.round((r - 1) * 100)) + '%', bad: r < 0.9 });
    }
    // نبض الراحة (15): أعلى من المعتاد بـ 7 = صفر
    const br = base('rhr');
    if (doc.rhr != null && br) {
      const d = doc.rhr - br;
      parts.push({ w: 15, s: clamp(1 - d / 7, 0, 1), chip: 'نبض ' + (d > 0 ? '+' : '') + Math.round(d), bad: d >= 4 });
    }
    // حِمل أمس (15): مباراة = ثقيل، تمرين = متوسط
    const y = new Date(now); y.setDate(y.getDate() - 1);
    const match = (st.matches || []).find((m) => m.date === dateKey(y));
    const sessions = A.agendaOn(y).filter((x) => x.type === 'gym' || x.type === 'activity').length;
    const load = match ? clamp((Number(match.minutes) || 90) / 90, 0.5, 1) : sessions ? 0.5 : 0;
    parts.push({ w: 15, s: 1 - load, chip: match ? 'مباراة أمس' : sessions ? 'تمرين أمس' : 'راحة أمس', bad: load >= 1 });
    const W = parts.reduce((s, p) => s + p.w, 0);
    const score = Math.round(parts.reduce((s, p) => s + p.w * p.s, 0) / W * 100);
    const zone = score >= 75 ? 'green' : score >= 55 ? 'yellow' : 'red';
    return { score, zone, parts, hasBaseline: !!(bh || br) };
  }
  const ZONES = {
    green: ['🟢', 'جاهز لتمرين قوي', 'قفز وارتماءات وسرعة ردة فعل — يومك تضغط فيه.', '#2F9E7A'],
    yellow: ['🟡', 'تمرين متوسط', 'مسك كرة وتمركز وتوزيع. خفّف القفز المتكرر.', '#B45309'],
    red: ['🔴', 'يوم استشفاء', 'إطالة ومرونة ومشي خفيف. لا ارتماءات اليوم.', '#D63A3A'],
  };
  // للحارس نصايح حراسة، ولباقي الرياضيين نصايح عامة
  const ZONES_ANY = {
    green: ['🟢', 'جاهز لتمرين قوي', 'يومك تضغط فيه: سرعة، قوة، أو تمرين طويل.', '#2F9E7A'],
    yellow: ['🟡', 'تمرين متوسط', 'خفّف الشدة: تكنيك، مشي سريع، أو أوزان خفيفة.', '#B45309'],
    red: ['🔴', 'يوم استشفاء', 'إطالة ومشي خفيف ونوم بدري.', '#D63A3A'],
  };
  function readinessCard() {
    if (A.has && !A.has('athlete') && !A.has('keeper')) return '';
    const r = readiness();
    if (!r) return '';
    const [emo, title, tip, col] = (!A.has || A.has('keeper') ? ZONES : ZONES_ANY)[r.zone];
    return '<div class="card readiness" style="--z:' + col + '"><div class="rd-head"><span class="rd-emo">' + emo + '</span><div style="flex:1;min-width:0">' +
      '<small class="muted">' + (!A.has || A.has('keeper') ? '🧤' : '💪') + ' جاهزيتك اليوم</small><b>' + title + '</b></div><b class="num rd-score">' + r.score + '</b></div>' +
      '<p class="small" style="margin:6px 0 8px;color:var(--text-2)">' + tip + '</p>' +
      '<div class="rd-chips">' + r.parts.map((p) => '<span class="' + (p.bad ? 'bad' : '') + '">' + h(p.chip) + '</span>').join('') + '</div>' +
      (r.hasBaseline ? '' : '<p class="small muted" style="margin:8px 0 0">بعد 3 ليالي من الساعة تصير المقارنة بمعدلك أنت.</p>') +
      '<p class="small muted" style="margin:6px 0 0">تقدير من بياناتك، مو تشخيص طبي.</p></div>';
  }
  wrap('todayTop', (prev) => readinessCard() + prev());

  window.HayatiInsights = { forecast, readiness };
  A.render();
})();

</script>
  <script>/* community.js */
// 👥 «حياتي» للكل: بطاقة تعارف أول مرة (الاسم، مين أنت، الصلاة، الميزانية) + «ملفك» بالإعدادات
//   roles فاضية = كل الميزات (المستخدمين القدامى ما يتغير عليهم شي)
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E) return;
  const { S, st, I, h } = A;
  const wrap = (name, fn) => { const prev = E[name]; E[name] = (...a) => fn(prev ? prev : () => '', ...a); };

  const ROLES = [
    ['student', '🎓', 'طالب'], ['employee', '💼', 'موظف'], ['athlete', '🏃', 'رياضي'],
    ['keeper', '🧤', 'حارس مرمى'], ['home', '🏠', 'شؤون البيت'],
  ];
  const PRAYER = [['gulf', 'أهل السنة (5 أوقات)'], ['jafari', 'جعفري (3 أوقات)'], ['off', 'لا تظهرها']];

  // تطلع بس لمستخدم جديد: ما عرّفنا عليه، وما عنده بيانات
  function isNew() {
    const s = st.settings || {};
    if (s.onboarded || Array.isArray(s.roles)) return false;
    return !st.transactions.length && !st.courses.length && !st.tasks.length;
  }

  function form(s, compact) {
    const roles = Array.isArray(s.roles) ? s.roles : [];
    const pm = s.prayer_on === false ? 'off' : (s.prayer_method || '');
    return '<div class="field"><label for="obName">اسمك (اختياري)</label><input id="obName" maxlength="24" autocomplete="given-name" placeholder="مثلاً: فاطمة" value="' + h(s.name || '') + '"></div>' +
      '<div class="field"><label>أنا… (اختار كل اللي ينطبق)</label><div class="ob-roles">' +
      ROLES.map(([k, e, l]) => '<button type="button" class="ob-chip' + (roles.includes(k) ? ' on' : '') + '" data-role="' + k + '" aria-pressed="' + roles.includes(k) + '">' + e + ' ' + l + '</button>').join('') + '</div></div>' +
      '<div class="field"><label>أوقات الصلاة</label><div class="seg" id="obPrayer">' +
      PRAYER.map(([k, l]) => '<button type="button" data-p="' + k + '" class="' + (pm === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
      (compact ? '' : '<div class="field"><label for="obBudget">ميزانيتك الشهرية (اختياري)</label><input id="obBudget" inputmode="decimal" placeholder="مثلاً 300" value="' + h(s.budget || '') + '"></div>');
  }
  function read(root) {
    const roles = [...root.querySelectorAll('.ob-chip.on')].map((b) => b.dataset.role);
    // حارس المرمى رياضي أصلاً
    if (roles.includes('keeper') && !roles.includes('athlete')) roles.push('athlete');
    const p = root.querySelector('#obPrayer .on');
    const patch = { name: root.querySelector('#obName').value.trim(), roles, onboarded: true };
    if (p) { if (p.dataset.p === 'off') patch.prayer_on = false; else { patch.prayer_on = true; patch.prayer_method = p.dataset.p; } }
    const b = root.querySelector('#obBudget');
    if (b && b.value.trim()) { const v = A.parseAmount(b.value); if (v > 0) patch.budget = v; }
    return patch;
  }
  function bind(root) {
    root.addEventListener('click', (e) => {
      const c = e.target.closest('.ob-chip');
      if (c) { c.classList.toggle('on'); c.setAttribute('aria-pressed', c.classList.contains('on')); return; }
      const p = e.target.closest('#obPrayer button');
      if (p) root.querySelectorAll('#obPrayer button').forEach((x) => x.classList.toggle('on', x === p));
    });
  }

  // اللغة: العربي أو English (يعيد فتح التطبيق، وبياناتك ما تتغير)
  const curLang = () => (window.HayatiLang && window.HayatiLang.lang) || 'ar';
  function langSeg() {
    return '<div class="seg lang-seg" data-noi18n style="margin:0 0 12px">' +
      [['ar', 'العربية'], ['en', 'English']].map(([k, l]) => '<button type="button" data-lang="' + k + '" class="' + (curLang() === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-lang]');
    if (!b || !window.HayatiLang || b.dataset.lang === curLang()) return;
    window.HayatiLang.set(b.dataset.lang);
  });

  // ---------- بطاقة التعارف بأول صفحة ----------
  function welcomeCard() {
    if (!isNew()) return '';
    return '<div class="card ob" id="obCard">' + langSeg() + '<b class="ob-title">👋 هلا! خلّنا نعرفك</b>' +
      '<p class="small muted" style="margin:2px 0 12px">عشان «حياتي» يوريك اللي يهمك بس. بياناتك تظل بجهازك.</p>' +
      form(st.settings || {}) +
      // حساب خاص (يحفظ بياناتك بين أجهزتك): يطلع بس لو المزامنة مركّبة، وإلا ملفك يكون على هالجهاز
      (S.getConfig && S.getConfig() ? '<button type="button" class="btn ghost block" style="margin-bottom:10px" data-action="ob-account">🔐 أنشئ حساب (بياناتك على كل أجهزتك)</button>' :
        '<p class="small muted" style="margin:0 0 10px">🔒 ملفك محفوظ على هالجهاز. الحسابات والمزامنة بين الأجهزة لسه قيد التطوير.</p>') +
      '<div class="btn-row"><button class="btn primary" data-action="ob-save">يلا نبدأ</button><button class="btn ghost" data-action="ob-skip">بعدين</button></div></div>';
  }
  wrap('todayTop', (prev) => welcomeCard() + prev());
  wrap('action', (prev, name, el, e) => {
    if (name === 'ob-save') {
      const patch = read(document.getElementById('obCard'));
      S.setSettings(patch);
      A.toast(patch.name ? 'أهلاً ' + patch.name + ' 👋' : 'أهلاً فيك 👋');
      A.render(); return;
    }
    if (name === 'ob-skip') { S.setSettings({ onboarded: true }); A.render(); return; }
    if (name === 'ob-account') {
      S.setSettings(read(document.getElementById('obCard')));
      A.render(); setTimeout(() => { const b = document.getElementById('settingsBtn'); if (b) b.click(); }, 200);
      return;
    }
    return prev(name, el, e);
  });
  new MutationObserver(() => { const c = document.getElementById('obCard'); if (c && !c.dataset.b) { c.dataset.b = 1; bind(c); } })
    .observe(document.getElementById('view'), { childList: true });

  // ---------- «ملفك» بالإعدادات ----------
  const prevExtra = E.settingsExtra;
  E.settingsExtra = function () {
    const s = st.settings || {};
    const roles = Array.isArray(s.roles) && s.roles.length ? s.roles : null;
    const who = roles ? ROLES.filter(([k]) => roles.includes(k)).map(([, e, l]) => e + ' ' + l).join(' · ') : 'كل الميزات ظاهرة';
    return '<div class="group-title">🌐 اللغة · Language</div><div class="card">' + langSeg() + '<p class="small muted" style="margin:0">English (beta): الترجمة للواجهة بس، وبياناتك تظل مثل ما هي.</p></div>' +
      '<div class="group-title">' + I('user') + 'ملفك</div><div class="menu">' +
      '<button data-set="profile"><div class="ico" style="' + A.tint('#13636B') + '">' + I('user') + '</div><div style="flex:1;min-width:0"><b>' + h(s.name || 'اسمك ومين أنت') + '</b><small>' + h(who) + '</small></div>' + I('chevL') + '</button>' +
      // «سوّ ميزتك»: الاقتراح يروح رسالة على إنستقرام، وكل أسبوع وحدة تنبني
      '<button data-set="feedback"><div class="ico" style="' + A.tint('#13636B') + '">' + I('message') + '</div><div style="flex:1;min-width:0"><b>رأيك بالتطبيق</b><small>دقيقة وحدة، وكل رأي ينقرا</small></div>' + I('chevL') + '</button>' +
      '<a class="menu-link" href="https://ig.me/m/hayati.bh" target="_blank" rel="noopener"><div class="ico" style="' + A.tint('#FF6B4A') + '">' + I('sparkle') + '</div><div style="flex:1;min-width:0"><b>💡 اقترح ميزة</b><small>كل أسبوع نبني اقتراح، ونذكر اسمك</small></div>' + I('chevL') + '</a></div>' +
      (prevExtra ? prevExtra.apply(this, arguments) : '');
  };
  const prevSet = E.settingsAction;
  E.settingsAction = async function (act) {
    if (act === 'profile') { A.closeSheet(); setTimeout(profileSheet, 280); return true; }
    if (act === 'feedback') { A.closeSheet(); setTimeout(feedbackSheet, 280); return true; }
    return prevSet ? prevSet.apply(this, arguments) : false;
  };
  function profileSheet() {
    A.openSheet({
      title: 'ملفك',
      body: '<p class="small muted" style="margin:0 0 12px">اللي تختاره يحدد وش يطلع لك: المعدل للطالب، الجاهزية للرياضي، ووضع الحارس للحارس. ما تختار شي = كل شي يطلع.</p>' + form(st.settings || {}, true),
      mount: bind,
      onSave(root) { S.setSettings(read(root)); A.toast('انحفظ ✓'); },
    });
  }

  // ---------- «رأيك بالتطبيق»: يجهّز الرسالة وينسخها، وتنرسل لـ @hayati.bh على إنستقرام ----------
  function feedbackText(root) {
    const stars = Number(root.dataset.stars || 0);
    const bad = root.querySelector('#fbBad').value.trim(), want = root.querySelector('#fbWant').value.trim();
    const roles = (st.settings.roles || []).map((r) => (ROLES.find((x) => x[0] === r) || [])[2]).filter(Boolean).join('، ');
    return ['رأيي في «حياتي» 📱', stars ? 'التقييم: ' + '★'.repeat(stars) + '☆'.repeat(5 - stars) : '', bad ? 'ضايقني: ' + bad : '', want ? 'أبي: ' + want : '', roles ? 'أنا: ' + roles : ''].filter(Boolean).join('\n');
  }
  function feedbackSheet() {
    A.openSheet({
      title: 'رأيك بالتطبيق',
      saveLabel: 'انسخ وأرسل',
      body: '<p class="small muted" style="margin:0 0 12px">«حياتي» قيد التطوير، ورأيك يقرر وش ينبني بعد. نجهّز لك الرسالة، تنسخها، وترسلها لنا على إنستقرام.</p>' +
        '<div class="field"><label>تقييمك</label><div id="fbStars" class="fb-stars" dir="ltr">' + [1, 2, 3, 4, 5].map((n) => '<button type="button" data-n="' + n + '" aria-label="' + n + ' من 5">★</button>').join('') + '</div></div>' +
        '<div class="field"><label for="fbBad">وش ضايقك أو ما اشتغل زين؟</label><textarea id="fbBad" maxlength="600"></textarea></div>' +
        '<div class="field"><label for="fbWant">وش الميزة اللي تبيها؟</label><textarea id="fbWant" maxlength="600"></textarea></div>',
      mount(root) {
        root.querySelector('#fbStars').onclick = (e) => {
          const b = e.target.closest('button'); if (!b) return;
          root.dataset.stars = b.dataset.n;
          root.querySelectorAll('#fbStars button').forEach((x) => x.classList.toggle('on', Number(x.dataset.n) <= Number(b.dataset.n)));
        };
      },
      async onSave(root) {
        const text = feedbackText(root);
        if (!root.dataset.stars && !root.querySelector('#fbBad').value.trim() && !root.querySelector('#fbWant').value.trim()) throw new Error('اختار تقييم أو اكتب شي');
        let copied = false;
        try { await navigator.clipboard.writeText(text); copied = true; } catch (e) { /* بعض المتصفحات تمنع النسخ */ }
        window.open('https://ig.me/m/hayati.bh', '_blank', 'noopener');
        A.toast(copied ? 'انسخت ✓ الصقها بالرسالة' : 'افتحنا إنستقرام — اكتب رأيك هناك');
      },
    });
  }
  window.HayatiFeedback = { feedbackText };

  window.HayatiProfile = { ROLES, isNew };
  A.render();
})();

  <script>/* privacy.js */
// 🔒 الخصوصية: إخفاء أرقام البطاقات بالرسايل القديمة + «سياسة الخصوصية» + «احذف كل بياناتي»
(function () {
  'use strict';

  const A = window.App, E = window.Extras;
  if (!A || !E || !window.SmsParser || !window.SmsParser.mask) return;
  const { S, st, I, h } = A;
  const mask = window.SmsParser.mask;

  // الرسايل اللي انحفظت قبل الإخفاء: نخفي أرقامها مرة وحدة (وتتزامن مخفية)
  function maskOld() {
    let n = 0;
    for (const t of st.transactions) {
      if (!t.raw) continue;
      const m = mask(t.raw);
      if (m !== t.raw) { S.upsert('transactions', Object.assign({}, t, { raw: m })); n++; }
    }
    return n;
  }
  let masked = false;
  S.subscribe(() => { if (!masked && st.transactions.length) { masked = true; setTimeout(maskOld, 0); } });

  // ---------- الإعدادات ----------
  const prevExtra = E.settingsExtra;
  E.settingsExtra = function () {
    return (prevExtra ? prevExtra.apply(this, arguments) : '') +
      '<div class="group-title">' + I('key') + 'الخصوصية</div><div class="menu">' +
      '<a class="menu-link" href="privacy.html" target="_blank" rel="noopener"><div class="ico" style="' + A.tint('#13636B') + '">' + I('key') + '</div><div style="flex:1;min-width:0"><b>سياسة الخصوصية</b><small>وين بياناتك، ومين يشوفها</small></div>' + I('chevL') + '</a>' +
      '<button data-set="wipe"><div class="ico" style="' + A.tint('#D63A3A') + '">' + I('trash') + '</div><div style="flex:1;min-width:0"><b style="color:var(--expense)">احذف كل بياناتي</b><small>من الجهاز والمزامنة، وما ترجع</small></div>' + I('chevL') + '</button></div>';
  };
  const prevSet = E.settingsAction;
  E.settingsAction = async function (act) {
    if (act === 'wipe') { A.closeSheet(); setTimeout(wipeSheet, 280); return true; }
    return prevSet ? prevSet.apply(this, arguments) : false;
  };

  function wipeSheet() {
    const WORD = 'احذف';
    A.openSheet({
      title: 'احذف كل بياناتي',
      saveLabel: 'احذف نهائياً',
      body: '<div class="card alert-card over" style="margin-bottom:14px"><div class="ico" style="' + A.tint('#D63A3A') + '">' + I('alert') + '</div><div style="flex:1"><b>ما فيه رجعة</b>' +
        '<div class="small muted">ينمسح كل شي: المصاريف، الجدول، المهام، الصحة، الإعدادات، والرمز السري. من هالجهاز ومن المزامنة.</div></div></div>' +
        '<button type="button" class="btn ghost block" id="wipeBackup" style="margin-bottom:14px">' + I('download') + 'نزّل نسخة احتياطية أول</button>' +
        '<div class="field"><label for="wipeWord">اكتب «' + WORD + '» عشان تأكد</label><input id="wipeWord" autocomplete="off"></div>',
      mount(root) {
        root.querySelector('#wipeBackup').onclick = () => A.saveFile('hayati-backup-' + new Date().toISOString().slice(0, 10) + '.json', S.exportJSON(), 'application/json');
      },
      async onSave(root) {
        if (root.querySelector('#wipeWord').value.trim() !== WORD) throw new Error('اكتب «' + WORD + '» بالضبط');
        const r = await S.wipeAll();
        A.toast(r.ok ? 'انحذف كل شي ✓' : 'انحذف من الجهاز، وبعض المزامنة ما انحذفت — جرّب مرة ثانية');
        setTimeout(() => location.reload(), 900);
      },
    });
  }

  window.HayatiPrivacy = { maskOld };
})();

</script>
