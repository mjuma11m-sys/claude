    } else if (!s.configured) {
      body += '<p class="small muted" style="margin:0 0 12px">البيانات الحين على هذا الجهاز بس. اربط التطبيق بـ Supabase عشان تتزامن (الخطوات في ملف «طريقة التشغيل»).</p>' +
        '<div class="field"><label>Project URL</label><input name="sb_url" class="ltr" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off"></div>' +
        '<div class="field"><label>anon public key</label><input name="sb_key" class="ltr" placeholder="eyJhbGciOi…" autocapitalize="off" autocorrect="off"></div>' +
        '<button class="btn primary block" data-set="connect">' + I('link') + 'ربط</button>';
    } else if (!s.signedIn) {
      body += '<p class="small muted" style="margin:0 0 12px">سجّل دخول بنفس الإيميل على الجوال والماك.</p>' +
        '<div class="field"><label>الإيميل</label><input name="email" type="email" class="ltr" autocomplete="username" autocapitalize="off"></div>' +
        '<div class="field"><label>كلمة المرور</label><input name="password" type="password" class="ltr" autocomplete="current-password"></div>' +
        '<div class="btn-row"><button class="btn primary" data-set="signin">دخول</button><button class="btn" data-set="signup">حساب جديد</button></div>' +
        (cfg && !cfg.fromFile ? '<button class="btn ghost block" style="margin-top:10px" data-set="disconnect">تغيير بيانات Supabase</button>' : '');
    } else {
      body += '<div class="status-line"><div class="ico">' + I('user') + '</div><div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis">' + h(s.email) + '</b>' +
        '<span class="small ' + (s.error ? 'late' : 'muted') + '">' + (s.error ? h(s.error) : s.lastSync ? 'آخر مزامنة ' + timeOf(s.lastSync) : 'جاري المزامنة…') +
        (st.pending.length ? ' · ' + st.pending.length + ' بانتظار الرفع' : '') + '</span></div></div>' +
        '<div class="btn-row" style="margin-top:14px"><button class="btn" data-set="sync">' + I('refresh') + 'زامن</button><button class="btn" data-set="signout">' + I('logout') + 'خروج</button></div>';
    }
    body += '</div>';

    body += '<div class="group-title">' + I('message') + 'تسجيل رسايل البنك تلقائياً</div><div class="card">';
    if (s.mode === 'artifact') {
      body += '<p class="small muted" style="margin:0 0 12px">التسجيل التلقائي من الاختصارات يحتاج قاعدة بيانات Supabase (الخطوات في ملف «طريقة التشغيل»). للحين: انسخ رسالة البنك والصقها، والتطبيق يقرأها لحاله.</p>' +
        '<button class="btn primary block" data-set="paste">' + I('message') + 'لصق رسالة بنك</button>';
    } else if (!s.signedIn) {
      body += '<p class="small muted" style="margin:0">تحتاج تربط المزامنة وتسجّل دخول أول. للحين تقدر تلصق الرسالة يدوياً من قسم المصاريف.</p>';
    } else {
      const token = S.ensureIngestToken();
      const url = cfg.url + '/rest/v1/rpc/ingest_sms';
      const copy = (label, value) => '<div class="copy-box"><code>' + h(label) + '</code><button data-copy="' + h(value) + '">' + I('copy') + 'نسخ</button></div>';
      body += '<p class="small muted" style="margin:0 0 8px">نسوي أتمتة في تطبيق <b>الاختصارات</b>، وكل ما توصلك رسالة من البنك أو Benefit تنرسل للتطبيق.</p>' +
        '<ol class="steps">' +
        '<li>افتح <b>الاختصارات</b> ← <b>الأتمتة</b> ← <b>+</b> ← <b>الرسائل</b>.</li>' +
        '<li><b>المرسل:</b> اسم البنك أو BenefitPay (أو «الرسالة تحتوي على» <code>BHD</code>)، واختر <b>تشغيل فوراً</b>.</li>' +
        '<li>أضف إجراء <b>«الحصول على محتويات URL»</b> بهذا الرابط:</li></ol>' + copy(url, url) +
        '<ol class="steps" start="4"><li>غيّر <b>الطريقة</b> إلى <b>POST</b>، وأضف في <b>الترويسات</b> <code>apikey</code> بهذي القيمة:</li></ol>' + copy(cfg.key.slice(0, 22) + '…', cfg.key) +
        '<ol class="steps" start="5"><li><b>نص الطلب: JSON</b>، حقل <code>token</code> بهذي القيمة:</li></ol>' + copy(token.slice(0, 16) + '…', token) +
        '<ol class="steps" start="6"><li>وحقل <code>body</code> قيمته <b>«مُدخل الاختصار»</b> أو <b>«المحتوى»</b>.</li>' +
        '<li>خلاص ✓ الرسايل الجديدة تطلع في المصاريف لما تفتح التطبيق.</li></ol>' +
        '<p class="small muted" style="margin:4px 0 10px">الرمز السري مثل المفتاح، لا تشاركه مع أحد.</p>' +
        '<button class="btn ghost block" data-set="rotate">' + I('key') + 'تغيير الرمز السري</button>';
    }
    body += '</div>';

    const perm = 'Notification' in window ? Notification.permission : 'unsupported';
    body += '<div class="group-title">' + I('bell') + 'التنبيهات</div><div class="card">' +
      '<p class="small muted" style="margin:0 0 12px">أضمن طريقة إنك تضيف الجدول للتقويم، فينبّهك حتى لو التطبيق مسكّر.</p>' +
      '<button class="btn primary block" data-set="calendar">' + I('calendar') + 'أضف الجدول للتقويم</button>' +
      (perm === 'default' ? '<button class="btn ghost block" style="margin-top:10px" data-set="notify">' + I('bell') + 'تنبيهات التطبيق (لما يكون مفتوح)</button>' :
        perm === 'granted' ? '<p class="small muted" style="margin:10px 0 0">تنبيهات التطبيق مفعّلة ✓</p>' : '') + '</div>';

    body += X('settingsExtra');
    body += '<div class="group-title">' + I('settings') + 'عام</div><div class="menu">' +
      '<button data-set="budget"><div class="ico" style="' + tint('#1A8A8F') + '">' + I('target') + '</div><div style="flex:1"><b>الميزانية الشهرية</b><small>' + (st.settings.budget ? fmt(st.settings.budget) + ' د.ب' : 'غير محددة') + '</small></div>' + I('chevL') + '</button>' +
      '<button data-set="export"><div class="ico" style="' + tint('#0d9488') + '">' + I('download') + '</div><div style="flex:1"><b>نسخة احتياطية</b><small>تصدير كل بياناتك كملف</small></div>' + I('chevL') + '</button>' +
      '<label style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);cursor:pointer"><div class="ico" style="' + tint('#f59e0b') + '">' + I('upload') + '</div><div style="flex:1"><b style="display:block">استيراد نسخة</b><small class="muted">من ملف نسخة احتياطية</small></div><input type="file" accept="application/json,.json" data-set="import" hidden></label>' +
      '</div>';

    body += '<div class="group-title">' + I('phone') + 'ثبّت التطبيق</div><div class="card"><p class="small" style="margin:0;color:var(--text-2)"><b>آيفون:</b> افتح الرابط في Safari ← زر المشاركة ← <b>إضافة إلى الشاشة الرئيسية</b>.<br>' +
      '<b>ماك:</b> Safari ← ملف ← <b>إضافة إلى Dock</b>.</p></div>';

    openSheet({
      title: 'الإعدادات',
      cancelLabel: 'تم',
      body,
      mount(root) {
        root.onclick = onSettingsClick;
        const imp = root.querySelector('[data-set=import]');
        if (imp) imp.onchange = async () => {
          const f = imp.files[0];
          if (!f) return;
          try { const n = S.importJSON(await f.text()); toast('استوردت ' + n + ' عنصر'); render(); } catch (e) { toast('الملف غير صالح'); }
        };
      },
    });
  }

  async function onSettingsClick(e) {
    const cp = e.target.closest('[data-copy]');
    if (cp) {
      try { await navigator.clipboard.writeText(cp.dataset.copy); toast('انسخ ✓'); } catch (err) { prompt('انسخ من هنا:', cp.dataset.copy); }
      return;
    }
    const b = e.target.closest('button[data-set]');
    if (!b) return;
    const root = sheetBody;
    const act = b.dataset.set;
    try {
      if (window.Extras && window.Extras.settingsAction && await window.Extras.settingsAction(act, root, b)) return;
      if (act === 'connect') {
        const url = val(root, 'sb_url'), key = val(root, 'sb_key');
        if (!/^https:\/\/.+\.supabase\.(co|in)\/?$/.test(url)) throw new Error('الرابط لازم يكون مثل https://xxxx.supabase.co');
        if (key.length < 30) throw new Error('المفتاح ناقص');
        await S.saveConfig(url, key);
        toast('انربط ✓ سجّل دخول الحين');
        settingsSheet();
      } else if (act === 'signin' || act === 'signup') {
        const email = val(root, 'email'), pw = root.querySelector('[name=password]').value;
        if (!email || !pw) throw new Error('اكتب الإيميل وكلمة المرور');
        b.disabled = true;
        if (act === 'signin') { await S.signIn(email, pw); toast('أهلاً 👋'); }
        else {
          const confirmNeeded = await S.signUp(email, pw);
          toast(confirmNeeded ? 'أرسلنا لك إيميل تأكيد، أكّده وارجع سجّل دخول' : 'تم إنشاء الحساب ✓');
        }
        setTimeout(settingsSheet, 300);
      } else if (act === 'signout') {
        if (await ask('تبي تطلع؟ البيانات تبقى محفوظة بالسحابة.')) { await S.signOut(); settingsSheet(); }
      } else if (act === 'disconnect') {
        S.clearConfig(); settingsSheet();
      } else if (act === 'sync') {
        await S.sync(); toast(S.status.error || 'تمت المزامنة ✓'); settingsSheet();
      } else if (act === 'rotate') {
        if (await ask('بعد التغيير لازم تحدّث الرمز في الاختصار. أكمل؟')) { S.rotateIngestToken(); settingsSheet(); toast('تغيّر الرمز'); }
      } else if (act === 'notify') {
        const p = await Notification.requestPermission();
        toast(p === 'granted' ? 'تم التفعيل ✓' : 'ما انسمح بالتنبيهات');
        settingsSheet();
      } else if (act === 'calendar') {
        calendarForm();
      } else if (act === 'paste') {
        pasteSmsForm();
      } else if (act === 'budget') {
        budgetForm();
      } else if (act === 'export') {
        await saveFile('hayati-backup-' + new Date().toISOString().slice(0, 10) + '.json', S.exportJSON(), 'application/json');
      }
    } catch (err) {
      toast(err.message || 'صار خطأ');
    } finally {
      b.disabled = false;
    }
  }

  // ---------- الأحداث ----------
  tabbar.onclick = (e) => {
    if (e.target.closest('#addBtn')) {
      if (ui.tab === 'money') ({ tx: () => txForm(), subs: () => subForm(), goals: () => goalForm(), debts: () => debtForm() })[ui.moneySeg]();
      else if (ui.tab === 'schedule') ({ schedule: () => courseForm(), focus: sessionForm, gpa: () => gradeForm() })[ui.studySeg]();
      else if (ui.tab === 'tasks' && X('tasksFab')) return;
      else ({ today: addChooser, tasks: () => taskForm() })[ui.tab]();
      return;
    }
    const b = e.target.closest('button.tab');
    if (b) go(b.dataset.tab);
  };
  document.getElementById('settingsBtn').onclick = settingsSheet;

  view.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    e.preventDefault();
    const id = el.dataset.id;
    switch (el.dataset.action) {
      case 'go': go(el.dataset.tab); break;
      case 'edit-tx': txForm(st.transactions.find((t) => t.id === id)); break;
      case 'add-tx': txForm(); break;
      case 'add-course': courseForm(null, el.dataset.type); break;
      case 'paste-sms': pasteSmsForm(); break;
      case 'budget': budgetForm(); break;
      case 'edit-course': courseForm(courseById(id)); break;
      case 'open-workout': { const c = courseById(id); if (c && c.workout) workoutSheet(c); else courseForm(c); break; }
      case 'edit-task': taskForm(st.tasks.find((t) => t.id === id)); break;
      case 'toggle-task': {
        e.stopPropagation();
        const t = st.tasks.find((x) => x.id === id);
        if (t) { S.upsert('tasks', Object.assign({}, t, { done: !t.done })); if (!t.done) toast('أحسنت 💪'); }
        break;
      }
      case 'calendar': calendarForm(); break;
      case 'month': {
        const [y, m] = ui.month.split('-').map(Number);
        const d = new Date(y, m - 1 + Number(el.dataset.d), 1);
        if (d <= new Date()) { ui.month = monthKey(d); render(); }
        break;
      }
      case 'day': ui.day = Number(el.dataset.d); render(); break;
      case 'task-filter': ui.taskFilter = el.dataset.k; render(); break;
      case 'show-done': ui.showDone = !ui.showDone; render(); break;
      case 'money-seg': ui.moneySeg = el.dataset.k; writePref('moneySeg', ui.moneySeg); render(); break;
      case 'study-seg': ui.studySeg = el.dataset.k; writePref('studySeg', ui.studySeg); render(); break;
      case 'report': reportSheet(); break;
      case 'import-seed': {
        const list = (ui.seed && ui.seed.courses) || [];
        let n = 0;
        for (const c of list) if (!st.courses.some((x) => x.id === c.id)) { S.upsert('courses', c); n++; }
        toast('انضاف ' + n + ' مواد لجدولك ✓');
        break;
      }
      case 'add-sub': subForm(); break;
      case 'edit-sub': subForm(st.subscriptions.find((x) => x.id === id)); break;
      case 'add-goal': goalForm(); break;
      case 'edit-goal': goalForm(st.goals.find((x) => x.id === id)); break;
      case 'goal-money': { e.stopPropagation(); goalMoneyForm(st.goals.find((x) => x.id === id), Number(el.dataset.sign)); break; }
      case 'add-debt': debtForm(); break;
      case 'edit-debt': debtForm(st.debts.find((x) => x.id === id)); break;
      case 'toggle-debt': {
        e.stopPropagation();
        const d = st.debts.find((x) => x.id === id);
        if (d) { S.upsert('debts', Object.assign({}, d, { settled: !d.settled })); if (!d.settled) toast('انسدّت ✓'); }
        break;
      }
      case 'show-settled': ui.showSettled = !ui.showSettled; render(); break;
      case 'add-grade': gradeForm(); break;
      case 'edit-grade': gradeForm(st.grades.find((x) => x.id === id)); break;
      case 'prior-gpa': priorGpaForm(); break;
      case 'focus-course': ui.focusCourse = el.dataset.id; writePref('focusCourse', ui.focusCourse); render(); break;
      case 'focus-len': S.setSettings({ focus_minutes: Number(el.dataset.k) }); break;
      case 'timer-start': timerStart(); render(); break;
      case 'timer-pause': timerPause(); render(); break;
      case 'timer-resume': timerResume(); render(); break;
      case 'timer-stop': timerStop(); render(); break;
      case 'add-session': sessionForm(); break;
      case 'noop': break;
      case 'open-course': if (window.Extras && window.Extras.courseSheet) window.Extras.courseSheet(courseById(id)); else courseForm(courseById(id)); break;
      case 'cat-budgets': X('catBudgetsForm'); break;
      default: X('action', el.dataset.action, el, e); break;
      case 'del-session': ask('تحذف هالجلسة؟').then((ok) => { if (ok) S.remove('study_sessions', id); }); break;
    }
  });

  // ---------- تنبيهات داخل التطبيق (لما يكون مفتوح) ----------
  const fired = new Set();
  async function notify(title, body) {
    toast(title + (body ? ' — ' + body : ''));
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      const reg = navigator.serviceWorker && (await navigator.serviceWorker.getRegistration());
      if (reg) reg.showNotification(title, { body, icon: 'icons/icon-192.png', lang: 'ar', dir: 'rtl' });
      else new Notification(title, { body });
    } catch (e) { /* تجاهل */ }
  }
  function tick() {
    const now = new Date();
    const nm = nowMinutes();
    const before = (() => { try { return JSON.parse(localStorage.getItem('hayati-cal') || '{}').before || 10; } catch (e) { return 10; } })();
    const dayKey = now.toDateString();
    for (const c of agendaOn(now)) {
      const ty = ACT_TYPES[c.type] || ACT_TYPES.lecture;
      const k1 = c.id + dayKey + 'pre', k2 = c.id + dayKey + 'now';
      if (nm === c.start - before && !fired.has(k1)) { fired.add(k1); notify('باقي ' + before + ' دقايق', ty.label + ': ' + c.name + (c.room ? ' — ' + c.room : '')); }
      if (nm === c.start && !fired.has(k2)) { fired.add(k2); notify(ty.now + (c.type === 'gym' ? '' : ': ' + c.name), c.type === 'gym' ? c.name : c.room ? '📍 ' + c.room : ''); }
    }
    postSubscriptions();
    X('tick');
    const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((ui.tab === 'today' || ui.tab === 'schedule') && !sheet.open && !typing) render();
  }
  setInterval(tick, 30000);

  // ---------- البداية ----------
  S.subscribe(() => { if (!sheet.open) render(); });
  sheet.addEventListener('close', render);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // واجهة للإضافات
  window.App = {
    S, st, I, ui, h, fmt, money, tint, catMeta, catIcon, pad, monthKey, sameDay, startOfDay, daysBetween, time12, timeOf, minutesOf,
    nowMinutes, toLocalInput, dayLabel, nDays, toast, ask, courseById, lectures, lecturesOn, agendaOn, empty, secHead, ring, openSheet,
    closeSheet, val, parseAmount, segPick, render, go, txInMonth, sums, mmss, hhmm, gpaOf, cumulative, semesterOrder, courseForm, taskForm,
    notify, has, DAYS, DAYS_SHORT, MONTHS, EXPENSE_CATS, COLORS, GRADE_POINTS, TASK_KINDS, ACT_TYPES, saveFile,
  };
  setInterval(timerTickUI, 1000);
  timerCheck();
  postSubscriptions();
  render();
  S.init().then(async () => {
    postSubscriptions();
    render();
    ui.seed = await S.getSeed();
    if (ui.seed) render();
  });
})();

</script>
  <script>/* extras.js */
// حياتي — الإضافات: الصلاة، العادات، الماء والنوم، ملخص الصباح، تنبيه الميزانية، ميزانية التصنيفات،
// التوفير من الدخل، صورة الفاتورة، الغياب والملاحظات، «كم أحتاج»، خطة المراجعة، أوزان الجيم، مؤقت الراحة،
// وزن الجسم، والوضع الغامق اليدوي.
(function () {
  'use strict';
  const A = window.App;
  if (!A) return;
  const { S, st, I, h, fmt, money, tint, pad } = A;
  const set = () => st.settings;

  function dateKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* تجاهل */ } }

  // ================= الوضع الغامق اليدوي (لكل جهاز) =================
  function applyTheme() {
    const t = lsGet('hayati-theme', 'auto');
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }
  applyTheme();

  // ================= أوقات الصلاة (حساب فلكي محلي — المنامة) =================
  const LAT = 26.2235, LNG = 50.5876, TZ = 3;
  const METHODS = {
    gulf: { label: 'أم القرى / الخليج', fajr: 18.5, isha: { min: 90 }, maghrib: 0 },
    jafari: { label: 'جعفري (3 أوقات)', fajr: 16, isha: { deg: 14 }, maghrib: 4 },
  };
  const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
  const fixH = (x) => ((x % 24) + 24) % 24;
  function sun(jd) {
    const D = jd - 2451545.0;
    const g = rad((357.529 + 0.98560028 * D) % 360), q = (280.459 + 0.98564736 * D) % 360;
    const L = rad((q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360), e = rad(23.439 - 0.00000036 * D);
    const RA = fixH(deg(Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L))) / 15);
    return { decl: Math.asin(Math.sin(e) * Math.sin(L)), eqt: q / 15 - RA };
  }
  function julian(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    const A0 = Math.floor(y / 100), B = 2 - A0 + Math.floor(A0 / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function prayerTimes(date, methodKey) {
    const M = METHODS[methodKey] || METHODS.gulf;
    const jd = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) - LNG / (15 * 24);
    const lat = rad(LAT);
    const noonAt = (t) => fixH(12 - sun(jd + t / 24).eqt);
    const angleTime = (angle, t, ccw) => {
      const { decl } = sun(jd + t / 24);
      const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(decl) * Math.sin(lat)) / (Math.cos(decl) * Math.cos(lat)))) / 15;
      return noonAt(t) + (ccw ? -T : T);
    };
    const asrTime = (t) => {
      const { decl } = sun(jd + t / 24);
      const angle = -deg(Math.atan(1 / (1 + Math.tan(Math.abs(lat - decl)))));
      return angleTime(angle, t, false);
    };
    const local = (x) => x + TZ - LNG / 15;
    const dhuhr = local(noonAt(12)) + 1 / 60;
    const fajr = local(angleTime(M.fajr, 5, true));
    const sunrise = local(angleTime(0.833, 6, true));
    const asr = local(asrTime(13));
    const sunset = local(angleTime(0.833, 18, false));
    const maghrib = M.maghrib ? local(angleTime(M.maghrib, 18, false)) : sunset;
    const isha = M.isha.min ? maghrib + M.isha.min / 60 : local(angleTime(M.isha.deg, 18, false));
    const toMin = (x) => Math.round(x * 60);
    return { fajr: toMin(fajr), sunrise: toMin(sunrise), dhuhr: toMin(dhuhr), asr: toMin(asr), maghrib: toMin(maghrib), isha: toMin(isha) };
  }
  const PRAYER_NAMES = [['fajr', 'الفجر'], ['dhuhr', 'الظهر'], ['asr', 'العصر'], ['maghrib', 'المغرب'], ['isha', 'العشاء']];

  function todayDoc() { const k = dateKey(); return st.daily.find((d) => d.date === k) || null; }

    const k = dateKey();

  function habitStreak(hid) {

    for (let i = 0; i < 366; i++) {

      const doc = st.daily.find((x) => x.date === dateKey(d));
      if (doc && doc.habits && doc.habits[hid]) n++;
      else if (i > 0) break;
    }
    return n;
  }

  // ================= الميزانية: المسموح باليوم + التنبيه =================
  function dailyAllowance() {
    const budget = Number(set().budget) || 0;
    if (!budget) return null;
    const now = new Date();
    const exp = A.sums(A.txInMonth(A.monthKey(now))).exp;
    const daysLeft = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1;
    return (budget - exp) / daysLeft;
  }
  function budgetBanner() {
    const budget = Number(set().budget) || 0;
    if (!budget) return '';
    const exp = A.sums(A.txInMonth(A.monthKey(new Date()))).exp;
    const pct = exp / budget;
    if (pct < 0.8) return '';
    const over = pct >= 1;
    return '<div class="card alert-card ' + (over ? 'over' : '') + '"><div class="ico" style="' + tint(over ? '#e11d48' : '#f59e0b') + '">' + I('alert') + '</div><div style="flex:1">' +
      '<b>' + (over ? 'تعدّيت ميزانية الشهر' : 'قربت من ميزانية الشهر') + '</b><div class="small muted">صرفت ' + Math.round(pct * 100) + '% (' + fmt(exp) + ' من ' + fmt(budget) + ')' +
      (over ? '' : ' · باقي لك ' + fmt(dailyAllowance()) + ' باليوم') + '</div></div></div>';
  }
  let lastAlertCheck = '';
  function checkBudgetAlert() {
    const budget = Number(set().budget) || 0;
    if (!budget) return;
    const mk = A.monthKey(new Date());
    const exp = A.sums(A.txInMonth(mk)).exp;
    const level = exp >= budget ? 100 : exp >= 0.8 * budget ? 80 : 0;
    const sig = mk + ':' + level;
    if (!level || sig === lastAlertCheck) return;
    lastAlertCheck = sig;
    const seen = lsGet('hayati-budget-alert', {});
    if (seen[mk] >= level) return;
    seen[mk] = level; lsSet('hayati-budget-alert', seen);
    A.notify(level === 100 ? '⚠️ تعدّيت ميزانية الشهر' : '⚠️ صرفت 80% من ميزانيتك', 'صرفت ' + fmt(exp) + ' من ' + fmt(budget) + ' د.ب');
  }

  // ================= صورة الفاتورة =================
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  // ================= «كم أحتاج» =================
  function gpaNeed() {
    const lec = A.lectures();
    if (!lec.length) return '';
    const target = lsGet('hayati-gpa-target', 3.5);
    const cum = A.cumulative();
    const semCr = lec.reduce((s, c) => s + (Number(c.credits) || 3), 0);
    const doneCr = cum.credits || 0, donePts = (cum.gpa || 0) * doneCr;
    const need = (target * (doneCr + semCr) - donePts) / semCr;
    let msg, cls = '';
    if (need > 4) { msg = 'صعب توصل ' + target.toFixed(2) + ' هالفصل (تحتاج أكثر من 4.00). جرّب هدف أقرب.'; cls = 'neg'; }
    else if (need <= 0) msg = 'هدفك مضمون حتى لو بأقل الدرجات 😄';
    else {
      const letter = Object.entries(A.GRADE_POINTS).filter(([, p]) => p >= need).sort((a, b) => a[1] - b[1])[0];
      msg = 'تحتاج معدل فصلي <b class="num">' + need.toFixed(2) + '</b> بالـ' + lec.length + ' مواد (' + semCr + ' ساعة) — يعني تقريباً <b>' + (letter ? letter[0] : 'A') + '</b> بكل مادة.';
    }
    return '<div class="card need-card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div class="ico" style="' + tint('#8b5cf6') + '">' + I('target') + '</div><b style="flex:1">كم أحتاج؟</b>' +
      '<div class="stepper"><button data-action="gpa-target" data-d="-0.05">−</button><b class="num">' + target.toFixed(2) + '</b><button data-action="gpa-target" data-d="0.05">+</button></div></div>' +
      '<div class="small ' + cls + '">هدفك التراكمي ' + target.toFixed(2) + ': ' + msg + '</div></div>';
  }

      saveLabel: 'سوّ الخطة',

        '<div class="field"><label>كم يوم مراجعة؟</label><div class="seg" id="dSeg">' + [2, 3, 5, 7].filter((d) => d <= Math.max(2, days)).map((d) => '<button type="button" data-k="' + d + '" class="' + (d === Math.min(n0, 7) || (d === 2 && n0 < 2) ? 'on' : '') + '">' + A.nDays(d) + '</button>').join('') + '</div></div>' +
        '<div class="two"><div class="field"><label>الوقت</label><input type="time" name="time" value="20:00"></div><div class="field"><label>المدة</label><select name="dur"><option value="45">45 دقيقة</option><option value="60" selected>ساعة</option><option value="90">ساعة ونص</option></select></div></div>',
      mount(root) { root.dataset.d = Math.min(n0, 7) < 2 ? 2 : [2, 3, 5, 7].filter((d) => d <= Math.max(2, days)).reduce((a, d) => (d <= n0 ? d : a), 2); A.segPick(root, '#dSeg', (k) => { root.dataset.d = k; }); },
      onSave(root) {
        const n = Number(root.dataset.d), [hh, mm] = (A.val(root, 'time') || '20:00').split(':').map(Number);
        const examDay = new Date(exam.due_at);
        let made = 0;
        for (let i = n; i >= 1; i--) {
          const d = new Date(examDay); d.setDate(d.getDate() - i); d.setHours(hh, mm, 0, 0);
          if (d < new Date()) continue;
          made++;
          S.upsert('tasks', { title: 'مراجعة ' + exam.title + ' (' + (n - i + 1) + '/' + n + ')', kind: 'study', due_at: d.toISOString(), course_id: exam.course_id || null, notes: 'مدة ' + A.val(root, 'dur') + ' دقيقة', done: false });
        }
        A.toast(made ? 'انضافت ' + made + ' جلسات مراجعة 📚' : 'ما فيه أيام كافية قبل الاختبار');
      },
    });
  }

  // ================= أوزان الجيم + مؤقت الراحة =================
  function liftId(courseId, i, k) { return S.stableId('lift:' + courseId + ':' + i + ':' + k); }
  function lastLift(name, beforeKey) {
    return st.lifts.filter((l) => l.exercise === name && l.date < beforeKey).sort((a, b) => (a.date < b.date ? 1 : -1))[0] || null;
  }
  function exExtra(c, x, i) {
    const k = dateKey();
    const cur = st.lifts.find((l) => l.id === liftId(c.id, i, k));
    const prev = lastLift(x.name, k);
    const best = st.lifts.filter((l) => l.exercise === x.name).reduce((m, l) => Math.max(m, ...(l.sets || []).map((s) => Number(s.weight) || 0)), 0);
    return '<div class="lift-row">' + x.sets.map((r, j) => {
      const w = cur && cur.sets && cur.sets[j] ? cur.sets[j].weight : '';
      const pw = prev && prev.sets && prev.sets[j] ? prev.sets[j].weight : '';
      return '<label class="lift"><small>' + (j + 1) + '</small><input inputmode="decimal" data-lift="' + i + '" data-set="' + j + '" value="' + (w || '') + '" placeholder="' + (pw || 'كغ') + '"></label>';
    }).join('') + '</div>' +
      '<div class="lift-meta">' + (prev ? '<span>آخر مرة ' + h(prev.date.slice(5)) + '</span>' : '<span>اكتب الوزن (كغ) لكل جولة</span>') + (best ? '<span>🏆 أعلى وزن ' + best + ' كغ</span>' : '') +
      (x.rest ? '<button class="rest-btn" data-rest="' + x.rest + '" data-name="' + h(x.name) + '">' + I('timer') + 'ابدأ الراحة</button>' : '') + '</div>';
  }
  let restTimer = null;
  function wkMount(root, c) {
    root.onchange = (e) => {
      const el = e.target.closest('[data-lift]');
      if (!el) return;
      const i = Number(el.dataset.lift), x = c.workout.exercises[i], k = dateKey();
      const id = liftId(c.id, i, k);
      const cur = st.lifts.find((l) => l.id === id);
      const sets = x.sets.map((r, j) => ({ reps: r, weight: cur && cur.sets && cur.sets[j] ? cur.sets[j].weight : null }));
      const v = A.parseAmount(el.value);
      sets[Number(el.dataset.set)].weight = v > 0 ? v : null;
      S.upsert('lifts', { id, course_id: c.id, exercise: x.name, date: k, sets });
    };
  }
  function wkClick(e, c, root) {
    if (e.target.closest('input, label.lift')) return true;
    const b = e.target.closest('.rest-btn');
    if (!b) return false;
    startRest(Number(b.dataset.rest), b.dataset.name, root);
    return true;
  }
  function startRest(sec, name, root) {
    clearInterval(restTimer);
    let bar = root.querySelector('.rest-bar');
    if (!bar) { bar = document.createElement('div'); bar.className = 'rest-bar'; root.prepend(bar); }
    const end = Date.now() + sec * 1000;
    const tick = () => {
      const left = Math.max(0, end - Date.now());
      if (!document.body.contains(bar)) { clearInterval(restTimer); return; }
      bar.innerHTML = '<span>⏱ راحة · ' + h(name) + '</span><b class="num">' + A.mmss(left) + '</b><button aria-label="إيقاف">✕</button><i style="width:' + (100 - (left / (sec * 1000)) * 100) + '%"></i>';
      bar.querySelector('button').onclick = (ev) => { ev.stopPropagation(); clearInterval(restTimer); bar.remove(); };
      if (left <= 0) {
        clearInterval(restTimer);
        bar.classList.add('done'); bar.querySelector('span').textContent = '💪 خلصت الراحة — الجولة الجاية!';
        try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (err) { /* تجاهل */ }
        setTimeout(() => bar.remove(), 4000);
      }
    };
    tick();
    restTimer = setInterval(tick, 250);
  }

  // ================= صحتي: وزن الجسم، تطوّر الأوزان، الماء والنوم =================
  function lineChart(points, unit) {
    if (points.length < 2) return '<div class="empty"><p>تحتاج قراءتين على الأقل عشان يطلع الرسم</p></div>';
    const W = 320, H = 140, P = 26;
    const ys = points.map((p) => p.v), min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
    const x = (i) => P + (i / (points.length - 1)) * (W - 2 * P), y = (v) => H - P - ((v - min) / span) * (H - 2 * P);
    const d = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
    const area = d + ' L' + x(points.length - 1).toFixed(1) + ' ' + (H - P) + ' L' + x(0).toFixed(1) + ' ' + (H - P) + ' Z';
    const last = points[points.length - 1];
    return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="رسم بياني">' +
      '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" stroke="var(--border)"/>' +
      '<path d="' + area + '" fill="var(--brand)" opacity=".12"/><path d="' + d + '" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      points.map((p, i) => '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="' + (i === points.length - 1 ? 4.5 : 2.5) + '" fill="var(--brand)"/>').join('') +
      '<text x="' + x(points.length - 1) + '" y="' + (y(last.v) - 10) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">' + last.v + ' ' + unit + '</text>' +
      '<text x="' + P + '" y="' + (H - 8) + '" font-size="10" fill="var(--muted)">' + h(points[0].l) + '</text>' +
      '<text x="' + (W - P) + '" y="' + (H - 8) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + h(last.l) + '</text></svg>';
  }
  function viewHealth() {
    let out = '';
    // وزن الجسم
    const body = st.body.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const lastB = body[body.length - 1], firstB = body[0];
    out += A.secHead('وزن الجسم', '<button class="link" data-action="add-body">تسجيل</button>');
    out += '<div class="card">' + (body.length ? '<div class="body-top"><div><small class="muted">آخر وزن</small><b class="num">' + lastB.weight + ' كغ</b></div>' +
      (body.length > 1 ? '<div><small class="muted">من البداية</small><b class="num ' + (lastB.weight >= firstB.weight ? 'pos' : 'neg') + '">' + (lastB.weight >= firstB.weight ? '+' : '') + (lastB.weight - firstB.weight).toFixed(1) + ' كغ</b></div>' : '') +
      (lastB.waist ? '<div><small class="muted">الخصر</small><b class="num">' + lastB.waist + ' سم</b></div>' : '') + '</div>' +
      lineChart(body.slice(-12).map((b) => ({ v: Number(b.weight), l: b.date.slice(5) })), 'كغ') :
      A.empty('heart', 'سجّل وزنك', 'برنامجك هدفه زيادة الوزن والعضل — سجّل وزنك كل أسبوع وتابع تطوّرك')) + '</div>';

    // تطوّر الأوزان بالجيم
    const names = [...new Set(st.lifts.map((l) => l.exercise))];
    out += A.secHead('تطوّر الأوزان بالجيم');
    if (!names.length) out += '<div class="card">' + A.empty('dumbbell', 'ما فيه أوزان مسجلة', 'افتح تمرين اليوم واكتب الوزن تحت كل جولة') + '</div>';
    else {
      const sel = A.ui.liftEx && names.includes(A.ui.liftEx) ? A.ui.liftEx : names[0];
      const pts = st.lifts.filter((l) => l.exercise === sel).sort((a, b) => (a.date < b.date ? -1 : 1))
        .map((l) => ({ v: Math.max(0, ...(l.sets || []).map((s) => Number(s.weight) || 0)), l: l.date.slice(5) })).filter((p) => p.v > 0);
      out += '<div class="card"><div class="chips" style="flex-wrap:nowrap;overflow-x:auto;margin-bottom:10px">' + names.map((n) => '<button class="chip' + (n === sel ? ' on' : '') + '" data-action="lift-ex" data-n="' + h(n) + '" style="direction:ltr">' + h(n) + '</button>').join('') + '</div>' +
        lineChart(pts.slice(-12), 'كغ') + '</div>';
    }

    // الماء والنوم آخر 7 أيام
    const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
    const goalW = Number(set().water_goal) || 8, goalS = Number(set().sleep_goal) || 8;
    const row = (label, get, goal, color) => '<div class="mini-chart"><b>' + label + '</b><div class="mini-bars">' + days.map((d) => {
      const doc = st.daily.find((x) => x.date === dateKey(d)); const v = doc ? Number(get(doc)) || 0 : 0;
      return '<div><i style="height:' + Math.min(100, (v / goal) * 100) + '%;background:' + color + '"></i><small>' + A.DAYS_SHORT[d.getDay()] + '</small></div>';
    }).join('') + '</div></div>';
    out += A.secHead('الماء والنوم · آخر 7 أيام') + '<div class="card">' + row('💧 الماء', (d) => d.water, goalW, '#0ea5e9') + row('😴 النوم', (d) => d.sleep, goalS, '#8b5cf6') + '</div>';

    // العادات
    out += A.secHead('عاداتك اليومية', '<button class="link" data-action="habits-manage">تعديل</button>');
    const habits = st.habits.filter((x) => x.active !== false);
    out += '<div class="card flush">' + (habits.length ? '<ul class="list">' + habits.map((x) => '<li class="row" style="cursor:default"><div class="ico" style="' + tint('#f59e0b') + ';font-size:20px">' + h(x.emoji || '✅') + '</div><div class="main"><div class="title"><span class="t">' + h(x.name) + '</span></div><div class="sub">🔥 ' + habitStreak(x.id) + ' أيام متتالية</div></div></li>').join('') + '</ul>' :
      A.empty('sparkle', 'ما فيه عادات', 'أضف عادة مثل ورد القرآن أو القراءة')) + '</div>';
    return out;
  }
  function bodyForm() {
    const last = st.body.slice().sort((a, b) => (a.date < b.date ? 1 : -1))[0];
    A.openSheet({
      title: 'تسجيل الوزن',
      body: '<div class="amount-box"><input name="weight" inputmode="decimal" placeholder="' + (last ? last.weight : '70.0') + '"><small>كيلوغرام</small></div>' +
        '<div class="two"><div class="field"><label>الخصر (سم، اختياري)</label><input name="waist" inputmode="decimal" value=""></div><div class="field"><label>التاريخ</label><input type="date" name="date" value="' + dateKey() + '"></div></div>',
      onSave(root) {
        const w = A.parseAmount(A.val(root, 'weight'));
        if (!(w > 20 && w < 400)) throw new Error('اكتب وزن صحيح');
        const d = A.val(root, 'date') || dateKey(), waist = A.parseAmount(A.val(root, 'waist'));
        S.upsert('body', { id: S.stableId('body:' + d), date: d, weight: Math.round(w * 10) / 10, waist: waist > 0 ? waist : null });
        A.toast('انسجل ✓');
      },
    });
  }
  function habitsForm() {
    const PRESETS = [['ورد القرآن', '📖'], ['قراءة كتاب', '📚'], ['أذكار الصباح', '🌅'], ['أذكار المساء', '🌙'], ['رياضة/مشي', '🚶'], ['بدون سكر', '🍬']];
    const draw = () => '<div class="chips" style="margin-bottom:14px">' + PRESETS.filter(([n]) => !st.habits.some((x) => x.name === n && x.active !== false)).map(([n, e]) => '<button type="button" class="chip" data-add="' + h(n) + '" data-e="' + e + '">' + e + ' ' + n + '</button>').join('') + '</div>' +
      '<div class="two"><div class="field"><label>عادة جديدة</label><input name="hname" placeholder="مثلاً: شرب فيتامين"></div><div class="field"><label>رمز</label><input name="hemoji" placeholder="✅" maxlength="4"></div></div>' +
      '<button type="button" class="btn primary block" data-addcustom>' + I('plus') + 'أضف</button>' +
      '<div class="card flush" style="margin-top:14px"><ul class="list">' + st.habits.filter((x) => x.active !== false).map((x) => '<li class="row" style="cursor:default"><span style="font-size:22px">' + h(x.emoji || '✅') + '</span><div class="main"><div class="title"><span class="t">' + h(x.name) + '</span></div></div><button class="btn danger" data-del="' + x.id + '" style="padding:6px 12px">حذف</button></li>').join('') + '</ul></div>';
    A.openSheet({
      title: 'العادات اليومية', cancelLabel: 'تم', body: draw(),
      mount(root) {
        root.onclick = (e) => {
          const add = e.target.closest('[data-add]'), del = e.target.closest('[data-del]');
          if (add) S.upsert('habits', { name: add.dataset.add, emoji: add.dataset.e, active: true });
          else if (e.target.closest('[data-addcustom]')) { const n = A.val(root, 'hname'); if (!n) return A.toast('اكتب اسم العادة'); S.upsert('habits', { name: n, emoji: A.val(root, 'hemoji') || '✅', active: true }); }
          else if (del) { const x = st.habits.find((y) => y.id === del.dataset.del); if (x) S.upsert('habits', Object.assign({}, x, { active: false })); }
          else return;
          root.innerHTML = draw();
        };
      },
    });
  }

  // ================= الإعدادات =================
  function settingsExtra() {
    const theme = lsGet('hayati-theme', 'auto'), pm = prayerMethod(), pOn = set().prayer_on !== false;
    const t = prayerTimes(new Date(), pm);
    return '<div class="group-title">' + I('moon') + 'المظهر</div><div class="card"><div class="seg" style="margin:0">' +
      [['auto', 'تلقائي'], ['light', 'فاتح'], ['dark', 'غامق']].map(([k, l]) => '<button type="button" data-set="theme" data-k="' + k + '" class="' + (theme === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
      '<div class="group-title">' + I('moon') + 'أوقات الصلاة</div><div class="card">' +
      '<label class="switch" style="margin-bottom:12px"><input type="checkbox" data-set="prayer-on"' + (pOn ? ' checked' : '') + '> أظهر الصلاة بجدول اليوم مع «الحين وقت صلاة…»</label>' +
      '<div class="seg" style="margin-bottom:10px">' + Object.entries(METHODS).map(([k, m]) => '<button type="button" data-set="prayer-method" data-k="' + k + '" class="' + (pm === k ? 'on' : '') + '">' + m.label + '</button>').join('') + '</div>' +
      '<div class="prayer-grid" style="grid-template-columns:repeat(' + prayerNames(pm).length + ',1fr)">' + prayerNames(pm).map(([k, n]) => '<div><small>' + n + '</small><b class="num">' + A.time12(A.hhmm(t[k])) + '</b></div>').join('') + '</div>' +
      '<p class="small muted" style="margin:8px 0 0">محسوبة لتوقيت المنامة. ممكن تفرق دقيقة أو دقيقتين عن تقويم الأوقاف.</p></div>' +
      '<div class="group-title">' + I('heart') + 'أهداف يومية</div><div class="card"><div class="two">' +
      '<div class="field" style="margin:0"><label>أكواب الماء</label><input type="number" min="1" max="20" data-goal="water_goal" value="' + (set().water_goal || 8) + '"></div>' +
      '<div class="field" style="margin:0"><label>ساعات النوم</label><input type="number" min="4" max="12" step="0.5" data-goal="sleep_goal" value="' + (set().sleep_goal || 8) + '"></div></div></div>';

  async function settingsAction(act, root, b) {
    if (act === 'theme') { lsSet('hayati-theme', b.dataset.k); applyTheme(); root.querySelectorAll('[data-set=theme]').forEach((x) => x.classList.toggle('on', x === b)); return true; }
    if (act === 'prayer-method') { S.setSettings({ prayer_method: b.dataset.k }); A.closeSheet(); A.toast('تم تغيير طريقة الحساب ✓'); return true; }

  document.addEventListener('change', (e) => {
    const p = e.target.closest('[data-set="prayer-on"]');
    if (p) { S.setSettings({ prayer_on: p.checked }); return; }
    const g = e.target.closest('[data-goal]');
    if (g) { const v = Number(g.value); if (v > 0) S.setSettings({ [g.dataset.goal]: v }); }

  // ================= الأحداث =================
  function action(name, el) {
    if (name === 'water') { const doc = todayDoc(); const n = Number(el.dataset.n); saveToday({ water: doc && doc.water === n ? n - 1 : n }); }
    else if (name === 'sleep') { const doc = todayDoc(); const cur = doc && doc.sleep != null ? doc.sleep : 7; saveToday({ sleep: Math.max(0, Math.min(14, cur + Number(el.dataset.d))) }); }
    else if (name === 'habit') { const doc = todayDoc(); const hb = Object.assign({}, doc ? doc.habits : {}); hb[el.dataset.id] = !hb[el.dataset.id]; saveToday({ habits: hb }); if (hb[el.dataset.id]) A.toast('عاش 🔥'); }
    else if (name === 'habits-manage') habitsForm();
    else if (name === 'go-health') { A.ui.studySeg = 'health'; try { localStorage.setItem('hayati-ui-studySeg', 'health'); } catch (e) { /* تجاهل */ } A.go('schedule'); }
    else if (name === 'morning-close') { lsSet('hayati-morning', dateKey()); A.render(); }
    else if (name === 'save-income') saveIncomeSheet(st.transactions.find((t) => t.id === el.dataset.id));
    else if (name === 'skip-income') { const t = st.transactions.find((x) => x.id === el.dataset.id); if (t) S.upsert('transactions', Object.assign({}, t, { save_handled: true })); }
    else if (name === 'gpa-target') { lsSet('hayati-gpa-target', Math.max(1, Math.min(4, Math.round((lsGet('hayati-gpa-target', 3.5) + Number(el.dataset.d)) * 100) / 100))); A.render(); }
    else if (name === 'add-body') bodyForm();
    else if (name === 'lift-ex') { A.ui.liftEx = el.dataset.n; A.render(); }
  }

  window.Extras = {
    agenda: (date) => prayersOn(date),
    todayTop: () => morningCard() + budgetBanner() + incomeCard(),
    todayMid: () => dailyCard(),
    allowance: () => { const a = dailyAllowance(); return a != null && a > 0 ? '<div class="meta" style="margin-top:4px"><span>💸 تقدر تصرف ' + fmt(a) + ' باليوم لين آخر الشهر</span></div>' : ''; },
    catBudget, catBudgetsForm, courseSheet, gpaNeed, viewHealth, exExtra, wkMount, wkClick, settingsExtra, settingsAction, action,
    afterTx: (tx) => { if (tx && tx.kind === 'income' && !tx.save_handled && st.goals.some((g) => !g.done)) saveIncomeSheet(tx); },
    txExtra: (tx) => '<div class="field"><label>صورة الفاتورة (اختياري)</label><div class="receipt" id="receiptBox">' +
      (tx && tx.receipt ? '<img src="' + tx.receipt + '" alt="الفاتورة"><button type="button" class="btn danger" data-rm-receipt>حذف الصورة</button>' : '') +
      '<label class="btn ghost block" style="cursor:pointer">' + I('upload') + (tx && tx.receipt ? 'تغيير الصورة' : 'أضف صورة') + '<input type="file" accept="image/*" id="receiptInput" hidden></label></div></div>',
    txMount: (root) => {
      delete root.dataset.receipt;
      const inp = root.querySelector('#receiptInput');
      if (inp) inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;

        catch (e) { A.toast('ما قدرت أقرا الصورة'); }
      };
      const rm = root.querySelector('[data-rm-receipt]');
      if (rm) rm.onclick = () => { root.dataset.receipt = 'none'; rm.previousElementSibling && rm.previousElementSibling.remove(); rm.remove(); };

    taskMount: (root, t) => {
      if (!t || t.kind !== 'exam' || t.done) return;

      b.type = 'button'; b.className = 'btn primary block'; b.style.marginBottom = '10px';
      b.innerHTML = I('book') + 'سوّ لي خطة مراجعة';
      b.onclick = () => studyPlan(t);
      root.insertBefore(b, root.querySelector('#delTask'));
    },
    tick: () => checkBudgetAlert(),
    prayerTimes,

  // حفظ صورة الفاتورة مع العملية: نلتقط زر الحفظ قبل ما يحفظ النموذج
  document.getElementById('sheetSave').addEventListener('click', () => {
    const root = document.getElementById('sheetBody');
    if (!root.dataset.receipt) return;

      // الحفظ فشل (مثلاً المبلغ ناقص) والنافذة لسا مفتوحة: نرجّع الصورة للمحاولة الجاية

      const t = st.transactions.slice().sort((a, b) => (a.updated_at < b.updated_at ? 1 : -1))[0];

  // إلغاء النافذة يمسح أي صورة ما انحفظت
  document.getElementById('sheet').addEventListener('close', () => {

  <script>/* extras2.js */
// حياتي — إضافات 2: تقسيم الفاتورة، تحديات التوفير، ملخص السنة، الدرجات الجزئية، بطاقات المراجعة،
// الاختبارات الجاية، وضع التركيز، تمارين بديلة، المساعد الذكي، المناسبات، المشتريات، اليوميات والمزاج.
(function () {

  const wrap = (name, fn) => { const prev = E[name]; E[name] = (...a) => fn(prev ? prev : () => '', ...a); };

  wrap('txExtra', (prev, tx) => prev(tx) + (tx && tx.kind === 'expense' ? '<button type="button" class="btn ghost block" data-split style="margin-bottom:12px">' + I('users') + 'قسّم الفاتورة مع ربعك</button>' : ''));
  wrap('txMount', (prev, root, tx) => {

  function splitSheet(tx) {

        '<div class="field"><label>أسماء الربع (افصل بفاصلة)</label><input name="names" placeholder="أحمد، علي، حسين"></div>' +

  // ================= تحديات التوفير =================
  const CH = { '52w': { name: 'تحدي 52 أسبوع', emoji: '🗓️' }, nofood: { name: 'أسبوع بدون مطاعم', emoji: '🍔' } };
  const challenges = () => (Array.isArray(st.settings.challenges) ? st.settings.challenges : []);

  function goalsTop() {

    return out + list.map((c) => {

          '<div class="wk-grid">' + Array.from({ length: 52 }, (_, i) => '<i class="' + (done.includes(i + 1) ? 'on' : i + 1 === week ? 'now' : '') + '"></i>').join('') + '</div>' +
          (done.includes(week) ? '<div class="small" style="color:var(--income)">✓ وفّرت هالأسبوع</div>' : '<button class="btn primary block" data-action="ch-week" data-id="' + c.id + '" data-w="' + week + '">وفّرت ' + fmt(week * step) + ' هالأسبوع</button>') + '</div>';
      }
      const broke = st.transactions.filter((t) => t.kind === 'expense' && t.category === 'أكل ومطاعم' && new Date(t.occurred_at) >= parseDate(c.start)).sort((a, b) => new Date(a.occurred_at) - new Date(b.occurred_at))[0];
      const streak = broke ? A.daysBetween(parseDate(c.start), new Date(broke.occurred_at)) : Math.min(7, days + 1);
      const win = !broke && days >= 6;
      return '<div class="card ch"><div class="ch-head"><span>' + CH.nofood.emoji + '</span><b>' + CH.nofood.name + '</b><button class="icon-x" data-action="ch-del" data-id="' + c.id + '">✕</button></div>' +
        '<div class="day-dots">' + Array.from({ length: 7 }, (_, i) => '<i class="' + (i < streak ? 'on' : '') + (broke && i === streak ? ' bad' : '') + '">' + (i + 1) + '</i>').join('') + '</div>' +
        '<div class="small ' + (broke ? 'neg' : win ? 'pos' : 'muted') + '">' + (broke ? 'انكسر يوم ' + (streak + 1) + ' (' + h(broke.merchant || 'مطعم') + ')' : win ? '🏅 أحسنت! كمّلت الأسبوع' : 'يوم ' + (days + 1) + ' من 7 — كمّل!') + '</div>' +
        (broke || win ? '<button class="btn ghost block" style="margin-top:8px" data-action="ch-restart" data-id="' + c.id + '">ابدأ من جديد</button>' : '') + '</div>';

  function chAddSheet() {

  // ================= ملخص السنة =================
  function yearSheet() {
    const y = new Date().getFullYear();
    const tx = st.transactions.filter((t) => new Date(t.occurred_at).getFullYear() === y);
    const months = Array.from({ length: 12 }, (_, m) => A.sums(tx.filter((t) => new Date(t.occurred_at).getMonth() === m)));
    const exp = months.reduce((s, x) => s + x.exp, 0), inc = months.reduce((s, x) => s + x.inc, 0);
    const active = months.map((x, m) => ({ m, v: x.exp })).filter((x) => x.v > 0);
    const max = Math.max(1, ...months.map((x) => x.exp));
    const byCat = {}, byMer = {};
    for (const t of tx) if (t.kind === 'expense') { byCat[t.category || 'أخرى'] = (byCat[t.category || 'أخرى'] || 0) + Number(t.amount); const k = t.merchant || t.category; byMer[k] = (byMer[k] || 0) + Number(t.amount); }
    const topCat = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0], topMer = Object.entries(byMer).sort((a, b) => b[1] - a[1])[0];
    const hi = active.slice().sort((a, b) => b.v - a.v)[0], lo = active.slice().sort((a, b) => a.v - b.v)[0];

        '<div class="card"><div class="chart" style="height:150px">' + months.map((x, m) => '<div class="col' + (m === new Date().getMonth() ? ' today' : '') + '"><span class="v num">' + (x.exp ? Math.round(x.exp) : '') + '</span><div class="bar" style="height:' + Math.max(3, (x.exp / max) * 100) + 'px"></div><span class="lbl">' + A.MONTHS[m].slice(0, 3) + '</span></div>').join('') + '</div></div>' +
        '<div class="card"><ul class="list">' +
        (topCat ? '<li class="row" style="cursor:default"><div class="main">أكثر تصنيف<div class="sub">' + h(topCat[0]) + '</div></div><b>' + money(topCat[1]) + '</b></li>' : '') +
        (topMer ? '<li class="row" style="cursor:default"><div class="main">أكثر مكان<div class="sub">' + h(topMer[0]) + '</div></div><b>' + money(topMer[1]) + '</b></li>' : '') +
        (hi ? '<li class="row" style="cursor:default"><div class="main">أغلى شهر<div class="sub">' + A.MONTHS[hi.m] + '</div></div><b class="neg">' + money(hi.v) + '</b></li>' : '') +
        (lo && active.length > 1 ? '<li class="row" style="cursor:default"><div class="main">أوفر شهر<div class="sub">' + A.MONTHS[lo.m] + '</div></div><b class="pos">' + money(lo.v) + '</b></li>' : '') +
        '</ul></div>',
    });
  }

  // ================= الدرجات الجزئية بصفحة المادة =================
  function courseExtra(cc) {
    const rows = Array.isArray(cc.assessments) ? cc.assessments : [];
    const target = Number(cc.grade_target) || 90;
    let scoredW = 0, earned = 0, totalW = 0;
    for (const r of rows) { const w = Number(r.weight) || 0; totalW += w; if (r.score !== null && r.score !== '' && r.score != null) { scoredW += w; earned += w * Number(r.score) / 100; } }
    const remaining = Math.max(0, 100 - scoredW);
    const need = remaining ? ((target - earned) / remaining) * 100 : null;
    const current = scoredW ? (earned / scoredW) * 100 : null;
    let msg = '';
    if (current != null) msg += 'درجتك الحالية <b class="num">' + current.toFixed(1) + '%</b> من ' + scoredW + '% محسوبة. ';
    if (need != null && scoredW) msg += need > 100 ? '<span class="neg">صعب توصل ' + target + '% — جرّب هدف أقل.</span>' : need <= 0 ? '<span class="pos">ضمنت ' + target + '% 🎉</span>' : 'تحتاج <b class="num">' + Math.ceil(need) + '%</b> بالباقي (' + remaining + '%) عشان توصل ' + target + '%.';
    if (totalW !== 100 && rows.length) msg += ' <span class="small muted">(مجموع الأوزان ' + totalW + '% — المفروض 100)</span>';

      '<div class="btn-row" style="margin-top:10px"><button type="button" class="btn ghost" data-x="as-preset">ميدترم + فاينل + كويزات</button><button type="button" class="btn ghost" data-x="as-add">' + I('plus') + 'تقييم</button></div>' +

  }
  function redrawCourse(root, cc) {
    const tmp = document.createElement('div');

  function courseClick(b, cc, root) {
    const rows = Array.isArray(cc.assessments) ? cc.assessments.slice() : [];

  document.addEventListener('change', (e) => {

  // ================= بطاقات المراجعة =================
  const BOX_DAYS = [0, 1, 2, 4, 8, 16, 30];
  const dueCards = (courseId) => st.cards.filter((c) => (!courseId || c.course_id === courseId) && (!c.due || c.due <= dateKey()));
  function cardsSection() {

    out += '<div class="card flush"><ul class="list">' + lec.concat([{ id: '', name: 'عام', color: '#64748b' }]).map((c) => {

        '<div class="sub">' + all.length + ' بطاقة · حفظت ' + mastered + '</div></div>' + (due ? '<span class="tag brand">راجع ' + due + '</span>' : '<span class="tag">✓</span>') + '</li>';
    }).join('') + '</ul></div>';

  }
  function cardForm() {
    const lec = A.lectures();
    A.openSheet({

      body: '<div class="field"><label>المادة</label><select name="course"><option value="">عام</option>' + lec.map((c) => '<option value="' + c.id + '">' + h(c.name) + '</option>').join('') + '</select></div>' +

  function reviewSheet(courseId) {
    let queue = dueCards(null).filter((x) => (x.course_id || '') === (courseId || ''));
    if (!queue.length) queue = st.cards.filter((x) => (x.course_id || '') === (courseId || '')).slice().sort((a, b) => (a.box || 1) - (b.box || 1)).slice(0, 10);
    let i = 0, shown = false, right = 0, total = queue.length;
    const draw = () => {
      if (i >= queue.length) return '<div class="empty"><div class="ico">🎉</div><b>خلصت المراجعة</b><p>عرفت ' + right + ' من ' + total + '</p></div>';
      const c = queue[i];
      return '<div class="small muted" style="text-align:center;margin-bottom:8px">' + (i + 1) + ' / ' + queue.length + '</div>' +
        '<div class="flash' + (shown ? ' open' : '') + '" data-flip><div class="fq">' + h(c.q) + '</div>' + (shown ? '<div class="fa">' + h(c.a) + '</div>' : '<div class="small muted" style="margin-top:14px">اضغط عشان تشوف الجواب</div>') + '</div>' +

    };
    A.openSheet({
      title: 'مراجعة', cancelLabel: 'تم', body: draw(),
      mount(root) {

          if (e.target.closest('[data-flip]') && !shown) { shown = true; root.innerHTML = draw(); return; }

  let audio = null;
  function stopSound() { if (audio) { try { audio.ctx.close(); } catch (e) { /* تجاهل */ } audio = null; } }
  function playSound(kind) {
    stopSound();
    if (kind === 'none') return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = kind === 'white' ? w : (last + 0.02 * w) / 1.02; d[i] = kind === 'white' ? w * 0.25 : last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filter = ctx.createBiquadFilter(); filter.type = kind === 'rain' ? 'highpass' : 'lowpass'; filter.frequency.value = kind === 'rain' ? 900 : kind === 'waves' ? 500 : 8000;
    const gain = ctx.createGain(); gain.gain.value = kind === 'waves' ? 0.5 : 0.35;
    if (kind === 'waves') { const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.12; lg.gain.value = 0.35; lfo.connect(lg).connect(gain.gain); lfo.start(); }
    src.connect(filter).connect(gain).connect(ctx.destination); src.start();
    audio = { ctx };
  }

    const tKey = 'hayati-timer';
    const get = () => { try { return JSON.parse(localStorage.getItem(tKey) || 'null'); } catch (e) { return null; } };

      '<p class="focus-tip">حط جوالك على «عدم الإزعاج» وخلك هني 🤍</p>';
    document.body.appendChild(ov);
    const tick = () => {

    };
    tick(); focusTimer = setInterval(tick, 500);

    ov.onclick = (e) => {
