<!doctype html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<!-- ريل «شارك ← حياتي» 24 ث، 9:16 (جلسة الديوانية hayati-share-video). نفس أسلوب hayati-motion:
     ورق #F7F4EE، بحري #0E3B43، مرجاني #FF6B4A للكلمة المهمة. شاشات التطبيق لقطات حقيقية (shots.js) ببيانات تجريبية -->
<style>
@font-face { font-family: P; src: url(IBMPlexSansArabic-Bold.ttf); font-weight: 700; }
@font-face { font-family: P; src: url(IBMPlexSansArabic-Regular.ttf); font-weight: 400; }
:root { --sea: #0E3B43; --pearl: #E8DCC4; --coral: #FF6B4A; --paper: #F7F4EE; --ink: #0B2328; --ink2: #33494D; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: P; font-weight: 700; color: var(--ink); }
.abs { position: absolute; }
#bg { inset: 0; background: var(--paper); }
#tint { inset: 0; }
#dark { inset: 0; background: radial-gradient(120% 80% at 50% 40%, #134a52 0%, var(--sea) 50%, #071a1e 100%); }
.w { display: inline-block; will-change: transform, opacity; }
.c { color: var(--coral); }
.h { left: 60px; right: 60px; text-align: center; line-height: 1.15; }
.sub { left: 60px; right: 60px; text-align: center; font: 400 50px/1.45 P; color: var(--ink2); }
.sms { background: #E9E9EB; color: #111; border-radius: 44px; padding: 30px 38px; font: 400 44px/1.4 P; direction: ltr; text-align: left; }
.chip { left: 150px; right: 150px; height: 118px; border-radius: 36px; background: #fff; display: flex; align-items: center; gap: 26px; padding: 0 38px; font-size: 54px; box-shadow: 0 14px 30px -18px rgba(11,35,40,.35); }
.chip .n { width: 68px; height: 68px; border-radius: 50%; background: rgba(14,59,67,.1); display: grid; place-items: center; font-size: 38px; flex: none; }
.chip .x { position: absolute; left: 30px; right: 30px; top: 57px; height: 7px; border-radius: 4px; background: var(--coral); transform-origin: right center; }
.phone { left: 230px; top: 470px; width: 620px; height: 1342px; border-radius: 74px; background: #0b1416; padding: 14px; box-shadow: 0 60px 100px -46px rgba(11,35,40,.65), inset 0 0 0 3px #2a4a50; }
.scr { position: relative; width: 100%; height: 100%; border-radius: 60px; overflow: hidden; background: #fff; }
.scr > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.scr img { object-fit: cover; object-position: top; display: block; }
.touch { width: 110px; height: 110px; border-radius: 50%; background: rgba(255,107,74,.35); border: 5px solid var(--coral); }
.tag { padding: 10px 26px; border-radius: 999px; background: rgba(11,35,40,.82); color: var(--pearl); font: 400 30px P; white-space: nowrap; }
.step { left: 60px; right: 60px; text-align: center; font-size: 72px; line-height: 1.2; }
.step b { display: inline-grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; background: var(--coral); color: #2A0E07; font-size: 54px; margin-inline-end: 22px; vertical-align: middle; }
.note { left: 26px; right: 26px; padding: 26px 28px; border-radius: 38px; background: rgba(250,250,250,.97); color: #111; box-shadow: 0 24px 40px -20px rgba(0,0,0,.6); }
.note .top { display: flex; gap: 14px; align-items: center; font: 400 26px P; color: #555; }
.note .ic { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex: none; }
.note b { display: block; font-size: 38px; margin-top: 12px; }
.note small { display: block; font: 400 30px P; color: #444; margin-top: 4px; }
.note .acts { display: flex; gap: 14px; margin-top: 18px; }
.note .acts span { flex: 1; text-align: center; padding: 16px; border-radius: 22px; background: rgba(14,59,67,.1); color: var(--sea); font-size: 32px; }
.demo { left: 0; right: 0; text-align: center; font: 400 30px P; color: var(--ink2); }
/* بصفحة RTL، العنصر المطلق بدون left يلزق يمين؛ هذي نحرّكها بـ transform من الزاوية */
#fx > .abs { left: 0; top: 0; }
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="tint" class="abs"></div>
<div id="dark" class="abs"></div>
<div id="stage" class="abs" style="inset:0"></div>
<div id="fx" class="abs" style="inset:0;pointer-events:none"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 4);
const ei = (x) => x * x * x;
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const stage = document.getElementById('stage'), fx = document.getElementById('fx');
const add = (h, parent) => { const e = $(h); (parent || stage).appendChild(e); return e; };
const set = (e, o, tf) => { e.style.opacity = o; e.style.transform = tf || ''; e.style.display = o <= 0.001 ? 'none' : ''; };
// نافذة ظهور: يطلع بين a وb ويختفي بين c وd
const win = (t, a, b, c, d) => eo(seg(t, a, b)) * (1 - ei(seg(t, c, d)));

const ARC = 'M 383.3 172.7 A 160 160 0 1 1 300 102.2';
const HA = 'M 304 166 L 196 166 L 264 222 C 204 222 168 254 168 292 C 168 336 206 360 256 360 C 292 360 318 348 338 332';
const LOGO = (ink) => `<svg viewBox="0 0 512 512" style="width:100%;height:100%;overflow:visible"><path class="arc" d="${ARC}" fill="none" stroke="${ink}" stroke-opacity=".28" stroke-width="22" stroke-linecap="round"/><path class="ha" d="${HA}" fill="none" stroke="${ink}" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" cx="352" cy="128" r="30" fill="#FF6B4A"/></svg>`;
const ICON = `<svg viewBox="0 0 512 512" style="width:100%;height:100%;display:block"><rect width="512" height="512" rx="116" fill="#0E3B43"/><path d="${ARC}" fill="none" stroke="#E8DCC4" stroke-opacity=".28" stroke-width="22" stroke-linecap="round"/><path d="${HA}" fill="none" stroke="#E8DCC4" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><circle cx="352" cy="128" r="30" fill="#FF6B4A"/></svg>`;

function words(el, text) {   // *كلمة* = مرجاني
  el.innerHTML = text.split(' ').map((w) => (/^\*.*\*[.؟،]?$/.test(w) ? '<span class="w c">' + w.replace(/\*/g, '') + '</span>' : '<span class="w">' + w + '</span>')).join(' ');
  return [...el.querySelectorAll('.w')];
}
function showWords(ws, t, start, gap, dur) {
  ws.forEach((w, i) => { const x = eo(seg(t, start + i * gap, start + i * gap + (dur || .45))); w.style.opacity = x; w.style.transform = `translateY(${(1 - x) * 40}px)`; });
}
const SMS = 'Your card XX4821 was used for BHD 3.750 at COSTA COFFEE SEEF';

// ===== 1) الهوك (0–3.2): غامق، رسالة البنك تنزل =====
const q1 = add('<div class="abs h" style="top:520px;font-size:112px;color:var(--pearl)"></div>');
const q1w = words(q1, 'وصلتك رسالة *البنك*؟');
const from = add('<div class="abs" style="left:150px;right:150px;top:820px;text-align:center;font:400 38px P;color:rgba(232,220,196,.6)">رسالة نصية · الحين</div>');
const bub = add(`<div class="abs sms" style="left:150px;right:150px;top:890px">${SMS}</div>`);

// ===== 2) قبل (3.2–6.4): 5 خطوات تنشطب، بعدها «الحين: 3» =====
const before = add('<div class="abs h" style="top:250px;font-size:84px">قبل: <span class="c">5</span> خطوات</div>');
const STEPS = ['انسخ الرسالة', 'افتح حياتي', 'اضغط +', 'لصق رسالة بنك', 'الصق'];
const chips = STEPS.map((s, i) => add(`<div class="abs chip" style="top:${470 + i * 160}px"><span class="n">${i + 1}</span>${s}<i class="x"></i></div>`));
const now3 = add('<div class="abs h" style="top:1330px;font-size:120px">الحين: <span class="c">3</span></div>');

// ===== 3) المشاركة (6.4–13.4): جوال فيه الرسائل ← مشاركة ← حياتي ← إضافة =====
const phone = add('<div class="abs phone"><div class="scr"></div></div>');
const scr = phone.querySelector('.scr');
const W = 592, H = 1314;   // داخل الشاشة
const msgs = add(`<div style="background:#fff">
  <div style="position:absolute;left:0;right:0;top:0;height:220px;background:#F4F4F6;border-bottom:1px solid #e3e3e6"></div>
  <div style="position:absolute;left:0;right:0;top:70px;text-align:center"><div style="width:90px;height:90px;border-radius:50%;background:#C9CDD3;margin:0 auto;display:grid;place-items:center;font-size:44px;color:#fff">🏦</div><div style="font:400 30px P;color:#111;margin-top:10px">البنك</div></div>
  <div class="sms msgb" style="position:absolute;left:32px;right:90px;top:330px;font-size:36px;padding:26px 30px;border-radius:36px">${SMS}</div></div>`, scr);
const msgb = msgs.querySelector('.msgb');
const sheet = add(`<div style="top:auto;height:auto;background:transparent">
  <div style="position:absolute;left:0;right:0;bottom:0;height:470px;background:#fff;border-radius:44px 44px 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.35)">
    <div style="width:80px;height:9px;border-radius:5px;background:#d5d5d8;margin:18px auto 0"></div>
    <div style="text-align:center;font-size:36px;margin-top:22px">مشاركة</div>
    <div style="display:flex;justify-content:space-around;margin-top:46px;padding:0 20px;direction:ltr">
      ${[['📋', 'نسخ', '#EEF0F2'], ['📝', 'ملاحظات', '#FFF4D6'], ['hayati', 'حياتي', ''], ['⋯', 'المزيد', '#EEF0F2']].map(([e, l, c]) => `<div style="width:116px;text-align:center"><div class="${e === 'hayati' ? 'hi' : ''}" style="width:116px;height:116px;border-radius:30px;overflow:hidden;background:${c};display:grid;place-items:center;font-size:52px">${e === 'hayati' ? ICON : e}</div><div style="font:400 26px P;margin-top:12px;color:#333">${l}</div></div>`).join('')}
    </div></div></div>`, scr);
sheet.style.height = '100%';
const shot1 = add('<img src="shots/shared.png">', scr);
const shot2 = add('<img src="shots/added.png">', scr);
const touch = add('<div class="abs touch"></div>', fx);
const touch2 = add('<div class="abs touch" style="background:transparent"></div>', fx);
const st1 = add('<div class="abs step" style="top:200px"><b>1</b>اضغط مطوّل</div>');
const st2 = add('<div class="abs step" style="top:200px"><b>2</b>مشاركة ← <span class="c">حياتي</span></div>');
const st3 = add('<div class="abs step" style="top:200px"><b>3</b>راجعها ← <span class="c">إضافة</span></div>');
const done = add('<div class="abs step" style="top:200px"><span class="c">انضافت</span> ✓ 3.750 د.ب</div>');
const ill = add('<div class="abs tag" style="left:400px;top:400px">توضيحي</div>');
const real = add('<div class="abs tag" style="left:330px;top:400px">شاشة «حياتي» الحقيقية</div>');
// مكان أيقونة «حياتي» بقائمة المشاركة، وزر «إضافة» باللقطة (نسبة من الشاشة)
const HI = { x: 0.62, y: 0.775 }, ADD = { x: 0.117, y: 0.585 };
const at = (p) => [230 + 14 + p.x * W, 470 + 14 + p.y * H];

// ===== 4) الثقة (13.4–16.4) =====
const tr1 = add('<div class="abs h" style="top:640px;font-size:118px"></div>');
const tr1w = words(tr1, 'ما نقرا *رسايلك.*');
const tr2 = add('<div class="abs sub" style="top:900px;font-size:60px"></div>');
const tr2w = words(tr2, 'أنت اللي تشارك، وما تنحفظ إلا لما تضغط «إضافة».');

// ===== 5) أندرويد (16.4–20.8): التطبيق مسكّر، وسؤال الحضور يوصل =====
const home = add(`<div style="background:linear-gradient(170deg,#1d5c63 0%,#0E3B43 55%,#081f23 100%)">
  <div style="position:absolute;left:0;right:0;top:470px;text-align:center;color:#fff;font:400 150px P;direction:ltr">11:20</div>
  <div style="position:absolute;left:0;right:0;top:650px;text-align:center;color:rgba(255,255,255,.75);font:400 32px P">الاثنين</div>
  <div style="position:absolute;left:60px;right:60px;bottom:120px;display:flex;justify-content:space-between;direction:ltr">
    ${['📞', '💬', 'hayati', '📷'].map((e) => `<div style="width:112px;height:112px;border-radius:${e === 'hayati' ? '34px' : '50%'};overflow:hidden;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:52px">${e === 'hayati' ? ICON : e}</div>`).join('')}
  </div></div>`, scr);
const note = add(`<div class="note" style="top:60px;height:auto;width:auto">
  <div class="top"><span class="ic">${ICON}</span>حياتي · الحين</div>
  <b>حضرت محاسبة إدارية؟</b><small>خلصت 11:15 ص · S40-2050</small>
  <div class="acts"><span>✓ حضرت</span><span>✗ غبت</span></div></div>`, scr);
const an1 = add('<div class="abs h" style="top:170px;font-size:84px"></div>');
const an1w = words(an1, 'التطبيق *مسكّر،*');
const an2 = add('<div class="abs sub" style="top:290px;font-size:56px;color:var(--ink)">وسؤال الحضور يوصلك بتنبيه</div>');
const andTag = add('<div class="abs tag" style="left:300px;top:1840px">نسخة أندرويد · قيد التجربة · توضيحي</div>');

// ===== 6) الخاتمة (20.8–24) =====
const icon = add(`<div class="abs" style="left:390px;top:560px;width:300px;height:300px;border-radius:70px;overflow:hidden;box-shadow:0 40px 70px -30px rgba(11,35,40,.6)">${ICON}</div>`);
const logo = add(`<div class="abs" style="left:390px;top:560px;width:300px;height:300px">${LOGO('#0E3B43')}</div>`);
const ha = logo.querySelector('.ha'), arc = logo.querySelector('.arc'), ldot = logo.querySelector('.dot');
const HAL = ha.getTotalLength(), ARCL = arc.getTotalLength();
const wm = add('<div class="abs" style="left:0;right:0;top:920px;text-align:center;font-size:170px;line-height:1;padding-bottom:70px;color:var(--sea)">حياتي</div>');
const tag = add('<div class="abs sub" style="top:1170px;font-size:54px"></div>');
const tagw = words(tag, 'رسالة البنك ← *مصروف*، بمشاركة وحدة.');
const beta = add('<div class="abs" style="left:0;right:0;top:1330px;text-align:center"><span style="display:inline-block;padding:16px 40px;border-radius:999px;background:var(--sea);color:var(--pearl);font:400 40px P">قيد التطوير · نسخة تجريبية</span></div>');
const handle = add('<div class="abs" style="left:0;right:0;top:1460px;text-align:center;font:400 44px P;color:var(--ink2);direction:ltr">@hayati.bh</div>');

const demo = add('<div class="abs demo" style="top:1858px">* لقطات ببيانات تجريبية</div>');

const TINTS = [[3.2, '255,180,150'], [6.4, '150,215,190'], [13.4, '255,170,140'], [16.4, '190,175,240'], [20.8, '232,220,196']];
function tintAt(t) {
  let i = 0; while (i < TINTS.length - 1 && t >= TINTS[i + 1][0]) i++;
  const [ta, ca] = TINTS[i], nb = TINTS[Math.min(i + 1, TINTS.length - 1)];
  const x = eio(seg(t, nb[0] - .8, nb[0])), ca3 = ca.split(',').map(Number), cb3 = nb[1].split(',').map(Number);
  return ca3.map((v, k) => Math.round(lerp(v, cb3[k], i < TINTS.length - 1 ? x : 0))).join(',');
}

function setT(t) {
  set(document.getElementById('dark'), 1 - eio(seg(t, 2.9, 3.5)));
  document.getElementById('tint').style.background = `radial-gradient(90% 60% at 80% 0%, rgba(${tintAt(t)},.45), transparent 70%), radial-gradient(80% 50% at 0% 100%, rgba(${tintAt(t)},.25), transparent 70%)`;

  // 1) الهوك
  showWords(q1w, t, .25, .28);
  const o1 = 1 - ei(seg(t, 2.8, 3.3));
  set(q1, o1, `translateY(${-ei(seg(t, 2.8, 3.3)) * 60}px)`);
  const b1 = back(seg(t, .9, 1.5));
  set(bub, clamp(seg(t, .9, 1.2)) * o1, `translateY(${(1 - b1) * 160}px) scale(${.9 + .1 * b1})`);
  set(from, eo(seg(t, 1.3, 1.7)) * o1);

  // 2) قبل
  const o2 = 1 - ei(seg(t, 6.0, 6.5));
  set(before, eo(seg(t, 3.3, 3.7)) * o2, `translateY(${(1 - eo(seg(t, 3.3, 3.7))) * 40}px)`);
  chips.forEach((c, i) => {
    const a = 3.5 + i * .22, x = eo(seg(t, a, a + .35));
    set(c, x * o2 * (1 - .45 * seg(t, 4.9 + i * .12, 5.1 + i * .12)), `translateX(${(1 - x) * -80}px)`);
    c.querySelector('.x').style.transform = `scaleX(${eo(seg(t, 4.75 + i * .12, 5.0 + i * .12))})`;
  });
  const n3 = back(seg(t, 5.3, 5.8));
  set(now3, clamp(seg(t, 5.3, 5.5)) * o2, `scale(${.6 + .4 * n3})`);

  // 3) المشاركة
  const ph = eo(seg(t, 6.3, 6.9)), oPh = 1 - ei(seg(t, 13.1, 13.5));
  const ph5 = eo(seg(t, 16.4, 17.0)), oPh5 = 1 - ei(seg(t, 20.6, 21.0));
  const phO = Math.max(ph * oPh, ph5 * oPh5);
  set(phone, phO, `translateY(${(1 - Math.max(ph * (t < 16 ? 1 : 0), ph5)) * 500}px)`);
  const s3 = t < 15;
  set(msgs, s3 ? 1 : 0);
  // ضغطة مطوّلة على الرسالة: الفقاعة تكبر شوي
  const lp = seg(t, 7.1, 7.6), lpo = 1 - seg(t, 8.9, 9.1);
  msgb.style.transform = `scale(${1 + .04 * eo(lp) * lpo})`;
  msgb.style.boxShadow = lp > 0 && lpo > 0 ? `0 0 0 ${8 * eo(lp)}px rgba(255,107,74,.35)` : 'none';
  const sh = eo(seg(t, 7.8, 8.2));
  set(sheet, s3 ? sh : 0, `translateY(${(1 - sh) * 480}px)`);
  // الدائرة من أيقونة «حياتي» تكشف لقطة التطبيق
  const rv = eio(seg(t, 8.9, 9.5));
  shot1.style.clipPath = `circle(${rv * 160}% at ${HI.x * 100}% ${HI.y * 100}%)`;
  set(shot1, s3 && rv > 0 ? 1 : 0);
  const a2 = eo(seg(t, 11.55, 11.85));
  set(shot2, s3 ? a2 : 0);
  // اللمسات
  const T1 = win(t, 6.95, 7.1, 7.7, 7.9), T2 = win(t, 8.45, 8.6, 8.8, 8.95), T3 = win(t, 11.0, 11.15, 11.4, 11.55);
  const [x1, y1] = [230 + 14 + 0.5 * W, 470 + 14 + 0.33 * H], [x2, y2] = at(HI), [x3, y3] = at(ADD);
  const tp = T1 > 0 ? [x1, y1, T1] : T2 > 0 ? [x2, y2, T2] : [x3, y3, T3];
  set(touch, tp[2] * .9, `translate(${tp[0] - 55}px,${tp[1] - 55}px) scale(${.7 + .3 * tp[2]})`);
  const rp = seg(t, 8.6, 9.2) > 0 && t < 9.2 ? seg(t, 8.6, 9.2) : seg(t, 11.15, 11.75) > 0 && t < 11.75 ? seg(t, 11.15, 11.75) : 0;
  const rpp = t < 10 ? [x2, y2] : [x3, y3];
  set(touch2, rp > 0 ? (1 - rp) * .8 : 0, `translate(${rpp[0] - 55}px,${rpp[1] - 55}px) scale(${1 + rp * 2})`);
  // الخطوات فوق الجوال
  set(st1, win(t, 6.7, 7.0, 7.85, 8.05));
  set(st2, win(t, 8.05, 8.3, 9.4, 9.6));
  set(st3, win(t, 9.6, 9.85, 11.6, 11.8));
  const dn = back(seg(t, 11.85, 12.3));
  set(done, clamp(seg(t, 11.85, 12.0)) * oPh, `scale(${.8 + .2 * dn})`);
  set(ill, win(t, 7.0, 7.3, 8.8, 9.0));
  set(real, win(t, 9.6, 9.9, 13.1, 13.4));

  // 4) الثقة
  showWords(tr1w, t, 13.6, .22);
  showWords(tr2w, t, 14.3, .09);
  const o4 = 1 - ei(seg(t, 16.0, 16.4));
  set(tr1, o4); set(tr2, o4);

  // 5) أندرويد
  const s5 = t >= 15;
  set(home, s5 ? 1 : 0);
  const nt = eo(seg(t, 17.4, 17.9));
  set(note, s5 ? nt : 0, `translateY(${(1 - nt) * -260}px)`);
  showWords(an1w, t, 16.7, .25);
  set(an1, oPh5); set(an2, eo(seg(t, 17.5, 17.9)) * oPh5, `translateY(${(1 - eo(seg(t, 17.5, 17.9))) * 30}px)`);
  set(andTag, win(t, 17.0, 17.3, 20.5, 20.8));

  // 6) الخاتمة: الأيقونة ← الشعار يرسم نفسه ← الاسم
  const ic = back(seg(t, 20.9, 21.4)), icOut = eio(seg(t, 21.7, 22.1));
  set(icon, clamp(seg(t, 20.9, 21.1)) * (1 - icOut), `scale(${(.5 + .5 * ic) * (1 + .2 * icOut)})`);
  const dr = eio(seg(t, 21.8, 22.6));
  set(logo, seg(t, 21.75, 21.85));
  ha.style.strokeDasharray = HAL; ha.style.strokeDashoffset = HAL * (1 - dr);

  ldot.style.opacity = eo(seg(t, 22.5, 22.7)); ldot.style.transformOrigin = '352px 128px'; ldot.style.transform = `scale(${back(seg(t, 22.5, 22.9))})`;
  const wmx = eo(seg(t, 22.3, 22.8));
  set(wm, wmx, `translateY(${(1 - wmx) * 50}px)`);
  showWords(tagw, t, 22.6, .1);
  set(tag, t > 22.5 ? 1 : 0);
  set(beta, eo(seg(t, 23.0, 23.3)));
  set(handle, eo(seg(t, 23.2, 23.5)));

  // ملاحظة اللقطات التجريبية: من أول ما يطلع التطبيق
  set(demo, (t > 6.5 && t < 16.4) || t > 23 ? eo(seg(t, 6.5, 6.9)) * (t > 23 ? eo(seg(t, 23, 23.3)) : 1) : 0);
}
window.setT = setT;
window.READY = document.fonts.ready.then(() => Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => (i.onload = r))))).then(() => setT(0));
</script>
