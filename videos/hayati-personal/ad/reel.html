<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<!-- إعلان من حساب أبو جعفر الشخصي (بصيغة المتكلم) · 20 ث · 1080×1920 · setT(t) -->
<style>
@font-face{font-family:P;src:url(IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(IBMPlexSansArabic-Regular.ttf);font-weight:400}
:root{--sea:#0E3B43;--deep:#0A1A1E;--pearl:#E8DCC4;--coral:#FF6B4A;--mint:#2F9E7A;--red:#E5484D}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--deep);font-family:P,'Helvetica Neue',Arial,sans-serif;color:var(--pearl)}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 75% at 50% 42%,#145a62 0%,var(--sea) 42%,var(--deep) 100%)}
.c{color:var(--coral)}
.abs{position:absolute;left:0;right:0;text-align:center;padding:0 70px}
.big{font-weight:700;line-height:1.15}
#l1{top:660px;font-size:124px}
#l1b{top:860px;font-size:60px}
#l2{top:560px;font-size:130px}
#icon{position:absolute;left:50%;top:880px;width:260px;height:260px;margin-left:-130px;border-radius:60px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
#l2b{top:1200px;font-size:60px}
.stamp{position:absolute;left:50%;text-align:center;font-weight:700;border:12px solid;border-radius:30px;padding:8px 0;white-space:nowrap}
#r1{top:620px;width:520px;margin-left:-260px;font-size:96px;color:var(--red);border-color:var(--red)}
#r2{top:820px;width:520px;margin-left:-260px;font-size:96px;color:var(--red);border-color:var(--red)}
#ok{top:1080px;width:600px;margin-left:-300px;font-size:104px;color:var(--mint);border-color:var(--mint)}
#l3{top:360px;font-size:66px}
#phoneWrap{position:absolute;left:50%;top:520px;width:540px;height:1168px;margin-left:-270px}
#phone{position:absolute;inset:0;border-radius:84px;background:#0b1416;padding:17px;box-shadow:0 70px 120px -40px rgba(0,0,0,.75),inset 0 0 0 3px #2a4a50}
#screen{position:relative;width:100%;height:100%;border-radius:68px;overflow:hidden;background:#F7F4EE}
#screen img{position:absolute;left:0;top:0;width:100%}
#feat{top:1730px;font-size:56px;font-weight:700}
#l5{top:520px;font-size:120px}
#l5b{top:900px;font-size:58px;line-height:1.6}
#cta{top:1250px}
#cta span{display:inline-block;padding:26px 56px;border-radius:999px;background:var(--coral);color:#fff;font-weight:700;font-size:56px}
#plat{top:1420px;font-size:44px;opacity:.85}
#demo{bottom:34px;font-size:30px;opacity:.7}
</style></head><body><div id="stage">
  <div class="abs big" id="l1">طالب بحريني 👋</div>
  <div class="abs" id="l1b">وعندي شي أبي أوريكم</div>
  <div class="abs big" id="l2">و<span class="c">سويت تطبيق</span></div>
  <img id="icon" src="shots/icon.png">
  <div class="abs" id="l2b">اسمه «حياتي» 🤍</div>
  <div class="stamp" id="r1">❌ رفض</div>
  <div class="stamp" id="r2">❌ رفض</div>
  <div class="stamp" id="ok">✅ انقبل</div>
  <div class="abs big" id="l3">Apple رفضته <span class="c">مرتين</span>… وما وقفت</div>
  <div id="phoneWrap"><div id="phone"><div id="screen"><img id="sA" src="shots/money.png"></div></div></div>
  <div class="abs" id="feat"></div>
  <div class="abs big" id="l5">جرّبوه<br><span class="c">وقولوا لي رأيكم</span> 🙏</div>
  <div class="abs" id="l5b">مصاريفك ودراستك وصلاتك بمكان واحد<br>مجاني · بدون إعلانات</div>
  <div class="abs" id="cta"><span>الرابط عندي بالبايو 👆</span></div>
  <div class="abs" id="plat">📱 App Store · أندرويد قريباً 👀</div>
  <div class="abs" id="demo">* لقطات ببيانات تجريبية</div>
</div>
<script>
const $ = (i) => document.getElementById(i);
const cl = (x) => Math.max(0, Math.min(1, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eb = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, f = 0.3) => cl(Math.min(p(t, a, a + f), 1 - p(t, b - f, b)));
const pop = (el, t, a, b) => { const v = eb(p(t, a, a + 0.45)); el.style.opacity = cl(v) * win(t, a, b); el.style.transform = `translateY(${(1 - v) * 40}px)`; };
const FEAT = [['money', 'مصاريفك بثانية'], ['bank', 'الصق رسالة البنك'], ['timetable', 'جدولك من PDF'], ['kitchen', 'وصفات وسعراتها']];
function setT(t) {
  // 0–3: طالب بحريني (ظاهر من الفريم 0)
  $('l1').style.opacity = 1 - p(t, 2.7, 3); $('l1').style.transform = `scale(${1.06 - 0.06 * eo(p(t, 0, 0.4))})`;
  pop($('l1b'), t, 0.5, 3);
  // 3–6: سويت تطبيق
  pop($('l2'), t, 3, 6.2); pop($('l2b'), t, 3.9, 6.2);
  const ic = eb(p(t, 3.4, 3.9)); $('icon').style.opacity = cl(ic) * win(t, 3.4, 6.2); $('icon').style.transform = `scale(${0.5 + 0.5 * ic}) rotate(${(1 - ic) * -20}deg)`;
  // 6–10: رفض مرتين ← انقبل
  pop($('l3'), t, 6.2, 10.2);
  [['r1', 6.7, -9], ['r2', 7.6, 6], ['ok', 8.6, -4]].forEach(([id, a, r]) => { const s = p(t, a, a + 0.3); $(id).style.opacity = cl(s * 3) * win(t, a, 10.2); $(id).style.transform = `rotate(${r}deg) scale(${2.2 - 1.2 * eo(s)})`; });
  // 10–15.6: الجوال و4 ميزات
  const ph = eo(p(t, 10.1, 10.6)), out = eo(p(t, 15.3, 15.7));
  $('phoneWrap').style.opacity = ph * (1 - out); $('phoneWrap').style.transform = `translateY(${(1 - ph) * 700 + out * 700}px)`;
  const k = Math.max(0, Math.min(3, Math.floor((t - 10.4) / 1.3)));
  const src = 'shots/' + FEAT[k][0] + '.png'; if (!$('sA').src.endsWith(src)) $('sA').src = src;
  $('sA').style.top = `${-((t - 10.4) % 1.3) * 30}px`;
  $('feat').textContent = FEAT[k][1]; $('feat').style.opacity = cl(p(t, 10.4, 10.7)) * (1 - out);
  // 15.6–20: الطلب
  pop($('l5'), t, 15.7, 21); pop($('l5b'), t, 16.3, 21);
  const C = eb(p(t, 16.9, 17.3)); $('cta').style.opacity = cl(C); $('cta').style.transform = `scale(${0.9 + 0.1 * C})`;
  $('plat').style.opacity = cl(p(t, 17.4, 17.8));
}
window.setT = setT;
const pre = FEAT.map(([s]) => { const i = new Image(); i.src = 'shots/' + s + '.png'; return i; });
window.READY = Promise.all([document.fonts.ready, ...pre.concat([...document.images]).map((i) => new Promise((r) => (i.complete && i.naturalWidth) ? r() : (i.onload = i.onerror = r)))]).then(() => setT(0));
</script></body></html>
