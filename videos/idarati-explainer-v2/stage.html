<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إداراتي — مسرح فيديو الشرح</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --night:#14213A; --night-2:#0A1120; --gold:#C9963A; --stone:#F5F2EB; --muted:#9AA4B6; --ease:cubic-bezier(.23,1,.32,1); }
  * { box-sizing:border-box; }
  html, body { margin:0; width:540px; height:960px; overflow:hidden; background:var(--night); color:var(--stone); font-family:"IBM Plex Sans Arabic",sans-serif; }
  body::before { content:""; position:absolute; inset:0; background:
    radial-gradient(420px 320px at 50% 62%, rgb(201 150 58 / .16), transparent 70%),
    radial-gradient(600px 400px at 50% -10%, rgb(143 179 232 / .10), transparent 70%); }
  .demo { position:absolute; top:22px; left:22px; font-size:11px; font-weight:600; color:var(--muted); background:rgb(10 17 32 / .7); padding:4px 10px; border-radius:99px; z-index:5; }
  .brand { position:absolute; top:18px; right:22px; display:flex; gap:8px; align-items:center; font:700 15px "Readex Pro"; z-index:5; }
  .brand img { width:24px; height:24px; }

  .cap { position:absolute; top:62px; left:30px; right:30px; height:120px; text-align:center; }
  .cap-in { opacity:0; transform:translateY(10px); transition:opacity .35s var(--ease), transform .45s var(--ease); }
  .cap-in.on { opacity:1; transform:none; }
  .chip { display:inline-flex; align-items:center; gap:8px; font:600 13px "Readex Pro"; color:var(--gold); background:rgb(201 150 58 / .14); border:1px solid rgb(201 150 58 / .4); padding:3px 12px; border-radius:99px; }
  .chip b { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--gold); color:var(--night); font-size:12px; }
  .title { font:700 27px/1.3 "Readex Pro"; margin-top:10px; }
  .sub { font-size:15px; color:#C9CFDA; margin-top:6px; line-height:1.5; }
  .bar { position:absolute; top:52px; left:50%; width:160px; height:3px; margin-left:-80px; border-radius:3px; background:rgb(255 255 255 / .08); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--gold); transition:width .6s var(--ease); margin-right:0; margin-left:auto; }

  .phone { position:absolute; left:50%; top:206px; width:302px; height:640px; margin-left:-151px; border-radius:46px; padding:10px; background:var(--night-2);
    box-shadow:0 0 0 1.5px rgb(201 150 58 / .55), 0 30px 80px rgb(0 0 0 / .55); transition:transform .6s var(--ease), opacity .5s var(--ease); }
  .phone.away { transform:translateY(60px) scale(.94); opacity:0; }
  .screen { position:relative; width:282px; height:620px; border-radius:36px; overflow:hidden; background:#F5F2EB; }
  .screen iframe { position:absolute; top:0; left:0; width:390px; height:858px; border:0; transform:scale(.7231); transform-origin:0 0; }
  .notch { position:absolute; top:8px; left:50%; width:84px; height:22px; margin-left:-42px; border-radius:20px; background:#000; z-index:3; }

  .ring { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; border:3px solid var(--gold); background:rgb(201 150 58 / .25); pointer-events:none; z-index:8; opacity:0; }
  .ring.go { animation:tap .9s var(--ease) forwards; }
  @keyframes tap { 0%{opacity:0; transform:scale(1.6)} 30%{opacity:1; transform:scale(.8)} 55%{opacity:1; transform:scale(.8)} 100%{opacity:0; transform:scale(1.5)} }

  .card { position:absolute; inset:0; display:grid; place-items:center; text-align:center; background:var(--night); z-index:20; opacity:0; pointer-events:none; transition:opacity .4s var(--ease); }
  .card.on { opacity:1; }
  .card img { width:110px; height:110px; }
  .card img.pop { animation:pop .7s var(--ease); }
  @keyframes pop { from { transform:scale(.5) rotate(-22deg); opacity:0; } }
  .card h2 { font:700 40px/1.3 "Readex Pro"; margin:16px 0 0; }
  .card h2.q { font-size:38px; }
  .card p { font-size:18px; color:var(--gold); margin:8px 0 0; }
  .card .feat { font-size:15px; color:#C9CFDA; margin-top:22px; line-height:1.9; }
  .card .tag { display:inline-block; margin-top:24px; font:600 14px "Readex Pro"; color:var(--night); background:var(--gold); padding:6px 16px; border-radius:99px; }
  .card .note { position:absolute; bottom:60px; width:100%; font-size:12px; color:var(--muted); }
  .rise { animation:rise .6s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }
</style>
</head>
<body>
  <div class="brand"><img src="__SYMBOL__" alt=""><span>إداراتي</span></div>
  <div class="demo">* لقطات ببيانات تجريبية</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="cap"><div class="cap-in" id="cap"><span class="chip"><b id="n">1</b><span id="of">من 7</span></span><div class="title" id="t"></div><div class="sub" id="s"></div></div></div>
  <div class="phone away" id="phone"><div class="screen"><div class="notch"></div><iframe name="app" src="./#home"></iframe></div></div>
  <div class="ring" id="ring"></div>
  <div class="card on" id="card"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const SCALE = 0.7231;
  const TOTAL = 7;
  window.stage = {
    card(title, sub, logo) {
      const c = $("card");
      c.innerHTML = `<div>${logo ? `<img class="pop" src="${document.querySelector(".brand img").src}" alt="">` : ""}<h2 class="rise ${logo ? "" : "q"}">${title}</h2>${sub ? `<p class="rise" style="animation-delay:.12s">${sub}</p>` : ""}</div><div class="note">* لقطات ببيانات تجريبية</div>`;
      c.classList.add("on");
    },
    hideCard() { $("card").classList.remove("on"); $("phone").classList.remove("away"); },
    step(n, title, sub) {
      const c = $("cap");
      c.classList.remove("on");
      setTimeout(() => { $("n").textContent = n; $("t").textContent = title; $("s").textContent = sub; c.classList.add("on"); }, 200);
      $("bar").style.width = `${(n / TOTAL) * 100}%`;
    },
    tap(x, y) {
      const f = document.querySelector("iframe").getBoundingClientRect();
      const r = $("ring");
      r.style.left = `${f.left + x * SCALE}px`; r.style.top = `${f.top + y * SCALE}px`;
      r.classList.remove("go"); void r.offsetWidth; r.classList.add("go");
    },
    outro() {
      $("cap").classList.remove("on");
      $("phone").classList.add("away");
      const c = $("card");
      c.innerHTML = `<div><img class="pop" src="${document.querySelector(".brand img").src}" alt=""><h2 class="rise">إداراتي</h2>
        <p class="rise" style="animation-delay:.1s">إيجارات وميزانية البيت بمكان واحد</p>
        <div class="feat rise" style="animation-delay:.25s">وبعد: بحث · تكبير الخط · الوضع الليلي · نسخة احتياطية</div>
        <span class="tag rise" style="animation-delay:.4s">قيد التطوير · نسخة تجريبية</span></div><div class="note">* لقطات ببيانات تجريبية</div>`;
      setTimeout(() => c.classList.add("on"), 250);
    },
  };
</script>
</body>
</html>
