<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<!-- صورة ستوري الحساب الشخصي 1080×1920 · الكلام داخل منطقة الستوري الآمنة (y 250–1650) · فراغ تحت لملصق الرابط -->
<style>
@font-face{font-family:P;src:url(IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(IBMPlexSansArabic-Regular.ttf);font-weight:400}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:P;color:#E8DCC4;
  background:radial-gradient(70% 45% at 50% 52%,#1b6b73 0%,#0E3B43 45%,#05100F 100%)}
.glow{position:absolute;left:50%;top:1010px;width:900px;height:900px;margin:-450px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,74,.22),transparent 60%)}
#logo{position:absolute;left:50%;top:270px;width:150px;height:150px;margin-left:-75px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.t{position:absolute;left:60px;right:60px;text-align:center;font-weight:700;line-height:1.15}
#t1{top:460px;font-size:92px}
#t2{top:570px;font-size:92px;color:#FF6B4A}
.ph{position:absolute;top:760px;width:290px;height:610px;border-radius:46px;background:#0b1416;padding:10px;
  box-shadow:0 50px 90px -30px rgba(0,0,0,.95),inset 0 0 0 3px #2f565c}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:37px;display:block}
#p1{left:105px;transform:rotate(-9deg) translateY(50px) scale(.92)}
#p2{left:395px;z-index:2;transform:translateY(-10px)}
#p3{left:685px;transform:rotate(9deg) translateY(50px) scale(.92)}
.chips{position:absolute;top:1440px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.chip{background:rgba(232,220,196,.1);border:2px solid rgba(232,220,196,.22);border-radius:999px;padding:10px 26px;font-size:34px;font-weight:700}
#soon{top:1540px;font-size:64px}
#soon b{color:#FF6B4A}
#demo{position:absolute;left:0;right:0;top:1640px;text-align:center;font-size:28px;opacity:.6}
#arrow{position:absolute;left:0;right:0;top:1700px;text-align:center;font-size:40px;opacity:.85}
</style></head><body>
<div class="glow"></div>
<svg id="logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#0E3B43" stroke="rgba(232,220,196,.3)" stroke-width="8"/><path d="M 383.3 172.7 A 160 160 0 1 1 300 102.2" fill="none" stroke="#E8DCC4" stroke-opacity=".28" stroke-width="22" stroke-linecap="round"/><path d="M 304 166 L 196 166 L 264 222 C 204 222 168 254 168 292 C 168 336 206 360 256 360 C 292 360 318 348 338 332" fill="none" stroke="#E8DCC4" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><circle cx="352" cy="128" r="30" fill="#FF6B4A"/></svg>
<div class="t" id="t1">صار لي شهور</div>
<div class="t" id="t2">أبني «حياتي»…</div>
<div class="ph" id="p1"><img src="shots/01_week.png"></div>
<div class="ph" id="p2"><img src="shots/03_kitchen.png"></div>
<div class="ph" id="p3"><img src="shots/02_sms.png"></div>
<div class="chips"><span class="chip">📅 الجدول</span><span class="chip">💳 الفلوس</span><span class="chip">🍳 المطبخ</span></div>
<div class="t" id="soon">قريباً على <b>الآيفون 👀</b></div>
<div id="demo">* لقطات ببيانات تجريبية</div>
<div id="arrow">👇</div>
</body></html>
