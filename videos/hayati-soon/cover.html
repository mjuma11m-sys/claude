<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<!-- كفر ريل «قريباً 👀» 1080×1920 · كل المهم داخل المربع الوسطي (y 420–1500) عشان ينقرا بشبكة البروفايل -->
<style>
@font-face{font-family:P;src:url(IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(IBMPlexSansArabic-Regular.ttf);font-weight:400}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:P;color:#E8DCC4;
  background:radial-gradient(90% 55% at 50% 50%,#145a62 0%,#0E3B43 45%,#05100F 100%)}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:700;line-height:1.15}
#t1{top:440px;font-size:112px}
#t2{top:568px;font-size:112px;color:#FF6B4A}
.ph{position:absolute;top:750px;width:250px;height:520px;border-radius:46px;background:#0b1416;padding:10px;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9),inset 0 0 0 3px #2a4a50}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:37px;display:block}
#p1{left:150px;transform:rotate(-8deg) translateY(30px)}
#p2{left:415px;z-index:2}
#p3{left:680px;transform:rotate(8deg) translateY(30px)}
#soon{top:1318px;font-size:88px}
#demo{position:absolute;left:0;right:0;top:1444px;text-align:center;font-size:30px;font-weight:400;opacity:.7}
</style></head><body>
<div class="t" id="t1">دراستك وفلوسك</div>
<div class="t" id="t2">وأكلك… بتطبيق واحد</div>
<div class="ph" id="p1"><img src="shots/01_week.png"></div>
<div class="ph" id="p2"><img src="shots/03_kitchen.png"></div>
<div class="ph" id="p3"><img src="shots/02_sms.png"></div>
<div class="t" id="soon">حياتي · قريباً 👀</div>
<div id="demo">* لقطات ببيانات تجريبية</div>
</body></html>
