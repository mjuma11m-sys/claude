<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(../IBMPlexSansArabic-Regular.ttf);font-weight:400}
*{box-sizing:border-box}html,body{margin:0;background:#111;font-family:P}
.wrap{display:flex;gap:60px;padding:50px;width:1340px}
.s{position:relative;width:600px;height:1067px;border-radius:40px;overflow:hidden;background:#000 center/cover}
.bar{position:absolute;top:18px;left:18px;right:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.bar i{display:block;height:100%;width:60%;background:#fff;border-radius:3px}
.who{position:absolute;top:38px;right:22px;display:flex;align-items:center;gap:12px;color:#fff;font-size:22px;font-weight:700;direction:rtl}
.who span{width:44px;height:44px;border-radius:50%;background:#E8DCC4;display:inline-block;border:2px solid #fff}
.reply{position:absolute;bottom:18px;left:18px;right:18px;height:58px;border-radius:30px;border:2px solid rgba(255,255,255,.6);color:rgba(255,255,255,.8);font-size:20px;display:flex;align-items:center;padding:0 24px}
.txt{position:absolute;left:30px;right:30px;top:110px;text-align:center;color:#fff;font-weight:700;font-size:26px;line-height:1.4}
.txt b{background:rgba(0,0,0,.55);padding:4px 14px;border-radius:10px;-webkit-box-decoration-break:clone}
.link{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;background:#fff;color:#0E3B43;border-radius:14px;padding:10px 22px;font-weight:700;font-size:24px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.mention{position:absolute;left:50%;transform:translateX(-50%) rotate(-3deg);bottom:100px;background:linear-gradient(90deg,#FF6B4A,#f7b267);color:#fff;border-radius:10px;padding:4px 16px;font-weight:700;font-size:22px;direction:ltr}
.poll{position:absolute;left:50%;transform:translateX(-50%);bottom:205px;width:300px;background:#fff;border-radius:18px;padding:12px;text-align:center;color:#111;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.poll h4{margin:2px 0 10px;font-size:22px}
.poll div{display:flex;gap:8px}.poll span{flex:1;background:#f0f0f0;border-radius:10px;padding:8px;font-weight:700;font-size:20px;color:#0E3B43}
.cap{color:#ddd;text-align:center;margin-top:16px;font-size:24px}
</style></head><body><div class="wrap">
<div><div class="s" style="background-image:url(story-end.jpg)"><div class="bar"><i></i></div><div class="who">Mohammed <span></span></div>
<div class="txt"><b>صار لي شهور أبنيه 🤍 الرابط تحت 👇</b></div>
<div class="poll" style="bottom:auto;top:240px;transform:translateX(-50%) scale(.7);transform-origin:50% 0"><h4>تجربه؟ 👀</h4><div><span>أكيد</span><span>يمكن</span></div></div>
<div class="link">🔗 سجّل بقائمة الانتظار</div><div class="mention">@HAYATI.BH</div>
<div class="reply">Send message</div></div><div class="cap">الفيديو (آخر لقطة)</div></div>
<div><div class="s" style="background-image:url(../story-image.jpg)"><div class="bar"><i style="width:30%"></i></div><div class="who">Mohammed <span></span></div>
<div class="link" style="bottom:84px">🔗 سجّل بقائمة الانتظار</div><div class="mention" style="top:100px;bottom:auto;left:120px;transform:rotate(-4deg)">@HAYATI.BH</div>
<div class="reply">Send message</div></div><div class="cap">الصورة</div></div>
</div></body></html>
