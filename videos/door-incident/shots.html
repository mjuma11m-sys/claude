<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, c = document.getElementById('c'), g = c.getContext('2d');
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();

function grain(a) { // film grain
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * a; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
}
function vignette(s = 0.85) {
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${s})`);
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function mudTexture(x, y, w, h, base, amt) { // mud-brick wall
  g.fillStyle = base; g.fillRect(x, y, w, h);
  for (let i = 0; i < 9000; i++) {
    const px = rr(x, x + w), py = rr(y, y + h), s = rr(2, 16), a = rr(0.02, amt);
    g.fillStyle = rnd() > 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,220,170,${a * 0.6})`;
    g.fillRect(px, py, s * rr(1, 3), s);
  }
}
function planks(x, y, w, h, tone) { // wooden door
  const n = 6, pw = w / n;
  for (let i = 0; i < n; i++) {
    const l = tone + rr(-6, 6);
    g.fillStyle = `hsl(28,32%,${l}%)`; g.fillRect(x + i * pw, y, pw - 3, h);
    for (let k = 0; k < 90; k++) { g.fillStyle = `rgba(20,10,0,${rr(0.05, 0.25)})`; g.fillRect(x + i * pw + rr(0, pw - 4), y + rr(0, h), rr(1, 3), rr(20, 120)); }
  }
  g.fillStyle = 'rgba(15,8,2,.8)'; // iron straps
  for (const f of [0.18, 0.78]) g.fillRect(x, y + h * f, w, 18);
}
function dust(n, x0, y0, x1, y1, a = 0.7, col = '255,230,180') {
  for (let i = 0; i < n; i++) { g.beginPath(); g.fillStyle = `rgba(${col},${rr(0.1, a)})`; g.arc(rr(x0, x1), rr(y0, y1), rr(0.8, 3.2), 0, 7); g.fill(); }
}
function shaft(x0, y0, x1, y1, w0, w1, a, col = '255,225,170') { // light beam
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.beginPath(); g.moveTo(x0 - w0 / 2, y0); g.lineTo(x0 + w0 / 2, y0); g.lineTo(x1 + w1 / 2, y1); g.lineTo(x1 - w1 / 2, y1); g.fill();
}

const SHOTS = {
  house() { // exterior at dusk
    const sky = g.createLinearGradient(0, 0, 0, H * 0.62);
    sky.addColorStop(0, '#070b1c'); sky.addColorStop(0.55, '#2a2440'); sky.addColorStop(1, '#c4693a');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 140; i++) { g.fillStyle = `rgba(255,255,255,${rr(0.2, 0.9)})`; g.fillRect(rr(0, W), rr(0, H * 0.4), 2, 2); }
    g.fillStyle = '#0b0805'; g.fillRect(0, H * 0.62, W, H); // ground
    const hx = 170, hy = 760, hw = 740, hh = 760; // house
    mudTexture(hx, hy, hw, hh, '#6e5036', 0.18);
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(hx, hy, hw, 40); // roof edge
    const dx = 440, dy = 1080, dw = 200, dh = 440; // door glowing
    const gl = g.createRadialGradient(dx + dw / 2, dy + dh, 20, dx + dw / 2, dy + dh, 700);
    gl.addColorStop(0, 'rgba(255,170,70,.55)'); gl.addColorStop(1, 'rgba(255,170,70,0)'); g.fillStyle = gl; g.fillRect(0, 900, W, 1020);
    planks(dx, dy, dw, dh, 20);
    g.fillStyle = 'rgba(255,190,90,.8)'; g.fillRect(dx + dw - 6, dy + 10, 3, dh - 10); // light gap
    g.fillStyle = '#05060a'; // palm silhouette
    g.fillRect(960, 860, 22, 700);
    for (let i = 0; i < 9; i++) { const a = -2.9 + i * 0.3; g.save(); g.translate(971, 860); g.rotate(a); g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(110, -70, 230, 40 + Math.abs(Math.cos(a)) * 50); g.lineWidth = 9; g.strokeStyle = '#05060a'; g.stroke(); g.restore(); }
    g.fillStyle = '#0b0805'; g.fillRect(0, 1520, W, 400);
    dust(120, 0, 1300, W, 1620, 0.35, '230,170,110');
    vignette(0.9);
  },
  interior() { // closed door, light shaft
    mudTexture(0, 0, W, H, '#2b2018', 0.22);
    const dx = 300, dy = 380, dw = 480, dh = 1100;
    g.fillStyle = '#05030a'; g.fillRect(dx - 24, dy - 24, dw + 48, dh + 24);
    planks(dx, dy, dw, dh, 17);
    g.fillStyle = '#0d0a07'; g.fillRect(0, 1480, W, 440); // floor
    shaft(150, 0, 700, 1600, 160, 500, 0.5);
    shaft(190, 0, 760, 1600, 90, 300, 0.35);
    dust(260, 100, 900, 0, 1600, 0.8);
    g.fillStyle = 'rgba(255,225,170,.25)'; g.beginPath(); g.ellipse(640, 1560, 360, 50, 0, 0, 7); g.fill();
    vignette(0.92);
  },
  golden() { // golden light behind the door
    g.fillStyle = '#050403'; g.fillRect(0, 0, W, H);
    const cx = W / 2, dx = 330, dy = 420, dw = 420, dh = 1080;
    const gl = g.createRadialGradient(cx, 960, 40, cx, 960, 1100);
    gl.addColorStop(0, 'rgba(255,200,90,.95)'); gl.addColorStop(0.35, 'rgba(230,150,40,.45)'); gl.addColorStop(1, 'rgba(120,70,10,0)');
    g.fillStyle = gl; g.fillRect(0, 0, W, H);
    g.fillStyle = '#0a0705'; g.fillRect(dx - 30, dy - 30, dw + 60, dh + 30);
    planks(dx, dy, dw, dh, 9);
    g.globalCompositeOperation = 'lighter'; // light bleeding through gaps
    for (let i = 1; i < 6; i++) { g.fillStyle = 'rgba(255,200,90,.55)'; g.fillRect(dx + i * (dw / 6) - 3, dy, 4, dh); }
    g.fillStyle = 'rgba(255,190,80,.35)'; g.fillRect(dx - 4, dy, 4, dh); g.fillRect(dx + dw, dy, 4, dh);
    dust(300, 150, 300, 930, 1500, 0.9, '255,220,140');
    g.globalCompositeOperation = 'source-over';
    vignette(0.88);
  },
  aftermath() { // broken door, empty room
    mudTexture(0, 0, W, H, '#241b14', 0.22);
    g.fillStyle = '#0c0907'; g.fillRect(0, 1450, W, 470);
    shaft(860, 0, 460, 1500, 260, 700, 0.42, '255,235,190');
    g.save(); g.translate(240, 1480); g.rotate(-0.32); planks(0, -1050, 340, 1050, 14); g.restore(); // leaning door
    for (let i = 0; i < 40; i++) { g.save(); g.translate(rr(200, 900), rr(1480, 1760)); g.rotate(rr(0, 3)); g.fillStyle = `hsl(28,28%,${rr(12, 24)}%)`; g.fillRect(0, 0, rr(14, 70), rr(4, 10)); g.restore(); }
    g.fillStyle = 'rgba(255,225,170,.3)'; g.beginPath(); g.ellipse(520, 1620, 340, 60, 0, 0, 7); g.fill();
    dust(260, 150, 200, 1000, 1700, 0.75);
    vignette(0.92);
  },
};
window.draw = (name) => { seed = 7; SHOTS[name](); grain(22); };
window.READY = true;
</script>
