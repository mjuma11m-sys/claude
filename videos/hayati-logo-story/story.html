<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(IBMPlexSansArabic-Regular.ttf);font-weight:400}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A1A1E;font-family:P;color:#E8DCC4}
#bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 40%,#13474f 0%,#0E3B43 38%,#0A1A1E 100%)}
#mark{position:absolute;left:220px;top:470px;width:640px;height:640px;overflow:visible}
.cap{position:absolute;left:60px;right:60px;top:1240px;text-align:center;opacity:0}
.cap h2{font-size:80px;line-height:1.25}
.cap p{font-size:46px;color:#6EC5C0;margin-top:18px;font-weight:400;line-height:1.4}
#q{position:absolute;left:60px;right:60px;top:760px;text-align:center;font-size:96px;font-weight:700;line-height:1.3;opacity:0}
.tag{position:absolute;font-size:40px;font-weight:700;opacity:0;white-space:nowrap}
#sw{position:absolute;left:0;right:0;top:1240px;display:flex;justify-content:center;gap:40px;opacity:0}
.s{width:270px;text-align:center}
.s i{display:block;width:150px;height:150px;border-radius:50%;margin:0 auto 18px;border:3px solid rgba(232,220,196,.35)}
.s b{display:block;font-size:44px}.s span{font-size:34px;color:#6EC5C0}
#lock{position:absolute;left:0;right:0;top:1180px;text-align:center;opacity:0}
#lock .w{font-size:150px;font-weight:700;line-height:1}
#lock .e{font-size:46px;letter-spacing:12px;opacity:.6;direction:ltr;margin-top:24px}
#lock .b{display:inline-block;margin-top:64px;background:#FF6B4A;color:#2A0E07;border-radius:999px;padding:14px 44px;font-size:40px;font-weight:700}
</style></head><body>
<div id="bg"></div>
<div id="q">شنو قصة<br>شعار «حياتي»؟</div>
<svg id="mark" viewBox="0 0 512 512">
 <path id="ring" d="M 383.3 172.7 A 160 160 0 1 1 300 102.2" fill="none" stroke="#E8DCC4" stroke-opacity=".28" stroke-width="22" stroke-linecap="round"/>
 <circle id="sun" r="12" fill="#E8DCC4"/>
 <path id="ain" d="M 304 166 L 196 166 L 264 222 C 204 222 168 254 168 292 C 168 336 206 360 256 360 C 292 360 318 348 338 332" fill="none" stroke="#E8DCC4" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
 <circle id="pulse" cx="352" cy="128" r="30" fill="none" stroke="#FF6B4A" stroke-width="6"/>
 <circle id="dot" cx="352" cy="128" r="30" fill="#FF6B4A"/>
</svg>
<div class="tag" id="fajr" style="left:770px;top:640px">🌅 الفجر</div>
<div class="tag" id="isha" style="left:330px;top:520px">🌙 العشا</div>
<div class="cap" id="c1"><h2>القوس = مسار يومك</h2><p>يومك من الفجر للعشا</p></div>
<div class="cap" id="c2"><h2>بالنص «ح»</h2><p>أول حرف من «حياتي»</p></div>
<div class="cap" id="c3"><h2>والنقطة المرجانية = أنت</h2><p>وين أنت الحين بيومك</p></div>
<div id="sw">
 <div class="s"><i style="background:#0E3B43"></i><b>بحري</b><span>بحر البحرين</span></div>
 <div class="s"><i style="background:#E8DCC4"></i><b>لؤلؤي</b><span>لؤلؤ الغوص</span></div>
 <div class="s"><i style="background:#FF6B4A"></i><b>مرجاني</b><span>لمستك أنت</span></div>
</div>
<div id="lock"><div class="w">حياتي</div><div class="e">HAYATI</div><div class="b">قيد التطوير · نسخة تجريبية</div></div>
<script>
const $=(i)=>document.getElementById(i);
const ring=$('ring'),ain=$('ain'),dot=$('dot'),sun=$('sun'),pulse=$('pulse'),mark=$('mark');
const LR=ring.getTotalLength(),LA=ain.getTotalLength();
ring.style.strokeDasharray=LR;ain.style.strokeDasharray=LA;
const cl=(x)=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const out=(x)=>1-Math.pow(1-x,3),io=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=(x)=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fade=(id,a,b,dy=40)=>{const e=$(id),i=out(seg(t0,a,a+.5)),o=seg(t0,b-.4,b);e.style.opacity=i*(1-o);e.style.transform='translateY('+(dy*(1-i)-dy*o)+'px)'};
let t0=0;
function setT(t){t0=t;
 fade('q',.2,3.0);
 // القوس: ينرسم ببطء مع «شمس» صغيرة على طرفه
 const r=io(seg(t,3.2,7.0)); ring.style.opacity=t>3.2?1:0; ring.style.strokeDashoffset=LR*(1-r);
 const p=ring.getPointAtLength(LR*r); sun.setAttribute('cx',p.x); sun.setAttribute('cy',p.y); sun.style.opacity=(t>3.2&&t<7.4)?1-seg(t,7.0,7.4):0;
 fade('fajr',3.3,7.6,0); fade('isha',6.3,7.6,0); fade('c1',3.6,7.6);
 ain.style.opacity=t>7.8?1:0; ain.style.strokeDashoffset=LA*(1-io(seg(t,7.8,9.8))); fade('c2',8.0,11.0);
 const d=seg(t,11.2,11.8); dot.setAttribute('r',30*(d?back(d):0));
 const pl=((t-11.8)%1.2)/1.2; pulse.style.opacity=(t>11.8&&t<14.6)?(1-pl)*.9:0; pulse.setAttribute('r',30+40*pl);
 fade('c3',11.4,14.6);
 fade('sw',14.8,18.6);
 const m=io(seg(t,18.4,19.2)); mark.style.transform='translateY('+(-40*m)+'px) scale('+(1-.15*m)+')';
 fade('lock',18.8,99);
 document.body.style.opacity=1-seg(t,22.4,23);
}
document.fonts.ready.then(()=>{setT(0);window.READY=true});
</script></body></html>
