<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(IBMPlexSansArabic-Regular.ttf);font-weight:400}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:P;color:#E8DCC4;background:radial-gradient(120% 75% at 50% 45%,#145a62 0%,#0E3B43 42%,#0A1A1E 100%)}
/* كل المهم داخل المربع 1:1 بالنص (y 420–1500) عشان يبين بشبكة البروفايل */
#t{position:absolute;top:500px;right:70px;width:560px;font-weight:700;line-height:1.08}
#t .a{font-size:150px}#t .b{font-size:96px}#t .b span{color:#FF6B4A}
#chip{position:absolute;top:1010px;right:70px;padding:18px 34px;border-radius:999px;background:#FF6B4A;color:#fff;font-size:44px;font-weight:700}
#beta{position:absolute;top:1140px;right:70px;padding:12px 30px;border-radius:999px;border:3px solid rgba(232,220,196,.45);font-size:34px;font-weight:700}
#ph{position:absolute;top:480px;left:60px;width:420px;height:910px;border-radius:66px;background:#0b1416;padding:13px;box-shadow:0 60px 110px -40px rgba(0,0,0,.8),inset 0 0 0 3px #2a4a50;transform:rotate(-6deg)}
#ph img{width:100%;height:100%;border-radius:54px;object-fit:cover;object-position:top}
#isl{position:absolute;top:36px;left:50%;width:120px;height:36px;margin-left:-60px;border-radius:20px;background:#000}
#demo{position:absolute;top:1400px;left:0;right:0;text-align:center;font-size:28px;font-weight:400;opacity:.7}
</style></head><body>
<div id="ph"><img src="shots/03_split.png"><div id="isl"></div></div>
<div id="t"><div class="a">حياتي</div><div class="b">صار على<br><span>الآيفون</span> 📱</div></div>
<div id="chip">قسّم العشا مع ربعك 🍣</div>
<div id="beta">🛠️ قيد التطوير · نسخة تجريبية</div>
<div id="demo">* لقطات ببيانات تجريبية</div>
</body></html>
