.hl .ring{width:640px;height:640px;border-radius:50%;background:#1B2B4A;display:grid;place-items:center;border:10px solid var(--gold)}

.tag{position:relative;display:inline-block;align-self:flex-start;background:var(--gold);color:var(--night);font-weight:700;font-size:34px;padding:10px 30px;border-radius:999px}
